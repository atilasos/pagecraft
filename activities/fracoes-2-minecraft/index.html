<!-- PROTÓTIPO DESCARTÁVEL. Três disposições da atividade existente, via ?variant=A|B|C.

     Estado apenas em memória; sem contas, relatórios ou ligação ao Studio. -->
<html lang="pt-PT">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<style>

*{box-sizing:border-box}body{margin:0;font-size:22px;line-height:1.45}button,a{ -webkit-tap-highlight-color:transparent}button{font:inherit;font-weight:700;color:inherit;cursor:pointer;min-height:56px;border:2px solid var(--line);border-radius:14px;background:var(--surface);padding:10px 18px;touch-action:manipulation}button:hover:not(:disabled){border-color:var(--green)}button:focus-visible,a:focus-visible,summary:focus-visible{outline:4px solid #2575c0;outline-offset:4px}button:disabled{cursor:default;opacity:.5}button[aria-pressed=true]{background:var(--lime);border-color:var(--green);box-shadow:inset 0 0 0 1px var(--green)}button.primary{background:var(--green);color:var(--surface);border-color:var(--green)}button.primary:disabled{background:#dce3d7;color:#54635c;border-color:#dce3d7;opacity:1}h1,h2,h3,p{margin:0}h1{font-size:clamp(30px,3.1vw,44px);line-height:1.12;letter-spacing:-.035em;max-width:21ch}h2{font-size:clamp(26px,2.5vw,34px);line-height:1.2;letter-spacing:-.02em}h3{font-size:23px}p{max-width:48ch}.small{font-size:17px}.muted{color:var(--muted)}.brand{display:flex;gap:12px;align-items:center;font-weight:800;font-size:18px;letter-spacing:-.02em}.brand-mark{display:grid;grid-template-columns:repeat(2,13px);gap:3px;transform:rotate(-9deg)}.brand-mark i{height:13px;background:var(--green);border-radius:2px}.brand-mark i:last-child{background:var(--yellow)}.tag{border:1px solid #adc3b2;border-radius:100px;padding:6px 12px;font-size:15px;font-weight:700}.top{max-width:1280px;margin:auto;padding:24px 32px;display:flex;justify-content:space-between;align-items:center;gap:16px}.top .tag{background:#eff4e5}.layout{max-width:1280px;margin:auto;padding:12px 32px 180px}.eyebrow{font-size:17px;font-weight:800;margin-bottom:12px;color:var(--green)}.lead{margin-top:16px;color:var(--muted)}.step-nav{display:flex;gap:8px;flex-wrap:wrap}.step-nav button{background:transparent;font-size:18px;min-height:56px;border-color:transparent;display:flex;align-items:center;gap:10px;padding:8px 12px}.step-nav button[aria-current=step]{background:var(--green);color:var(--surface)}.step-nav button:disabled{opacity:1;color:#77877e}.step-num{border:1px solid currentColor;width:29px;height:29px;border-radius:50%;display:grid;place-items:center;font-size:16px}.scene{border:2px solid #c3d0b7;border-radius:28px;background:#e6efd7;min-width:0;padding:24px;position:relative;overflow:hidden}.scene-label{display:flex;justify-content:space-between;gap:8px;font-size:17px;font-weight:700;margin-bottom:18px}.material{max-width:650px;margin:0 auto;background:#fffdf7bd;border-radius:22px;padding:26px 20px}.bread{display:block;width:100%;height:auto;max-height:155px;overflow:visible}.cuts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}.cuts button{padding:8px;line-height:1.1;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:17px}.cut-icon{width:62px;height:22px;background:#e7b665;position:relative;border:2px solid #976336;border-radius:8px}.cut-icon:after{content:"";position:absolute;left:var(--cut);top:-4px;height:26px;border-left:3px dashed var(--ink)}.cut-controls .prompt{font-size:19px;text-align:center}.companions{display:flex;justify-content:space-around;margin-top:18px;font-size:17px;font-weight:700}.companion{display:flex;align-items:center;gap:8px}.face{width:30px;height:30px;background:#ecc399;border:3px solid #5d5844;box-shadow:inset 0 6px #665340;position:relative}.face:after{content:"··";position:absolute;top:0;left:6px;font-size:23px;line-height:20px}.face.two{background:#c79465;box-shadow:inset 0 6px #46352e}.question{display:grid;gap:16px;align-content:start}.choices{display:flex;gap:10px;flex-wrap:wrap}.choices button{flex:1;min-width:115px}.feedback{padding:16px 18px;background:#edf3e4;border:1px solid #c3d5b7;border-radius:18px;margin-top:18px;font-size:19px}.feedback.hint{background:#fff0ce;border-color:#e4c57e;color:#634619}.feedback strong{display:block;margin-bottom:6px}.hint-bars{display:grid;gap:8px;background:#fffaf0;padding:14px;border-radius:12px;margin-top:12px}.hint-bar{height:26px;width:var(--length);min-width:12%;background:#d7a552;border:2px solid #7d582b;border-radius:4px}.hint-bar:last-child{background:#8cae8d;border-color:#46664e}.equal-groups{display:flex;gap:12px;margin-top:12px}.equal-group{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;flex:1;border:2px dashed #967434;padding:7px;border-radius:9px}.equal-group span{height:22px;border:1px solid #947c56;background:#fffbef}.block-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:8px auto 20px;max-width:460px}.block{aspect-ratio:1;min-height:56px;border-radius:4px;padding:0;background:#dbd8bc;border:3px solid #999778;box-shadow:inset 0 8px #f0eed9,inset -8px -7px #c4c19f;color:var(--green);font-size:28px}.block[aria-pressed=true]{border-color:#32694c;background:#81b86a;box-shadow:inset 0 8px #add584,inset -8px -7px #63a251}.grid-caption{text-align:center;font-size:18px}.verify{display:block;width:100%;margin-top:15px}.wall{display:grid;grid-template-columns:repeat(8,1fr);gap:3px;padding:24px 0 5px;max-width:520px;margin:auto}.wall span{aspect-ratio:1;background:#8d9d74;border:2px solid #526249;box-shadow:inset 0 6px #c1cda2,inset -4px -4px #6a805b}.ground{height:10px;background:#8b6947;max-width:540px;margin:auto;border-top:4px solid #528249}.minecraft-scene{padding:28px 10px;min-height:220px;display:flex;flex-direction:column;justify-content:center}.build-instruction{font-size:21px;text-align:center;max-width:none}.declaration{margin-top:18px;width:100%;display:flex;gap:12px;align-items:center;justify-content:center}.checkmark{width:27px;height:27px;display:grid;place-items:center;border:2px solid currentColor;border-radius:5px}.number-choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}.number-choice{display:flex;flex-direction:column;gap:9px;align-items:center}.mini-wall{display:grid;grid-template-columns:repeat(4,11px);gap:2px}.mini-wall i{height:11px;background:#dddcc9;border:1px solid #858f77}.mini-wall i.painted{background:#689d56}.bottom-nav{display:flex;justify-content:space-between;align-items:center;gap:18px;padding-top:25px}.next-area{text-align:right}.remaining{font-size:17px;margin-bottom:8px;color:var(--muted)}.next{min-width:165px}.back{background:transparent;border-color:transparent}.done{background:var(--surface);border:2px solid var(--line);padding:40px;border-radius:28px;margin:30px auto;max-width:760px;text-align:center}.done h1{max-width:none}.done .choices{margin-top:26px}.done-symbol{display:block;width:80px;height:80px;background:var(--lime);border:3px solid var(--green);border-radius:50%;font-size:45px;margin:0 auto 24px}.done p{margin:16px auto}.done-list{display:grid;gap:8px;text-align:left;max-width:450px;margin:24px auto}.done-list span{padding:12px;background:#edf3e7;border-radius:8px}.hidden{display:none!important}

.mesa .intro{display:flex;justify-content:space-between;gap:25px;align-items:end;margin-bottom:30px}.mesa .step-nav{margin:24px 0}.mesa .work-area{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(260px,1fr);gap:32px;align-items:center}.mesa .question{padding:12px 8px}.mesa .scene{box-shadow:var(--shadow)}
/* B: banda desenhada com três vinhetas, lida da esquerda para a direita. */
body[data-variant=B]{background:#f8eee1}.comic .intro{text-align:center;margin:10px 0 28px}.comic h1{max-width:none}.comic .step-nav{justify-content:center;margin:18px 0}.comic .panels{display:grid;grid-template-columns:.6fr 1.35fr 1fr;gap:14px;align-items:stretch}.comic .comic-panel{border:3px solid var(--ink);border-radius:4px 18px 5px 14px;background:var(--surface);min-width:0;padding:20px;box-shadow:5px 5px 0 #233e3815}.comic .scene{border:0;border-radius:8px;padding:12px;background:#e8edda;margin-top:16px}.comic .scene .material{padding:16px 8px}.comic .panel-heading{display:flex;gap:10px;align-items:center;font-size:17px;font-weight:800;margin-bottom:18px}.comic .panel-heading span{background:var(--yellow);border:2px solid var(--ink);border-radius:50%;width:32px;height:32px;display:grid;place-items:center}.comic .story-illustration{margin:30px auto;max-width:140px}.comic .story-illustration .companions{gap:16px}.comic .story-illustration .face{width:45px;height:45px}.comic .story-illustration .face:after{left:12px;top:8px}.comic .story-copy{font-size:21px;margin-top:16px}.comic .cuts{gap:6px}.comic .cuts button{font-size:15px;padding:8px 4px}.comic .cut-icon{width:48px}.comic .question h2{font-size:26px}.comic .bottom-nav{margin-top:12px}
/* C: oficina com percurso vertical e material numa bancada separada. */
body[data-variant=C]{background:#edf0f2}.workshop{display:grid;grid-template-columns:220px minmax(0,1fr);gap:30px}.workshop .sidebar{border-right:2px solid #c8d6d3;padding:20px 20px 20px 0}.workshop .sidebar h1{font-size:30px}.workshop .step-nav{display:grid;gap:16px;margin-top:28px}.workshop .step-nav button{width:100%;text-align:left;justify-content:flex-start}.workshop .step-nav button[aria-current=step]{background:var(--ink)}.workshop .bench{min-width:0}.workshop .bench-title{display:flex;justify-content:space-between;align-items:center;gap:15px;margin:18px 0 24px}.workshop .work-area{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(240px,1fr);gap:18px;background:var(--surface);padding:20px;border-radius:24px;border:1px solid #ccd8d2}.workshop .scene{border:0;background:#dce8e6;border-radius:16px;padding:18px}.workshop .question{padding:8px}.workshop .question h2{font-size:26px}
/* Ferramentas de revisão; apenas em localhost ou ficheiro local. */
.prototype-switcher{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#203b36;color:#fffaf0;box-shadow:0 8px 30px #12282330;border:1px solid #607a6a;border-radius:18px;padding:8px;z-index:20;min-width:335px;max-width:calc(100% - 20px)}.switch-row{display:flex;align-items:center;gap:10px}.prototype-switcher button{background:#36534a;color:#fffaf0;border-color:#597468;min-width:56px;padding:8px}.variant-label{text-align:center;flex:1;font-size:17px;line-height:1.25}.variant-label small{display:block;font-size:12px;color:#c7dbce;margin-bottom:4px}.prototype-switcher details{font-size:12px;text-align:center}.prototype-switcher summary{cursor:pointer;padding:7px 10px}.prototype-switcher pre{max-height:180px;overflow:auto;text-align:left;white-space:pre-wrap;background:#142c26;padding:10px}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
@media(max-width:1000px){.comic .panels{grid-template-columns:1fr 1fr}.comic .comic-panel:first-child{grid-column:1/-1;display:flex;gap:22px;align-items:center}.comic .story-illustration{margin:0;min-width:100px}.comic .comic-panel:first-child .panel-heading{margin:0}.comic .story-copy{margin:0}.workshop{grid-template-columns:170px minmax(0,1fr);gap:20px}.workshop .work-area{grid-template-columns:1fr}.workshop .question{grid-template-columns:1fr 1fr;align-items:center}.workshop .feedback{grid-column:1/-1}.mesa .work-area{gap:20px;grid-template-columns:1.2fr 1fr}.mesa .intro{align-items:start}}
@media(max-width:680px){body{font-size:22px}.top{padding:18px 18px}.top .tag{font-size:12px}.layout{padding:10px 18px 170px}.mesa .intro{display:block;margin-bottom:14px}.mesa .work-area,.comic .panels,.workshop,.workshop .work-area{display:block}.step-nav{gap:2px}.step-nav button{padding:8px;font-size:15px;gap:6px}.step-num{width:25px;height:25px}.scene{padding:16px;border-radius:20px}.material{padding:20px 12px}.mesa .question{padding:24px 0 0}.question h2{font-size:27px}.bottom-nav{align-items:end;gap:8px}.back{padding-left:0;padding-right:5px;font-size:18px}.remaining{font-size:15px}.next{min-width:145px}.comic .comic-panel{margin-bottom:16px;padding:18px}.comic .comic-panel:first-child{display:block}.comic .story-illustration{display:none}.comic .story-copy{margin-top:10px}.comic .panel-heading{margin-bottom:12px}.comic .cuts button{font-size:17px}.comic .scene{padding:0}.workshop .sidebar{border:0;padding:0}.workshop .sidebar h1{font-size:28px;max-width:none}.workshop .step-nav{display:flex;margin-top:18px;gap:2px}.workshop .step-nav button{width:auto;font-size:15px;padding:8px}.workshop .bench-title{margin:20px 0}.workshop .bench-title h2{font-size:26px}.workshop .work-area{padding:12px}.workshop .question{display:grid;padding:24px 4px 8px;grid-template-columns:1fr}.workshop .feedback{grid-column:auto}.workshop .scene{padding:14px}.done{padding:26px 18px}.cuts{gap:7px}.cuts button{padding:10px 4px}.block-grid{gap:7px}}

<body>
<header class="top"><div class="brand"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>PageCraft <span class="muted">/ Frações</span></div><span class="tag">2.º ano · Minecraft</span></header>
<main id="app" class="layout"></main>
<aside id="switcher" class="prototype-switcher hidden" aria-label="Comparar versões do protótipo"><div class="switch-row"><button id="variant-prev" aria-label="Versão anterior">←</button><div class="variant-label"><small>PROTÓTIPO · SÓ PARA REVISÃO</small><span id="variant-label"></span></div><button id="variant-next" aria-label="Versão seguinte">→</button></div><details><summary>Ver estado · sem guardar dados</summary><pre id="state"></pre><button id="reset" type="button">Recomeçar ensaio</button></details></aside>
<script>
const variants=['A','B','C'];
const names={A:'Mesa de exploração',B:'Banda desenhada',C:'Oficina de blocos'};
let variant=variants.includes(new URL(location.href).searchParams.get('variant'))?new URL(location.href).searchParams.get('variant'):'A';
const initial=()=>({step:0,finished:false,bread:{cut:null,answer:null},blocks:{selected:[],touched:false,checked:false},minecraft:{declared:false,answer:null}});
let state=initial();
const titles=['Partilha o pão.','Constrói uma metade.','Agora, no Minecraft.'];
const shortTitles=['Partilhar','Construir','Minecraft'];
const app=document.getElementById('app');
const complete=()=>[state.bread.cut!==null&&state.bread.answer!==null,state.blocks.checked,state.minecraft.declared&&state.minecraft.answer!==null];
const firstPending=()=>{const at=complete().indexOf(false);return at<0?2:at};
const nav=()=>`<nav class="step-nav" aria-label="Passos da atividade">${shortTitles.map((label,i)=>`<button data-step="${i}" ${i>firstPending()?'disabled':''} ${i===state.step?'aria-current="step"':''}><span class="step-num" aria-hidden="true">${complete()[i]?'✓':i+1}</span>${label}<span class="sr-only">${complete()[i]?', respondido':''}</span></button>`).join('')}</nav>`;
const faces=()=>'<div class="companions" aria-hidden="true"><span class="companion"><i class="face"></i>Tu</span><span class="companion"><i class="face two"></i>Colega</span></div>';
function bread(){const cut=state.bread.cut;const x=12+(cut??.5)*296;return `<svg class="bread" viewBox="0 0 320 104" role="img" aria-label="${cut===null?'Pão inteiro, escolhe onde cortar':cut===.5?'Pão com duas partes iguais':'Pão com duas partes de tamanhos diferentes'}"><path d="M28 12H292V20H306V34H312V76H302V90H286V96H34V90H18V78H8V34H16V20H28Z" fill="#dca458" stroke="#906035" stroke-width="4"/><path d="M36 24H280V32H295V40H25V32H36Z" fill="#f6d49a"/><g stroke="#f7d8a5" stroke-width="9"><path d="M60 45L48 69M108 45L96 69M156 45L144 69M204 45L192 69M252 45L240 69"/></g>${cut===null?'':`<path d="M${x} 7V101" stroke="#fffaf0" stroke-width="9"/><path d="M${x} 6V102" stroke="#75522e" stroke-width="2" stroke-dasharray="5 5"/>`}</svg>`}
function material(){if(state.step===0)return `<div class="scene-label"><span>O pão é a unidade.</span><span aria-hidden="true">1 pão · 2 colegas</span></div><div class="material">${bread()}${faces()}<div class="cut-controls"><div class="cuts" role="group" aria-label="Escolhe onde cortar">${[.25,.5,.75].map((n,i)=>`<button data-cut="${n}" aria-pressed="${state.bread.cut===n}" aria-label="${['Cortar à esquerda','Cortar ao meio','Cortar à direita'][i]}"><span class="cut-icon" style="--cut:${n*100}%" aria-hidden="true"></span>${['À esquerda','Ao meio','À direita'][i]}</button>`).join('')}</div><p class="prompt">Toca onde queres cortar.</p></div></div>`;
if(state.step===1)return `<div class="scene-label"><span>Uma parede. Oito blocos.</span><span>${state.blocks.selected.length} pintados</span></div><div class="material"><div class="block-grid" role="group" aria-label="Pinta metade dos oito blocos">${Array.from({length:8},(_,i)=>`<button class="block" data-block="${i}" aria-label="Bloco ${i+1}" aria-pressed="${state.blocks.selected.includes(i)}">${state.blocks.selected.includes(i)?'✓':''}</button>`).join('')}</div><p class="grid-caption">Toca nos blocos para os pintar.</p><button class="primary verify" data-verify ${!state.blocks.touched?'disabled':''}>Verificar a minha parede</button></div>`;
return `<div class="scene-label"><span>Leva a ideia para o teu mundo.</span></div><div class="material"><div class="minecraft-scene"><div class="wall" aria-hidden="true">${'<span></span>'.repeat(8)}</div><div class="ground" aria-hidden="true"></div><p class="grid-caption">8 blocos</p></div><p class="build-instruction">Constrói 8 blocos. Pinta metade.</p><button class="declaration" data-declare aria-pressed="${state.minecraft.declared}"><span class="checkmark" aria-hidden="true">${state.minecraft.declared?'✓':''}</span>Já fizemos</button></div>`}
const groups=()=>`<div class="equal-groups" role="img" aria-label="Uma unidade repartida em dois grupos com o mesmo tamanho">${Array.from({length:2},()=>`<div class="equal-group">${'<span></span>'.repeat(4)}</div>`).join('')}</div>`;
function feedback(){if(state.step===0){const {cut,answer}=state.bread;if(answer===null)return '';const correct=answer===(cut===.5?'yes':'no');if(correct)return `<div class="feedback" role="status"><strong>${cut===.5?'Encontraste duas metades.':'Reparaste na diferença.'}</strong>${cut===.5?'As partes têm o mesmo tamanho.':'Podes mudar o corte para partilhar por igual.'}</div>`;return `<div class="feedback hint" role="status"><strong>Compara os tamanhos.</strong>Encosta as partes pelo mesmo lado.<div class="hint-bars" role="img" aria-label="As duas partes alinhadas à esquerda para comparar o tamanho"><span class="hint-bar" style="--length:${cut*100}%"></span><span class="hint-bar" style="--length:${(1-cut)*100}%"></span></div></div>`}
if(state.step===1){if(!state.blocks.checked)return '';return state.blocks.selected.length===4?'<div class="feedback" role="status"><strong>Uma metade pintada. Outra por pintar.</strong>As duas têm o mesmo tamanho.</div>':`<div class="feedback hint" role="status"><strong>Experimenta formar dois grupos iguais.</strong>A parte pintada e a outra ocupam o mesmo?${groups()}</div>`}
if(state.minecraft.answer===null)return '';return state.minecraft.answer===4?'<div class="feedback" role="status"><strong>Quatro de oito formam uma metade.</strong>Compara com a vossa construção.</div>':`<div class="feedback hint" role="status"><strong>Olha outra vez para a construção.</strong>Consegues separar os blocos em dois grupos iguais?${groups()}</div>`}
function question(){if(state.step===0)return `<div class="question"><p class="eyebrow">Observa e escolhe</p><h2>Ficaram duas metades?</h2><div class="choices" role="group" aria-label="Ficaram duas metades?"><button data-answer="yes" ${state.bread.cut===null?'disabled':''} aria-pressed="${state.bread.answer==='yes'}">Sim</button><button data-answer="no" ${state.bread.cut===null?'disabled':''} aria-pressed="${state.bread.answer==='no'}">Não</button></div>${feedback()}</div>`;
if(state.step===1)return `<div class="question"><p class="eyebrow">A tua missão</p><h2>Pinta metade da parede.</h2><p class="muted">Podes mudar os blocos e verificar outra vez.</p>${feedback()}</div>`;
return `<div class="question"><p class="eyebrow">Conta na vossa construção</p><h2>Quantos blocos pintaste?</h2><div class="number-choices" role="group" aria-label="Quantos blocos pintaste?">${[1,2,4,8].map(n=>`<button class="number-choice" data-count="${n}" aria-pressed="${state.minecraft.answer===n}"><span class="mini-wall" aria-hidden="true">${Array.from({length:8},(_,i)=>`<i class="${i<n?'painted':''}"></i>`).join('')}</span>${n} ${n===1?'bloco':'blocos'}</button>`).join('')}</div>${feedback()}</div>`}
function remaining(){if(state.step===0)return state.bread.cut===null?'Falta escolher o corte e responder.':state.bread.answer===null?'Falta responder: ficaram duas metades?':'Respondeste. Podes corrigir ou continuar.';if(state.step===1)return state.blocks.checked?'Respondeste. Podes corrigir ou continuar.':state.blocks.touched?'Falta verificar a tua parede.':'Falta pintar e verificar.';return !state.minecraft.declared&&state.minecraft.answer===null?'Falta confirmar e responder.':!state.minecraft.declared?'Falta confirmar: já fizemos.':state.minecraft.answer===null?'Falta dizer quantos blocos pintaste.':'Respondeste. Podes corrigir ou terminar.'}
function bottom(){return `<footer class="bottom-nav"><button class="back" data-back ${state.step===0?'disabled':''}>← Voltar</button><div class="next-area"><p class="remaining" role="status">${remaining()}</p><button class="primary next" data-next ${!complete()[state.step]?'disabled':''}>${state.step===2?'Terminar ✓':'Seguinte →'}</button></div></footer>`}
function VariantA(){return `<section class="mesa"><div class="intro"><div><p class="eyebrow">Metade para ti. Metade para mim.</p><h1>${titles[state.step]}</h1></div><span class="tag">Passo ${state.step+1} de 3</span></div>${nav()}<div class="work-area"><div class="scene">${material()}</div>${question()}</div>${bottom()}</section>`}
function VariantB(){const story=['Um pão para dois colegas.','Uma parede para pintar.','Agora construímos juntos.'];return `<section class="comic"><div class="intro"><p class="eyebrow">Uma aventura em três passos</p><h1>${titles[state.step]}</h1>${nav()}</div><div class="panels"><section class="comic-panel"><div class="panel-heading"><span>1</span>Imagina</div><div class="story-illustration">${faces()}</div><p class="story-copy">${story[state.step]}</p></section><section class="comic-panel"><div class="panel-heading"><span>2</span>Experimenta</div><div class="scene">${material()}</div></section><section class="comic-panel"><div class="panel-heading"><span>3</span>Repara</div>${question()}</section></div>${bottom()}</section>`}
function VariantC(){return `<section class="workshop"><aside class="sidebar"><p class="eyebrow">A nossa oficina</p><h1>Vamos descobrir a metade.</h1>${nav()}</aside><div class="bench"><div class="bench-title"><h2>${titles[state.step]}</h2><span class="tag">${state.step+1} / 3</span></div><div class="work-area"><div class="scene">${material()}</div>${question()}</div>${bottom()}</div></section>`}
function render(focusHeading=false){document.body.dataset.variant=variant;if(state.finished)app.innerHTML=`<section class="done"><span class="done-symbol" aria-hidden="true">✓</span><h1>Respondeste aos três passos.</h1><p>Podes voltar para experimentar e corrigir.</p><div class="done-list"><span>✓ Partilhaste o pão</span><span>✓ Respondeste sobre a parede</span><span>✓ Registaste o trabalho no Minecraft</span></div><div class="choices"><button data-review>Voltar às respostas</button><button data-restart>Experimentar de novo</button></div></section>`;else app.innerHTML=({A:VariantA,B:VariantB,C:VariantC}[variant])();document.getElementById('variant-label').textContent=`${variant} · ${names[variant]}`;document.getElementById('state').textContent=JSON.stringify({...state,respondidas:complete()},null,2);console.info('[prototype-fracoes]',JSON.stringify(state));if(focusHeading){const heading=app.querySelector('h1,h2');heading.tabIndex=-1;heading.focus({preventScroll:true});window.scrollTo({top:0,behavior:'instant'})}}
app.addEventListener('click',event=>{const target=event.target.closest('button');if(!target||target.disabled)return;let heading=false;
if(target.dataset.cut!==undefined){state.bread.cut=Number(target.dataset.cut);state.bread.answer=null}
else if(target.dataset.answer){state.bread.answer=target.dataset.answer}
else if(target.dataset.block!==undefined){const n=Number(target.dataset.block);state.blocks.selected=state.blocks.selected.includes(n)?state.blocks.selected.filter(i=>i!==n):[...state.blocks.selected,n].sort();state.blocks.touched=true;state.blocks.checked=false}
else if(target.hasAttribute('data-verify'))state.blocks.checked=true;
else if(target.hasAttribute('data-declare'))state.minecraft.declared=!state.minecraft.declared;
else if(target.dataset.count)state.minecraft.answer=Number(target.dataset.count);
else if(target.dataset.step!==undefined){const n=Number(target.dataset.step);if(n>firstPending())return;state.step=n;heading=true}
else if(target.hasAttribute('data-back')){state.step=Math.max(0,state.step-1);heading=true}
else if(target.hasAttribute('data-next')){if(!complete()[state.step])return;if(state.step===2)state.finished=true;else state.step++;heading=true}
else if(target.hasAttribute('data-review')){state.finished=false;state.step=0;heading=true}
else if(target.hasAttribute('data-restart')){state=initial();heading=true}
const selector=target.hasAttribute('data-next')?'[data-next]':target.hasAttribute('data-verify')?'[data-verify]':target.dataset.block!==undefined?`[data-block="${target.dataset.block}"]`:target.dataset.cut!==undefined?`[data-cut="${target.dataset.cut}"]`:target.dataset.answer?`[data-answer="${target.dataset.answer}"]`:target.dataset.count?`[data-count="${target.dataset.count}"]`:'[data-declare]';render(heading);if(!heading)app.querySelector(selector)?.focus({preventScroll:true});});
function switchVariant(delta){variant=variants[(variants.indexOf(variant)+delta+3)%3];const url=new URL(location.href);url.searchParams.set('variant',variant);history.replaceState(null,'',url);render()}
const reviewMode=location.protocol==='file:'||['localhost','127.0.0.1','[::1]'].includes(location.hostname);
if(reviewMode){document.getElementById('switcher').classList.remove('hidden');document.getElementById('variant-prev').onclick=()=>switchVariant(-1);document.getElementById('variant-next').onclick=()=>switchVariant(1);document.getElementById('reset').onclick=()=>{state=initial();render(true)};document.addEventListener('keydown',e=>{if(e.key!=='ArrowLeft'&&e.key!=='ArrowRight')return;if(e.target.closest('input,textarea,select,[contenteditable]'))return;e.preventDefault();switchVariant(e.key==='ArrowRight'?1:-1)})}
render();
</script>
</body></html>
