<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <title>PageCraft: Números ordinais, em que lugar?</title>
  <style>
    :root {
      --bg: oklch(0.97 0.008 250);
      --surface: oklch(0.99 0.005 250);
      --ink: oklch(0.22 0.02 260);
      --ink-soft: oklch(0.42 0.02 260);
      --primary: oklch(0.48 0.13 255);
      --primary-ink: oklch(0.98 0.01 255);
      --accent: oklch(0.46 0.15 305);
      --accent-tint: oklch(0.95 0.03 305);
      --border: oklch(0.86 0.01 260);
      --scene: oklch(0.94 0.012 250);
      --tint-info: oklch(0.95 0.03 255);
      --tint-sand: oklch(0.95 0.035 80);
      --ok: oklch(0.68 0.16 150);
      --ok-tint: oklch(0.95 0.05 150);
      --warn: oklch(0.75 0.14 85);
      --warn-tint: oklch(0.96 0.06 85);
      --focus: oklch(0.52 0.19 255);
      --radius: 14px;
      --tap: 56px;
      --shadow: 0 1px 2px oklch(0.50 0.02 260 / 0.08), 0 4px 14px oklch(0.50 0.02 260 / 0.08);
      --font: 'Century Gothic', 'Didact Gothic', 'URW Gothic', 'Avant Garde', sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      font-family: var(--font);
      font-size: 22px;
      line-height: 1.5;
      color: var(--ink);
      background: var(--bg);
      padding: 1rem;
      max-width: 1100px;
      margin: 0 auto;
      text-rendering: optimizeLegibility;
    }
    button, input, textarea { font-family: inherit; }
    .emoji { font-family: 'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji', sans-serif; font-style: normal; }
    h1, h2, h3 { font-weight: 800; line-height: 1.2; margin: 0 0 0.5rem; }
    h1 { font-size: 32px; color: var(--primary); }
    h2 { font-size: 32px; color: var(--primary); }
    p { max-width: 50ch; margin: 0 0 0.6rem; }
    :focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; border-radius: 6px; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    .skip { position: absolute; left: 0.5rem; top: -4rem; background: var(--primary); color: var(--primary-ink); padding: 0.8rem 1.2rem; border-radius: 10px; z-index: 50; font-weight: 700; }
    .skip:focus { top: 0.5rem; }

    header.top { background: var(--surface); border: 2px solid var(--primary); border-radius: var(--radius); padding: 1rem 1.25rem; margin-bottom: 1rem; box-shadow: var(--shadow); }
    .top-row { display: flex; gap: 1rem; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; }
    .meta { font-size: 18px; color: var(--ink-soft); margin: 0 0 0.6rem; }
    .tabs { display: flex; gap: 0.5rem; flex-wrap: wrap; margin: 0.4rem 0 0.8rem; }
    .tab { min-height: 56px; padding: 0.4rem 1rem; border-radius: 12px; border: 2px solid var(--border); background: var(--surface); color: var(--ink); font-size: 20px; font-weight: 700; display: inline-flex; align-items: center; gap: 0.5rem; cursor: pointer; touch-action: manipulation; border-bottom-width: 3px; }
    .tab .shape { font-size: 22px; }
    .tab[data-level="support"] { --lc: oklch(0.42 0.09 200); --lt: oklch(0.95 0.025 200); }
    .tab[data-level="standard"] { --lc: oklch(0.42 0.12 330); --lt: oklch(0.95 0.025 330); }
    .tab[data-level="challenge"] { --lc: oklch(0.42 0.07 60); --lt: oklch(0.95 0.025 60); }
    .tab .shape { color: var(--lc); }
    .tab[aria-selected="true"] { background: var(--lt); border-color: var(--lc); border-bottom-color: var(--lc); }
    .tab[aria-selected="true"] .shape { filter: none; }
    .stepper { display: flex; gap: 0.4rem; list-style: none; margin: 0; padding: 0; flex-wrap: wrap; }
    .stepper button { min-width: 56px; min-height: 56px; border-radius: 12px; border: 2px solid var(--border); background: var(--surface); color: var(--ink); font-size: 20px; font-weight: 800; cursor: pointer; touch-action: manipulation; }
    .stepper button[aria-current="step"] { border: 3px solid var(--focus); }
    .stepper button.done { background: var(--tint-info); }
    .stepper button[aria-disabled="true"] { color: var(--ink-soft); border-style: dashed; cursor: not-allowed; }

    .btn { min-height: 56px; padding: 0.5rem 1.2rem; border-radius: 10px; border: 2px solid var(--primary); background: var(--primary); color: var(--primary-ink); font-size: 20px; font-weight: 700; cursor: pointer; touch-action: manipulation; transition: filter 160ms ease-out; }
    .btn:hover { filter: brightness(1.06); }
    .btn:active { filter: brightness(0.94); }
    .btn.sec { background: var(--surface); color: var(--primary); }
    .btn[aria-disabled="true"] { background: var(--scene); color: var(--ink-soft); border-color: var(--border); border-style: dashed; cursor: not-allowed; }
    .btn.ico { min-width: 56px; }

    .unit { background: var(--surface); border-radius: var(--radius); padding: 1.25rem 1.5rem; box-shadow: var(--shadow); border: 2px solid var(--border); margin-bottom: 1rem; }
    .unit[hidden] { display: none; }
    .lead { font-size: 22px; font-weight: 700; }
    .scene { background: var(--scene); border: 2px solid var(--border); border-radius: var(--radius); padding: 1rem 0.75rem; margin: 0.75rem 0; min-height: 200px; overflow: hidden; }
    .fb { margin: 0.75rem 0; }
    .fb:empty { display: none; }
    .fb.feedback-correct, .fb.feedback-try-again, .fb.info { border-radius: var(--radius); padding: 0.8rem 1.1rem; font-weight: 700; font-size: 22px; color: var(--ink); }
    .fb.feedback-correct { background: var(--ok-tint); border: 2px solid var(--ok); }
    .fb.feedback-try-again { background: var(--warn-tint); border: 2px solid var(--warn); }
    .fb.info { background: var(--tint-info); border: 2px solid var(--primary); }
    .oral { background: var(--accent-tint); border: 2px solid var(--accent); border-radius: var(--radius); padding: 0.8rem 1rem; font-weight: 700; }
    .micro { font-size: 18px; color: var(--ink-soft); }

    /* fila */
    .queue { display: flex; flex-direction: column; gap: 14px; }
    .q-row { display: grid; grid-template-columns: 96px repeat(var(--per), minmax(0, 1fr)); gap: 6px; align-items: end; position: relative; padding: 6px 0; }
    .has-tail .q-row { grid-template-columns: 96px repeat(var(--per), minmax(0, 1fr)) 96px; }
    .frame-box { position: absolute; left: 102px; right: 0; top: 0; bottom: 0; border: 2px dashed var(--accent); border-radius: 12px; pointer-events: none; }
    .frame-tag { position: absolute; top: -14px; right: 12px; background: var(--surface); border: 2px solid var(--accent); border-radius: 999px; padding: 0 0.6rem; font-weight: 800; font-size: 18px; }
    .door { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; font-size: 18px; font-weight: 700; border: 2px solid var(--primary); background: var(--surface); border-radius: 10px; padding: 0.3rem; min-height: 96px; line-height: 1.2; }
    .door .arr { color: var(--accent); font-weight: 800; }
    .door.open { border: 3px solid var(--accent); }
    .door.closed { border-style: dashed; border-color: var(--border); color: var(--ink-soft); }
    .door.swap { animation: fadein 300ms ease-out; }
    .cont { font-size: 18px; font-weight: 700; color: var(--accent); text-align: center; align-self: center; }
    .q-cell { display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0; }
    .q-kid { position: relative; display: flex; flex-direction: column; align-items: center; background: transparent; border: 2px solid transparent; border-radius: 12px; padding: 4px 2px; min-width: 56px; min-height: 56px; width: 100%; color: var(--ink); font-size: 18px; }
    button.q-kid { cursor: pointer; touch-action: manipulation; }
    .fig { display: block; width: 100%; max-width: 54px; aspect-ratio: 48 / 64; }
    .nm { font-size: 18px; font-weight: 700; line-height: 1.1; }
    .nb { position: absolute; top: -12px; left: 50%; transform: translateX(-50%); display: none; background: var(--tint-info); border: 2px solid var(--primary); border-radius: 999px; min-width: 30px; text-align: center; font-size: 18px; font-weight: 800; line-height: 1.2; z-index: 2; }
    .numd .nb { display: block; }
    .sel .q-kid { border-color: var(--focus); background: var(--surface); }
    .lit .q-kid { background: var(--tint-info); border-color: var(--primary); transition: background-color 160ms ease-out; }
    .lit-a .q-kid { background: oklch(0.92 0.05 220); border-color: oklch(0.45 0.1 220); }
    .lit-b .q-kid { background: oklch(0.93 0.06 80); border-color: oklch(0.5 0.1 70); }
    .got .q-kid { background: var(--ok-tint); border-color: var(--ok); }
    .target .q-kid { border: 3px solid var(--accent); background: var(--surface); }
    .target::before { content: '▼'; color: var(--accent); font-size: 18px; line-height: 1; }
    .pulse .q-kid { outline: 3px dotted var(--accent); outline-offset: 1px; animation: glow 1.4s ease-out infinite; }
    @keyframes glow { 0%, 100% { opacity: 1; } 50% { opacity: 0.65; } }
    @keyframes fadein { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
    .fcard { font-size: 18px; font-weight: 800; color: var(--ink-soft); background: var(--tint-info); border-radius: 8px; padding: 0 0.3rem; }
    .tk { display: inline-block; background: var(--tint-sand); border: 2px solid var(--ink-soft); border-radius: 8px; padding: 0 0.6rem; font-weight: 700; }

    /* ranhuras */
    .slotbox { display: flex; flex-direction: column; align-items: center; gap: 3px; width: 100%; }
    .foot { display: flex; flex-wrap: wrap; justify-content: center; gap: 3px; max-width: 40px; }
    .foot i { width: 6px; height: 6px; border-radius: 50%; background: var(--ink-soft); display: block; }
    .slot { position: relative; width: 100%; min-width: 56px; min-height: 64px; border-radius: 10px; border: 2px dashed var(--ink-soft); background: var(--surface); color: var(--ink); font-size: 24px; font-weight: 800; cursor: pointer; touch-action: manipulation; padding: 0; }
    .slot.empty { color: var(--ink-soft); }
    .slot:not(.empty) { border: 2px solid var(--accent); border-style: solid; }
    .slot.ok { background: var(--ok-tint); border-color: var(--ok); }
    .slot.warn { background: var(--warn-tint); border-color: var(--warn); }
    .slot.act { outline: 3px solid var(--focus); outline-offset: 2px; }
    .slot .m { position: absolute; top: 0; right: 3px; font-size: 18px; }

    /* cartões */
    .choices, .tray { display: flex; flex-wrap: wrap; gap: 0.7rem; margin: 0.8rem 0; }
    .qc { position: relative; min-width: 80px; min-height: 80px; padding: 0.3rem 0.9rem; border-radius: 12px; background: var(--surface); color: var(--ink); cursor: pointer; touch-action: manipulation; font-size: 40px; font-weight: 800; line-height: 1.1; transition: background-color 160ms ease-out; }
    .qc.ord { border: 2px solid var(--accent); }
    .qc.car { border: 2px dashed var(--ink-soft); }
    .qc.wp-card { border: 2px solid var(--primary); font-size: 26px; min-height: 64px; }
    .qc[aria-pressed="true"] { outline: 3px solid var(--focus); outline-offset: 3px; background: var(--tint-info); }
    .qc.ok { background: var(--ok-tint); border-color: var(--ok); border-style: solid; }
    .qc.warn { background: var(--warn-tint); border-color: var(--warn); border-style: solid; }
    .qc[aria-disabled="true"] { cursor: default; }
    .qc .mk { position: absolute; top: 0; right: 6px; font-size: 20px; }
    .qbox { display: flex; align-items: center; gap: 0.8rem; flex-wrap: wrap; background: var(--surface); border: 2px solid var(--border); border-radius: var(--radius); padding: 0.6rem 1rem; }
    .qbox .ico { font-size: 34px; }
    .qtext { font-size: 24px; font-weight: 800; margin: 0; flex: 1; min-width: 12ch; }
    .ctx { display: inline-block; background: var(--tint-info); border-radius: 999px; padding: 0 0.8rem; font-size: 18px; font-weight: 700; margin-bottom: 0.4rem; }

    /* navegação de tarefas */
    .tnav { display: flex; flex-wrap: wrap; gap: 0.8rem; align-items: center; margin-top: 0.8rem; }
    .tcount { font-size: 18px; font-weight: 700; }
    .dots { display: flex; gap: 6px; flex-wrap: wrap; }
    .dot { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--border); background: var(--surface); font-size: 18px; font-weight: 800; display: inline-flex; align-items: center; justify-content: center; }
    .dot.cur { border: 3px solid var(--focus); }
    .dot.done { background: var(--tint-info); }
    .tbtn { display: flex; gap: 0.6rem; align-items: center; flex-wrap: wrap; margin-left: auto; }
    .need { font-size: 18px; color: var(--ink-soft); font-weight: 700; }
    .stepbar { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 0.6rem; }
    .stepbar button { min-height: 56px; padding: 0.3rem 1rem; border-radius: 10px; border: 2px solid var(--border); background: var(--surface); color: var(--ink); font-size: 20px; font-weight: 700; cursor: pointer; }
    .stepbar button[aria-current="step"] { border: 3px solid var(--focus); background: var(--tint-info); }
    .stepbar button[aria-disabled="true"] { border-style: dashed; color: var(--ink-soft); }

    /* ligação numeral e nome */
    .match { display: grid; grid-template-columns: 1fr 1fr; gap: 1.2rem; margin: 0.8rem 0; }
    .match h3 { font-size: 20px; }
    .mcol { display: flex; flex-direction: column; gap: 0.5rem; }
    .mrow { display: flex; gap: 0.4rem; align-items: center; }
    .mrow .qc { flex: 1; min-height: 60px; font-size: 30px; }
    .mrow .qc.wp-card { font-size: 24px; }
    .pairA { background: oklch(0.93 0.04 245) !important; border-color: var(--primary) !important; border-style: solid !important; }
    .pairB { background: oklch(0.94 0.04 80) !important; border-color: oklch(0.5 0.08 70) !important; border-style: solid !important; }
    .pairn { position: absolute; top: 0; left: 6px; font-size: 18px; font-weight: 800; }

    /* tabuleiro e balão */
    .cook { display: flex; gap: 0.8rem; align-items: center; flex-wrap: wrap; background: var(--surface); border: 2px solid var(--border); border-radius: var(--radius); padding: 0.6rem 1rem; margin-bottom: 0.6rem; }
    .cook .face { font-size: 44px; }
    .balloon { font-size: 24px; font-weight: 800; flex: 1; min-width: 14ch; margin: 0; }
    .tray-o { display: inline-flex; align-items: center; gap: 0.5rem; border: 2px solid var(--ink-soft); border-radius: 8px; padding: 0.2rem 0.8rem; font-size: 18px; font-weight: 800; background: var(--tint-info); }
    .tray-o.laranja { background: var(--tint-sand); }
    .tray-o.cinzento { background: var(--scene); }

    /* construir nomes */
    .board { display: flex; gap: 0.6rem; align-items: center; flex-wrap: wrap; margin: 0.6rem 0; }
    .house { min-width: 190px; min-height: 64px; border: 2px dashed var(--border); border-radius: 10px; background: var(--surface); font-size: 24px; font-weight: 800; color: var(--ink); cursor: pointer; padding: 0.3rem 0.8rem; touch-action: manipulation; }
    .house:not(.empty) { border: 2px solid var(--primary); background: oklch(0.96 0.03 255); }
    .house.lit-a { background: oklch(0.92 0.05 220); }
    .house.lit-b { background: oklch(0.93 0.06 80); }
    .house.warn { background: var(--warn-tint); border: 2px solid var(--warn); }
    .house.lock { cursor: default; }
    .plus { font-size: 32px; font-weight: 800; }
    .wpb { min-height: 56px; min-width: 64px; padding: 0.3rem 1rem; border-radius: 10px; border: 2px solid var(--primary); background: var(--surface); color: var(--ink); font-size: 22px; font-weight: 700; cursor: pointer; touch-action: manipulation; }
    .wpb[aria-pressed="true"] { outline: 3px solid var(--focus); outline-offset: 3px; background: var(--tint-info); }
    .cmpc { display: flex; gap: 0.8rem; flex-wrap: wrap; margin: 0.6rem 0; align-items: center; }

    /* teclado */
    .kp { max-width: 400px; margin: 0.6rem 0; }
    .kp-disp { min-height: 64px; border: 2px solid var(--ink); border-radius: 10px; background: var(--surface); font-size: 40px; font-weight: 800; padding: 0 0.8rem; display: flex; align-items: center; margin-bottom: 0.5rem; }
    .kp-keys { display: grid; grid-template-columns: repeat(5, 56px); gap: 6px; }
    .kp-keys button { width: 56px; height: 56px; border-radius: 10px; border: 2px solid var(--primary); background: var(--surface); color: var(--ink); font-size: 24px; font-weight: 800; cursor: pointer; touch-action: manipulation; padding: 0; }
    .kp-keys button.sign { width: 118px; grid-column: span 2; background: var(--accent); border-color: var(--accent); color: var(--primary-ink); }
    .kp-keys button.go { width: auto; grid-column: span 3; background: var(--primary); color: var(--primary-ink); font-size: 20px; }

    /* autocarro (duas portas) e resumo */
    .cmp { display: flex; gap: 1rem; align-items: center; flex-wrap: wrap; margin: 0.6rem 0; background: var(--surface); border: 2px solid var(--border); border-radius: var(--radius); padding: 0.6rem 1rem; }
    .cmp .who { font-weight: 800; font-size: 24px; }
    .pin { display: flex; flex-direction: column; align-items: center; font-size: 18px; font-weight: 700; }
    .pin .qc { min-height: 72px; cursor: default; }
    .pin .empty { min-width: 80px; min-height: 72px; border: 2px dashed var(--border); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 32px; color: var(--ink-soft); }
    .sum { margin: 0.6rem 0; padding-left: 1.2rem; font-size: 20px; }

    /* prédio */
    .bld-wrap { display: flex; gap: 1.2rem; align-items: flex-end; justify-content: center; flex-wrap: wrap; }
    .bld { position: relative; width: 210px; background: var(--surface); border: 2px solid var(--ink); border-radius: 6px 6px 0 0; }
    .fl { display: flex; align-items: center; justify-content: space-between; padding: 0 8px; border-bottom: 1px solid var(--border); position: relative; line-height: 1; }
    .fl .win { width: 26%; height: 62%; border: 2px solid var(--border); background: var(--tint-info); border-radius: 3px; }
    .fl .mb { display: inline-block; transform-origin: left center; transition: transform 160ms ease-out; font-size: 16px; }
    .fl.open .mb { transform: rotate(-20deg); }
    .fl .lab { font-size: 18px; font-weight: 800; opacity: 0; transition: opacity 160ms ease-out; }
    .fl.has .lab { opacity: 1; }
    .fl.warn { background: var(--warn-tint); }
    .fl.gnd { background: oklch(0.92 0.03 255); }
    .fl.gnd .door-r { background: var(--primary); width: 34px; height: 80%; border-radius: 4px 4px 0 0; }
    .fl.gnd.big .door-r { width: 50px; height: 94%; }
    .fl.gnd .rug { background: var(--accent); height: 6px; width: 40px; border-radius: 3px; }
    .elev { position: absolute; left: 50%; bottom: 0; margin-left: -16px; width: 32px; border: 2px solid var(--ink); background: var(--ink-soft); border-radius: 3px; transition: transform 300ms ease-out; pointer-events: none; z-index: 3; opacity: 0.85; }
    .ruler { align-self: stretch; display: flex; flex-direction: column; justify-content: flex-end; font-size: 18px; color: var(--ink-soft); font-weight: 700; }
    .ruler span { display: block; border-top: 1px solid var(--border); text-align: right; line-height: 1; padding-right: 4px; }
    .panel { display: flex; flex-direction: column-reverse; flex-wrap: wrap; gap: 6px; align-content: flex-start; }
    .panel button { width: 64px; height: 56px; border-radius: 10px; border: 2px solid var(--primary); background: var(--surface); color: var(--ink); font-size: 22px; font-weight: 800; cursor: pointer; touch-action: manipulation; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1; padding: 0; position: relative; }
    .panel button.on { background: var(--primary); color: var(--primary-ink); }
    .panel button.ring { outline: 3px solid var(--accent); outline-offset: 1px; }
    .panel .dts { display: flex; gap: 2px; margin-top: 2px; }
    .panel .dts i { width: 4px; height: 4px; border-radius: 50%; background: currentColor; display: block; }
    .letter { background: var(--tint-sand); border: 2px solid var(--ink-soft); border-radius: var(--radius); padding: 0.8rem 1rem; font-size: 26px; font-weight: 800; margin: 0 0 0.6rem; max-width: 40ch; }
    .letter .l { font-size: 18px; font-weight: 700; display: block; color: var(--ink-soft); }

    /* tiras e pódio */
    .strip { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 4px; margin: 0.6rem 0; max-width: 640px; }
    .sq { border: 2px solid var(--border); border-radius: 6px; text-align: center; font-size: 18px; font-weight: 700; background: var(--surface); }
    .sq.on { background: var(--tint-info); border-color: var(--primary); }
    .sq.fl2 { border-color: var(--accent); }
    .pod { display: flex; gap: 0.6rem; align-items: flex-end; justify-content: center; }
    .pod button { width: 130px; border-radius: 10px 10px 0 0; border: 2px solid var(--ink); background: var(--surface); color: var(--ink); font-size: 22px; font-weight: 800; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding-top: 0.3rem; touch-action: manipulation; }
    .pod button.ok { background: var(--ok-tint); border-color: var(--ok); }
    .pod button.warn { background: var(--warn-tint); border-color: var(--warn); }
    .pod .sym { font-size: 24px; }
    .mini { display: flex; flex-direction: column-reverse; gap: 4px; width: 200px; }
    .mini button { min-height: 56px; border-radius: 6px; border: 2px solid var(--ink); background: var(--tint-info); color: var(--ink); font-size: 18px; font-weight: 700; cursor: pointer; touch-action: manipulation; }
    .mini button.ok { background: var(--ok-tint); border-color: var(--ok); }
    .mini button.warn { background: var(--warn-tint); border-color: var(--warn); }

    /* moldura da pergunta */
    .frame-q { display: flex; flex-wrap: wrap; gap: 0.6rem; align-items: flex-end; margin: 0.6rem 0; }
    .fq { background: var(--surface); border: 2px solid var(--border); border-radius: 12px; padding: 0.5rem 0.7rem; min-width: 170px; flex: 1; }
    .fq.lug { border-color: var(--accent); }
    .fq.ond { border-color: var(--primary); }
    .fq label, .fq .lb { display: block; font-size: 18px; font-weight: 800; margin-bottom: 0.2rem; }
    .fq input, .fqt textarea { width: 100%; min-height: 56px; border: 2px solid var(--ink-soft); border-radius: 10px; padding: 0.3rem 0.7rem; font-size: 22px; background: var(--surface); color: var(--ink); }
    .fqt textarea { min-height: 96px; }
    .fqt { margin: 0.6rem 0; }
    .fqt label { font-size: 20px; font-weight: 800; display: block; margin-bottom: 0.2rem; }
    .chips { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-top: 0.4rem; }
    .chip { min-height: 56px; padding: 0.2rem 0.9rem; border-radius: 999px; border: 2px solid var(--primary); background: var(--surface); color: var(--ink); font-size: 20px; font-weight: 700; cursor: pointer; touch-action: manipulation; }
    .chip[aria-pressed="true"] { background: var(--tint-info); outline: 3px solid var(--focus); outline-offset: 2px; }
    .final { background: var(--ok-tint); border: 2px solid var(--ok); border-radius: var(--radius); padding: 1rem 1.2rem; margin-top: 1rem; }
    .final textarea { width: 100%; min-height: 80px; border: 2px solid var(--ink-soft); border-radius: 10px; font-size: 22px; padding: 0.4rem 0.7rem; }

    .nav { display: flex; gap: 0.8rem; align-items: center; flex-wrap: wrap; margin: 0.8rem 0; }
    .nav .need { flex: 1; min-width: 14ch; }
    .pagecraft-footer { text-align: center; font-size: 18px; color: var(--ink-soft); margin-top: 1rem; padding: 0.5rem; }
    .ai-feedback { display: none; background: var(--warn-tint); border: 2px solid var(--warn); border-radius: var(--radius); padding: 1rem 1.25rem; margin: 0.75rem 0; }
    .ai-feedback[data-shown="true"] { display: block; }
    .pagecraft-attention { animation: pagecraft-attention-pulse 1.2s ease-out 4; outline: 4px solid var(--accent); outline-offset: 4px; border-radius: var(--radius); }
    @keyframes pagecraft-attention-pulse {
      0% { box-shadow: 0 0 0 0 oklch(0.46 0.15 305 / 0.45); }
      70% { box-shadow: 0 0 0 18px oklch(0.46 0.15 305 / 0); }
      100% { box-shadow: 0 0 0 0 oklch(0.46 0.15 305 / 0); }
    }

    @media (max-width: 768px) {
      body { padding: 0.6rem; }
      .unit { padding: 1rem; }
      .match { grid-template-columns: 1fr; }
      .tabs { flex-direction: column; align-items: stretch; }
      .tab { justify-content: center; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition-duration: 0.001ms !important; }
    }
  </style>

  <script>
    /* PageCraftBridge: telemetria opcional por postMessage.
       A atividade continua 100% offline e self-contained: emite às cegas
       para window.parent (se existir) e NUNCA usa rede (fetch/XHR/WebSocket
       são proibidos). Quando aberta diretamente, os eventos não têm ouvinte
       e nada acontece. Contrato: {pagecraft: 1, type, unitId, payload, ts}. */
    window.PageCraftBridge = (function () {
      var embedded = (function () {
        try { return window.parent && window.parent !== window; } catch (e) { return false; }
      })();
      function emit(type, unitId, payload) {
        document.dispatchEvent(new CustomEvent('pagecraft:activity-event', {detail:{type:type,unitId:unitId,payload:payload||{}}}));
        if (!embedded) return;
        try {
          window.parent.postMessage({
            pagecraft: 1,
            type: type,
            unitId: unitId || null,
            payload: payload || {},
            ts: Date.now()
          }, '*');
        } catch (e) { /* nunca quebrar a atividade por causa da telemetria */ }
      }
      /* BEGIN GENERATED SESSION EVENT EMITTERS — do not edit by hand. */
      /* presença: heartbeat de 30s enquanto a página está visível */
      if (embedded) {
        emit('activity_loaded', null, { title: document.title });
        setInterval(function () {
          if (!document.hidden) emit('heartbeat', null, {});
        }, 30000);
      }
      return {
        emit: emit,
        activityState: function (unitId, state) { emit('activity_state', unitId, { state: state }); },
        unitStarted: function (unitId) { emit('unit_started', unitId, {}); },
        levelChanged: function (unitId, level) { emit('level_changed', unitId, { level: level }); },
        attempt: function (unitId, correct, detail) { emit('attempt', unitId, { correct: !!correct, detail: detail || '' }); },
        discovery: function (unitId, message) { emit('discovery', unitId, { message: message || '' }); },
        assessment: function (unitId, result, detail) { emit('assessment_result', unitId, { result: result, detail: detail || '' }); },
        askForFeedback: function (unitId, question, answer, expected) { emit('feedback_request', unitId, { question: question, answer: answer, expected: expected || '' }); },
        helpNeeded: function (unitId, note) { emit('help_needed', unitId, { note: note || '' }); },
        hintPresented: function (unitId, hintId, text, context) { emit('hint_presented', unitId, { hint_id: hintId, text: text, context: context }); },
        hintFeedback: function (unitId, hintId, usefulness) { emit('hint_feedback', unitId, { hint_id: hintId, usefulness: usefulness }); },
        hintAcknowledged: function (unitId, hintId, action) { emit('hint_acknowledged', unitId, { hint_id: hintId, action: action }); },
        hintListened: function (unitId, hintId) { emit('hint_listened', unitId, { hint_id: hintId }); },
        workLocation: function (unitId, location, label) { emit('work_location', unitId, { location: location, label: label }); },
        helpResolved: function (unitId, note) { emit('help_resolved', unitId, { note: note }); },
        share: function (unitId, what) { emit('share_requested', unitId, { what: what || '' }); }
      };
      /* END GENERATED SESSION EVENT EMITTERS */
    })();

    /* Ouvir o embutidor (chega por postMessage): feedback do assistente e
       «chamar a atenção» do professor para uma unidade. */
    window.addEventListener('message', function (ev) {
      var d = ev.data;
      if (ev.source !== window.parent || !d || d.pagecraft !== 1) return;
      if (d.type === 'ai_feedback') {
        if (d.payload && d.payload.request_id) return; // O apoio comum verifica a tentativa atual.
        var box = document.getElementById(d.targetId || 'pagecraft-feedback');
        if (!box) return;
        box.textContent = d.payload && d.payload.text ? d.payload.text : '';
        box.setAttribute('data-shown', 'true');
        return;
      }
      if (d.type === 'highlight' && d.unitId) {
        var el = document.getElementById(d.unitId) ||
                 document.querySelector('[data-unit="' + d.unitId + '"]');
        if (!el) return;
        el.scrollIntoView({ behavior: 'smooth', block: 'center' });
        el.classList.remove('pagecraft-attention');
        void el.offsetWidth; /* reinicia a animação se repetido */
        el.classList.add('pagecraft-attention');
        setTimeout(function () { el.classList.remove('pagecraft-attention'); }, 6000);
      }
    });

    /* Áudio opt-in: respeita a sala de aula. Liga apenas quando o aluno carrega. */
    window.PageCraftAudio = (function () {
      var enabled = false;
      var ctx = null;
      function ensureCtx() {
        if (!ctx && typeof AudioContext !== 'undefined') ctx = new AudioContext();
        return ctx;
      }
      return {
        toggle: function () {
          enabled = !enabled;
          if (enabled) ensureCtx();
          return enabled;
        },
        isOn: function () { return enabled; },
        beep: function (freq, ms) {
          if (!enabled) return;
          var c = ensureCtx(); if (!c) return;
          var o = c.createOscillator(), g = c.createGain();
          o.frequency.value = freq || 440;
          o.connect(g); g.connect(c.destination);
          g.gain.value = 0.05;
          o.start(); o.stop(c.currentTime + (ms || 120) / 1000);
        }
      };
    })();
  </script>

  <script>
  (function () {
    'use strict';

    /* ===== núcleo ===== */
    var LV = [
      { id: 'support', br: 'support', label: 'Com pistas', shape: '●' },
      { id: 'standard', br: 'intermediate', label: 'Passo a passo', shape: '■' },
      { id: 'challenge', br: 'challenge', label: 'Mais desafios', shape: '◆' }
    ];
    var level = 'standard', cur = 0, S = {}, started = {}, discSeen = {}, UNITS = [], UMAP = {};
    var RM = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
    var N10 = ['', 'primeiro', 'segundo', 'terceiro', 'quarto', 'quinto', 'sexto', 'sétimo', 'oitavo', 'nono', 'décimo'];
    var TRAIT_TXT = { 'boné': 'de boné', 'mochila': 'com mochila', 'laço': 'com laço', 'óculos': 'de óculos', 'cachecol': 'com cachecol', 'riscas': 'com camisola às riscas' };

    function h(tag, a, kids) {
      var e = document.createElement(tag), k;
      if (a) for (k in a) {
        var v = a[k];
        if (v === null || v === undefined || v === false) continue;
        if (k === 'class') e.className = v;
        else if (k === 'text') e.textContent = v;
        else if (k.slice(0, 2) === 'on') e.addEventListener(k.slice(2), v);
        else e.setAttribute(k, v === true ? '' : v);
      }
      (function add(list) {
        (list || []).forEach(function (c) {
          if (c === null || c === undefined || c === false) return;
          if (Array.isArray(c)) { add(c); return; }
          e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
        });
      })(kids);
      return e;
    }
    function $(s, r) { return (r || document).querySelector(s); }
    function clear(e) { while (e.firstChild) e.removeChild(e.firstChild); return e; }
    function emo(t) { return h('span', { class: 'emoji', 'aria-hidden': 'true', text: t }); }
    function ordName(n, f) {
      var s = n <= 10 ? N10[n] : (n < 20 ? 'décimo ' + N10[n - 10] : 'vigésimo');
      return f ? s.replace(/o(?=\s|$)/g, 'a') : s;
    }
    function ord(n, f) { return n + (f ? '.ª' : '.º'); }
    function brLevel() { for (var i = 0; i < 3; i++) if (LV[i].id === level) return LV[i].br; return 'intermediate'; }
    function range(a, b) { var r = []; for (var i = a; i <= b; i++) r.push(i); return r; }
    function st(uid) {
      var k = uid + ':' + level;
      if (!S[k]) { S[k] = UMAP[uid].init(level); S[k].lv = level; S[k].rev = 0; if (!S[k].res) S[k].res = []; }
      return S[k];
    }
    function R(o, i) { return o.res[i] || (o.res[i] = { tries: [], ok: false, first: false }); }
    function resp(o, i) { var r = o.res[i]; return !!(r && (r.tries.length || r.conf)); }
    function att(uid, ok, val, q, task) {
      if (window.PageCraftBridge) PageCraftBridge.attempt(uid, ok, { value: String(val), question: q, task_id: task });
    }
    function disc(uid, key, msg) {
      var k = uid + level + key;
      if (discSeen[k]) return; discSeen[k] = true;
      if (window.PageCraftBridge) PageCraftBridge.discovery(uid, msg);
    }
    function speak(t) {
      try {
        if (!window.speechSynthesis) return;
        window.speechSynthesis.cancel();
        var u = new SpeechSynthesisUtterance(t); u.lang = 'pt-PT'; u.rate = 0.9;
        window.speechSynthesis.speak(u);
      } catch (e) { /* sem voz disponível */ }
    }
    function tone(ok) { if (window.PageCraftAudio) PageCraftAudio.beep(ok ? 660 : 330, 120); }
    function say(kind, msg) {
      var fb = $('#' + UNITS[cur].id + ' .fb');
      if (!fb) return;

<script>/* Modal comum: o host cobre todo o ecrã; HTML autónomo usa o mesmo componente. */
(function () {
  'use strict';
  let dialog, handler, activeId;
  function close(hintId) {
    if(hintId && hintId!==activeId)return;
    if(dialog?.open)dialog.close();
    activeId=null;handler=null;
  }
  function notice(hintId,text){
    if(hintId===activeId && dialog?.open)dialog.querySelector('.pc-help-status').textContent=String(text).slice(0,250);
  }
  function open(payload, onAction) {
    if(typeof payload.hint_id!=='string' || typeof payload.text!=='string')return;
    if(!dialog){
      const style=document.createElement('style');
      style.textContent=`.pc-help-modal{box-sizing:border-box;position:fixed;inset:0;margin:0;border:0;width:100vw;max-width:none;height:100dvh;max-height:none;padding:clamp(20px,5vw,64px);background:#f5f3ea;color:#233c32;font:inherit;overflow:auto}.pc-help-modal::backdrop{background:#233c32}.pc-help-modal .pc-help-card{max-width:720px;margin:auto;min-height:100%;display:flex;flex-direction:column;justify-content:center;gap:20px}.pc-help-modal h2{font-size:1.4em;margin:0}.pc-help-modal .pc-help-text{font-size:1.25em;line-height:1.5;overflow-wrap:anywhere;margin:0}.pc-help-modal .pc-help-buttons{display:flex;flex-wrap:wrap;gap:12px}.pc-help-modal button{font:inherit;min-height:56px;padding:12px 18px;border:2px solid #38624f;border-radius:10px;background:#fffefa;color:#233c32;cursor:pointer}.pc-help-modal button[data-action=continue]{background:#233c32;color:#fffefa}.pc-help-modal :focus-visible{outline:3px solid #285cc0;outline-offset:4px}`;
      document.head.append(style);
      dialog=document.createElement('dialog');dialog.className='pc-help-modal';
      dialog.setAttribute('aria-labelledby','pc-help-title');dialog.setAttribute('aria-describedby','pc-help-text');
      // Retomar exige uma escolha explícita; não existe áudio nem avanço automático.
      dialog.addEventListener('cancel',event=>event.preventDefault());
      dialog.addEventListener('keydown',event=>{
        if(event.key!=='Tab')return;
        const buttons=Array.from(dialog.querySelectorAll('button:not([disabled])'));
        const first=buttons[0],last=buttons.at(-1);
        if(!first)return;
        const active=document.activeElement;
        if(event.shiftKey && (active===first || active===dialog || !dialog.contains(active))){
          event.preventDefault();last.focus();
        }else if(!event.shiftKey && (active===last || active===dialog || !dialog.contains(active))){
          event.preventDefault();first.focus();
        }
      });
      dialog.addEventListener('click',event=>{
        const action=event.target.closest('[data-action]')?.dataset.action;
        if(!['listen','next','stuck','continue','teacher'].includes(action))return;
        const callback=handler,hintId=activeId;
        if(action!=='listen')close();
        callback?.(action,hintId);
      });
      document.body.append(dialog);
    }
    activeId=payload.hint_id;handler=onAction;dialog.lang=payload.language==='en'?'en':'pt-PT';
    dialog.replaceChildren();
    const card=document.createElement('div');card.className='pc-help-card';
    const title=document.createElement('h2');title.id='pc-help-title';title.textContent=String(payload.title||'Um próximo passo').slice(0,100);
    const text=document.createElement('p');text.id='pc-help-text';text.className='pc-help-text';text.textContent=payload.text.slice(0,400);
    const buttons=document.createElement('div');buttons.className='pc-help-buttons';
    for(const action of ['listen','next','stuck','teacher','continue']){
      const button=document.createElement('button');button.type='button';button.dataset.action=action;
      button.textContent=String(payload.labels?.[action]||action).slice(0,100);buttons.append(button);
    }
    const status=document.createElement('p');status.className='pc-help-status';status.setAttribute('role','status');
    card.append(title,text,buttons,status);dialog.append(card);
    if(!dialog.open)dialog.showModal();
    buttons.querySelector('[data-action=continue]').focus();
  }
  window.PageCraftSupportModal={open,close,notice};
  function attachHost(){
    const frame=document.getElementById('activity-frame')||document.getElementById('lesson');
    if(!frame)return;
    frame.addEventListener('load',()=>close());
    window.addEventListener('pagehide',()=>close());
    window.addEventListener('message',event=>{
      if(event.source!==frame.contentWindow || event.data?.pagecraft!==1 || event.data.type!=='support_modal')return;
      const p=event.data.payload||{};
      if(p.action==='close'){close(p.hint_id);return;}
      if(p.action==='notice'){notice(p.hint_id,p.text);return;}
      if(p.action!=='open' || document.getElementById('freeze-overlay')?.hidden===false)return;
      open(p,(action,hintId)=>frame.contentWindow?.postMessage({pagecraft:1,type:'support_modal_action',payload:{hint_id:hintId,action}},'*'));
    });
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',attachHost,{once:true});else attachHost();
})();

  function render() {

    const active=document.activeElement?.closest?.('[data-pagecraft-support]')===panel?document.activeElement.dataset.supportAction:null;
    const actionFocused=document.activeElement?.matches?.('.pc-support-action') && document.activeElement.closest('[data-pagecraft-support]')===panel;
    const open=Array.from(panel.querySelectorAll?.('[data-support-disclosure][open]')||[],node=>node.dataset.supportDisclosure);

  function mount() {
    document.querySelectorAll('[data-pagecraft-support]').forEach(panel=>{
      const unit=panel.dataset.pagecraftSupport;
      if(!config.units[unit] || panels.get(unit)===panel)return;
      panels.set(unit,panel);panel.classList.add('pc-support');panel.setAttribute('aria-label',COPY[language].title);
      if(unit!==unitId)panel.innerHTML='<button type="button" data-support-action="hint">'+esc(t('hint'))+'</button>';
      panel.addEventListener('click',event=>{
        const control=event.target.closest('[data-support-action]');
        const action=control?.dataset.supportAction;
        if(!action)return;
        if(action.startsWith('history-listen-')){readHint(history.find(h=>h.hint_id===control.dataset.supportHintId));return;}
        if(unit!==unitId)update({unit_id:unit});
        if(action==='hint'||action==='next')requestHint();
        if(action==='stuck'){feedback('not_helped');requestHint();}
        if(action==='helped')feedback('helped');
        if(action==='teacher')help();
        if(action==='resolved')resolved();
        if(action==='ai')requestAI();
        if(action==='listen')listen();
        if(action==='mode'&&!locked){members=members===1?2:1;invalidate();resetFailures();render();}
        if(action==='external')setLocation(location==='pagecraft'?'external':'pagecraft');
        if(action==='return')setLocation('pagecraft');
        if(action==='reading')setLocation(location==='pagecraft'?(members>1?'discussion':'reading'):'pagecraft');
      });
      panel.addEventListener('change',event=>{
        if(!event.target.matches('[data-support-obstacle]'))return;
        update({unit_id:unit,obstacle:event.target.value});pending=null;current=null;render();
      });
      if(unit===unitId)render();
    });
  }
  function restore(events) {
    invalidate();resetFailures();seenAttempts.clear();history=[];teacherRequest=null;
    for(const event of events||[]){
      const p=event.payload||{};
      if(p.activity && p.activity!==config.activity)continue;
      if(event.type==='hint_presented')history.push({...p,unit_id:event.unit_id||event.unitId,usefulness:null});
      if(event.type==='hint_feedback'){const hint=history.find(h=>h.hint_id===p.hint_id);if(hint)hint.usefulness=p.usefulness;}
      if(event.type==='work_location')location=p.location;
      if(event.type==='help_needed')teacherRequest={request_id:p.help_request_id};
      if(event.type==='help_resolved')teacherRequest=null;
    }
    render();
  }
  window.addEventListener('message',event=>{
    if(event.source!==window.parent || event.data?.pagecraft!==1 || !config)return;
    const {type,payload:p={}}=event.data;
    if(type==='ai_feedback')receive(p);
    if(type==='support_modal_action')modalAction(p.action,p.hint_id);
    if(type==='learning_restore')restore(p.events);
    if(type==='support_teacher_requested'){teacherRequest={request_id:p.help_request_id};render();}
    if(type==='learning_preferences'||type==='work_group_preferences'){
      const before=signature();
      if(p.route)route=p.route;
      if(p.route==='studio'&&Number.isInteger(p.participant_count)){members=Math.max(1,p.participant_count);locked=true;}
      if(config.languages.includes(p.language))language=p.language;
      if(p.level)context.level=p.level;
      if(before!==signature()){invalidate();resetFailures();}
      render();
    }
  });

  document.addEventListener('pagecraft:activity-event',event=>{
    if(!config)return;
    const {type,unitId:unit,payload:p={}}=event.detail;
    if(type==='unit_started')update({unit_id:unit});
    if(type==='level_changed')update({unit_id:unit||unitId,level:p.level});
    if(type==='assessment_result'||type==='attempt'){
      const detail=p.detail && typeof p.detail==='object'?p.detail:null;
      const change={unit_id:unit||unitId};
      if(detail && Object.hasOwn(detail,'value'))change.answer=detail.value;
      if(detail?.question)change.question=detail.question;
      if(detail?.task_id)change.task_id=detail.task_id;
      update(change);
      // As declarações et l'autoévaluation e a autoavaliação não têm veredicto correto/incorreto.
      if(typeof p.correct==='boolean')recordAttempt({...change,correct:p.correct,attempt_id:p.attempt_id});
      else update({revision:id()});

  });
  document.addEventListener('input',event=>{
    if(!config || event.target.closest('[data-pagecraft-support]'))return;

    if(config.units[unit])update({unit_id:unit,revision:id()});
  });
  window.PageCraftSupport={configure(value){config=value;language=config.languages.includes('pt')?'pt':config.languages[0];unitId=Object.keys(config.units)[0];context={};mount();render();

    update,restore,receive,requestHint,requestAI,recordAttempt,feedback,help,resolved,setLocation,listen,

})();

nsa num prédio que conheças. Onde fica a porta da rua: no rés-do-chão ou no 1.º andar?", "group": "Pensem num prédio que conheçam. Onde fica a porta da rua: no rés-do-chão ou no 1.º andar?"}}}]}, {"id": "sentido-contagem", "label": {"pt": "Contei os andares a partir do telhado"}, "hints": [{"id": "elevador-sobe", "text": {"pt": {"individual": "Toca no R/C e vê para onde o elevador vai quando sobe um andar.", "group": "Toquem no R/C e vejam para onde vai o elevador quando sobe um andar."}}}, {"id": "comparar-fila", "text": {"pt": {"individual": "Na fila contavas a partir da porta. No prédio, onde está a porta da rua?", "group": "Na fila contavam a partir da porta. No prédio, onde está a porta da rua?"}}}]}], "title": "O prédio da Rua do Carteiro: os andares contam-se de baixo para cima, a partir do rés-do-chão.", "task_description": "O carteiro tem 5 cartas para entregar num prédio com rés-do-chão e 12 andares. Cada carta tem o andar escrito com numeral ou por extenso («Família Costa — 5.º andar», «Avó Lurdes — nono andar»). O aluno toca na carta e depois no andar certo do prédio; o elevador sobe até lá. Uma das cartas é para o rés-do-chão. O aluno deve descobrir, pelo feedback do elevador, que no prédio se conta de baixo para cima e que o rés-do-chão não é o 1.º andar: o 1.º andar é o primeiro acima do rés-do-chão. Antes de começar, o professor pergunta à turma «Em que andar moras?» e regista algumas respostas no cartaz (casas térreas também contam: moram no rés-do-chão).", "interaction": "Prédio alto e estreito no centro, com 13 pisos visíveis sem deslocar a página: porta de entrada e etiqueta «R/C» no piso térreo, janelas com caixas de correio em cada andar. À direita, um painel de elevador com botões grandes (≥56px): R/C, 1, 2… 12. A carta atual aparece em grande, com o destinatário ilustrado e o andar escrito. O andar ainda não tem etiqueta visível no prédio, para obrigar a contar. Alternativa por teclado: setas para cima e para baixo percorrem os andares, Enter entrega."}, "u6": {"objective": "Mostrar o que já sei sobre ordinais em várias situações e criar com o par uma pergunta com um lugar e um ponto de partida.", "criteria": ["Lê e escreve ordinais até ao 20.º, com numeral ou por extenso.", "Responde com um lugar quando a pergunta pede um lugar.", "A pergunta do par diz de onde se começa a contar."], "obstacles": [{"id": "trocar-representacao", "label": {"pt": "Não consigo passar do nome para o numeral"}, "hints": [{"id": "partir-nome", "text": {"pt": {"individual": "Divide o nome em duas partes. O que diz a primeira parte? E a segunda?", "group": "Dividam o nome em duas partes. O que diz a primeira parte? E a segunda?"}}}, {"id": "lembrar-autocarro", "text": {"pt": {"individual": "Lembra-te da fila do autocarro: os primeiros 10 e mais alguns. Quantos a mais?", "group": "Lembrem-se da fila do autocarro: os primeiros 10 e mais alguns. Quantos a mais?"}}}]}, {"id": "pergunta-sem-partida", "label": {"pt": "A nossa pergunta tem mais do que uma resposta"}, "hints": [{"id": "testar-colega", "text": {"pt": {"individual": "Lê a tua pergunta a um colega. Ele sabe por onde começar a contar?", "group": "Leiam a vossa pergunta a outro par. Eles sabem por onde começar a contar?"}}}, {"id": "porta-ou-chao", "text": {"pt": {"individual": "Pensa onde está a porta, a meta ou o rés-do-chão no teu exemplo. Escreve isso no fim.", "group": "Pensem onde está a porta, a meta ou o rés-do-chão no vosso exemplo. Escrevam isso no fim."}}}]}], "title": "Pódio e perguntas da turma: os ordinais dizem lugares em qualquer contexto.", "task_description": "Mini-avaliação e comunicação. Primeiro, 6 itens curtos em contextos variados — a chegada à meta da corrida da escola, a fila da cantina e o prédio — misturando: ler um numeral e escolher o nome (17.º → décimo sétimo), ler um nome e escrever o numeral (décimo segundo → 12.º), distinguir «quantos?» de «em que lugar?» e indicar um lugar a partir de um ponto de partida dado. Depois, a pares, os alunos criam uma pergunta com ordinais sobre a sua realidade (fila do recreio, prédio, corrida, cadeiras na sala) completando a moldura «O/A ___ está em ___ lugar, a contar ___.» ou escrevendo livremente. No circuito de comunicação, dois ou três pares leem a pergunta à turma no Quadro e a turma responde; as descobertas vão para o cartaz «Descobrimos que…» e cada aluno regista no PIT até onde já sabe ler e escrever os ordinais. Reflexão individual facultativa: «O que te ajudou a encontrar o lugar certo?».", "interaction": "Passo 1: um item por ecrã, com a cena do contexto (meta com bandeira de xadrez e pódio de três degraus; fila da cantina; prédio com R/C) e a pergunta numa frase curta com ícone. Barra de progresso com 6 marcas. Passo 2: moldura de frase em cartões grandes com três espaços; o espaço «lugar» oferece teclado com «.º» e cartões de nome; o espaço «de onde se conta» oferece «da frente», «de trás», «de baixo», «de cima» e escrita livre. Botão «Já está» confirma a pergunta do par. Mensagem final que descreve a descoberta: «Já sabes dizer lugares até ao 20.º!»."}}});</script>
