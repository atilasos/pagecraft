<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>O meu roteiro · PageCraft</title>
  <link rel="stylesheet" href="/learning-assets/fonts.css">
  <link rel="stylesheet" href="/learning-assets/common.css">
  <script defer src="/learning-assets/lesson.js"></script>
</head>
<body class="child-page" data-year="2">
  <a class="skip" href="#main">Saltar para o roteiro</a>
  <header><a href="/">PageCraft</a><a id="change-name" class="button" hidden>Escolher outro nome</a></header>
  <main id="main">
    <p class="eyebrow" id="class-name"></p>
    <h1 id="title">O meu roteiro da aula</h1>
    <p id="status" class="status" role="status" aria-live="polite">A abrir o roteiro…</p>
    <section id="entry" hidden>
      <h2>Qual é o teu nome?</h2>
      <div id="names" class="grid"></div>
    </section>
    <section id="work" hidden>
      <h2 id="greeting"></h2>
      <p>Escolhe uma atividade. No fim, podes voltar aqui e escolher outra.</p>
      <div id="activities" class="grid"></div>
    </section>
    <button id="retry" type="button" hidden>Tentar novamente</button>
  </main>
</body>
</html>
