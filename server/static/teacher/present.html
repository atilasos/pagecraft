<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PageCraft — Projeção</title>
<link rel="stylesheet" href="/studio.css">
</head>
<body class="teacher-page present-page">
  <a class="skip-link" href="#board">Saltar para a atividade projetada</a>
  <header class="present-bar">
    <div class="join-hint">
      <span id="present-title">Projeção</span>
      <span class="muted" id="join-url"></span>
    </div>
    <div class="type-blocks" id="join-code" aria-label="Código de entrada"></div>
    <span class="spacer"></span>
    <button type="button" class="freeze-switch" id="freeze-btn" aria-pressed="false" disabled>
      <span class="knob" aria-hidden="true">👀</span>
      <span id="freeze-label">A sincronizar…</span>
    </button>
  </header>
  <iframe id="board" title="Atividade projetada" sandbox="allow-scripts" tabindex="-1"></iframe>
<script src="/teacher/common.js"></script>
<script>
(async function () {
  const sessionId = new URLSearchParams(location.search).get("session");
  if (!sessionId) {
    document.querySelector(".present-bar").insertAdjacentHTML(
      "beforeend", '<p class="feedback-warn">Falta o identificador da sessão.</p>');
    return;
  }
  const resp = await tfetch(`/api/sessions/${sessionId}`);
  if (!resp.ok) return;
  const session = await resp.json();
  document.getElementById("present-title").textContent =
    `${session.class_name} · ${session.activity_title}`;
  document.getElementById("join-url").textContent = `${location.host}/student/`;
  const codeEl = document.getElementById("join-code");
  [...session.join_code].forEach((ch) => {
    const b = document.createElement("span");
    b.textContent = ch;
    codeEl.appendChild(b);
  });
  const board = document.getElementById("board");
  board.src = `/activities/${encodeURIComponent(session.activity_slug)}/`;

  let projectedSessionState = null;
  let freezeRequestPending = false;
  const freezeBtn = document.getElementById("freeze-btn");
  freezeBtn.addEventListener("click", async () => {
    if (
      !projectedSessionState ||
      projectedSessionState.status !== "live" ||
      projectedSessionState.closed ||
      freezeRequestPending
    ) {
      return;
    }
    const stateUsedForAction = projectedSessionState;
    freezeRequestPending = true;
    renderProjectedSessionState();
    try {
      const response = await tfetch(`/api/sessions/${sessionId}/control`, {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({
          action: stateUsedForAction.frozen ? "unfreeze" : "freeze",
        }),
      });
      if (!response.ok && projectedSessionState === stateUsedForAction) {
        freezeRequestPending = false;
        renderProjectedSessionState();
      }
    } catch (error) {
      if (projectedSessionState === stateUsedForAction) {
        freezeRequestPending = false;
        renderProjectedSessionState();
      }
    }
  });

  function renderProjectedSessionState() {
    const state = projectedSessionState;
    if (!state) {
      freezeBtn.disabled = true;
      freezeBtn.setAttribute("aria-pressed", "false");
      document.getElementById("freeze-label").textContent = "A sincronizar…";
      return;
    }
    freezeBtn.setAttribute("aria-pressed", String(state.frozen));
    if (state.closed) {
      freezeBtn.disabled = true;
      document.getElementById("freeze-label").textContent = "Sessão terminada";
      return;
    }
    if (state.status !== "live") {
      freezeBtn.disabled = true;
      document.getElementById("freeze-label").textContent = "Sessão indisponível";
      return;
    }
    freezeBtn.disabled = freezeRequestPending;
    document.getElementById("freeze-label").textContent =
      state.frozen ? "Libertar os ecrãs" : "Olhem para o quadro";
  }

  function applyProjectedSessionState(rawData, stream) {
    try {
      const data = JSON.parse(rawData);
      const state = data?.session;
      if (
        !state ||
        typeof state !== "object" ||
        Array.isArray(state) ||
        typeof state.status !== "string" ||
        typeof state.frozen !== "boolean"
      ) {
        return;
      }
      projectedSessionState = {
        status: state.status,
        closed: state.closed === true || state.status === "closed",
        frozen: state.frozen,
      };
      freezeRequestPending = false;
      renderProjectedSessionState();
      if (projectedSessionState.closed) stream.close();
    } catch (error) {
      // Um instantâneo incompreensível mantém o controlo bloqueado.
    }
  }

  const PROJECTION_EVENT_HANDLERS = {
    teacher_highlight(data) {
      return { unitId: data.payload?.unit_id };
    },
    freeze_screens() {},
    unfreeze_screens() {},
    session_closed() {},
  };

  const FALLBACK_PROJECTION_EVENT_TYPES = Object.keys(PROJECTION_EVENT_HANDLERS).map(
    (name) => ({
      name,
      bridge_name: name === "teacher_highlight" ? "highlight" : null,
    })
  );

  async function loadProjectionEventTypes() {
    try {
      const response = await tfetch("/api/session-event-types");
      if (!response.ok) return FALLBACK_PROJECTION_EVENT_TYPES;
      const declaration = await response.json();
      if (!Array.isArray(declaration?.types)) return FALLBACK_PROJECTION_EVENT_TYPES;
      const seen = new Set();
      return declaration.types
        .filter((entry) => {
          if (
            !entry ||
            typeof entry.name !== "string" ||
            !/^[a-z][a-z0-9_]*$/.test(entry.name) ||
            seen.has(entry.name)
          ) {
            return false;
          }
          seen.add(entry.name);
          return true;
        })
        .map((entry) => ({
          name: entry.name,
          bridge_name:
            typeof entry.bridge_name === "string" &&
            /^[a-z][a-z0-9_]*$/.test(entry.bridge_name)
              ? entry.bridge_name
              : null,
        }));
    } catch (error) {
      return FALLBACK_PROJECTION_EVENT_TYPES;
    }
  }

  function dispatchProjectionEvent(declaration, rawData, stream) {
    try {
      const data = JSON.parse(rawData);
      if (!data || typeof data !== "object" || Array.isArray(data)) return;
      // A projeção é coletiva: qualquer acontecimento dirigido é privado.
      if (data.student_id != null) return;
      const handler = Object.hasOwn(PROJECTION_EVENT_HANDLERS, declaration.name)
        ? PROJECTION_EVENT_HANDLERS[declaration.name]
        : null;
      if (!handler) return;
      const bridgePayload = handler(data, stream);
      if (declaration.bridge_name && bridgePayload) {
        board.contentWindow?.postMessage(
          { pagecraft: 1, type: declaration.bridge_name, ...bridgePayload },
          "*"
        );
      }
    } catch (error) {
      // Um acontecimento incompreensível não pode interromper os seguintes.
    }
  }

  const eventTypes = await loadProjectionEventTypes();
  const es = new EventSource(
    `/api/sessions/${sessionId}/stream?role=projection`
  );
  es.addEventListener("session_state_snapshot", (ev) => {
    applyProjectedSessionState(ev.data, es);
  });
  es.addEventListener("session_state_changed", (ev) => {
    applyProjectedSessionState(ev.data, es);
  });
  es.addEventListener("error", () => {
    projectedSessionState = null;
    freezeRequestPending = false;
    renderProjectedSessionState();
  });
  eventTypes.forEach((declaration) => {
    es.addEventListener(declaration.name, (ev) => {
      dispatchProjectionEvent(declaration, ev.data, es);
    });
  });
})();
</script>
</body>
</html>
