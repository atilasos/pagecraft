<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Montar de memória · casa</title>
<style>
:root{--paper:#faf8f0;--surface:#fffdf8;--ink:#203b43;--accent:#215b6b;--line:#c5d2d0;--wash:#eaf1ed;--hint:#f3ebd2;--ok:#e1efdf;--focus:#285bc3;--pair1:#bce2ed;--pair2:#e5d6ee;--pair3:#f2d9b8;--pair4:#dbe6c0}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:22px/1.4 "Century Gothic","Didact Gothic","URW Gothic","Avant Garde",sans-serif}button{font:inherit;color:inherit;min-width:56px;min-height:60px;border:2px solid var(--line);border-radius:16px;background:var(--surface);padding:10px 18px;cursor:pointer;touch-action:manipulation}button:hover{border-color:var(--accent)}button:disabled{opacity:.5;cursor:default}button[aria-pressed=true]{border-color:var(--accent);background:#d4e8ed;box-shadow:inset 0 0 0 2px var(--accent)}button.primary{background:var(--accent);color:var(--surface);border-color:var(--accent);font-weight:700}button:focus-visible,a:focus-visible,summary:focus-visible{outline:4px solid var(--focus);outline-offset:4px}button svg{pointer-events:none}header,main{max-width:980px;margin:auto;padding:18px 24px}header{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}h1,h2,p{margin:0}h1{font-size:26px}h2{font-size:28px}button .icon{font-size:28px;vertical-align:middle;margin-right:8px}.tools,.row,.nav,.levelbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.tools button{padding:8px 14px}.progress{display:flex;gap:10px;align-items:center;justify-content:center}.progress span{width:22px;height:22px;border:2px solid var(--accent);border-radius:50%;background:var(--surface)}.progress .complete{background:var(--accent)}.progress .current{outline:3px solid var(--focus);outline-offset:3px}main{padding-top:10px}section{background:var(--surface);padding:24px;border:2px solid var(--line);border-radius:24px}.welcome{text-align:center;display:grid;gap:18px;justify-items:center;padding:30px 20px}.picture{display:block}.picture svg{display:block;width:100%;height:100%}.hero-image{width:min(260px,70vw);height:210px}.word{font-size:clamp(40px,6vw,52px);font-weight:700;line-height:1.2}.welcome .primary{min-width:240px;min-height:76px;font-size:30px}.task-top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:16px}.task-title{font-size:26px}.model{display:flex;justify-content:center;align-items:center;gap:20px;background:var(--wash);border:2px solid transparent;border-radius:18px;padding:14px;margin:16px 0}.model .picture{width:140px;height:130px}.model.hint-model{border-style:dashed;border-color:var(--accent)}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin:18px 0}.choices button{min-height:84px;font-size:clamp(30px,5vw,42px);overflow-wrap:anywhere}.choices.hunt{grid-template-columns:repeat(3,minmax(0,1fr))}.choices.hunt button{font-size:clamp(26px,4vw,36px);min-height:76px;padding:10px 6px}.pairs{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin:20px 0}.pair-column{display:grid;gap:12px}.pair-card{position:relative;min-height:112px;display:flex;align-items:center;justify-content:center;gap:6px;padding:10px;font-size:clamp(28px,5vw,40px)}.pair-card .picture{width:100px;height:96px}.badge{position:absolute;top:5px;right:8px;font-size:22px;line-height:1.2;border:2px solid currentColor;border-radius:50%;width:30px;height:30px;background:var(--surface)}.pair-card.pending{outline:4px dashed var(--accent);outline-offset:3px}.pair-card[data-pair="0"]{background:var(--pair1)}.pair-card[data-pair="1"]{background:var(--pair2)}.pair-card[data-pair="2"]{background:var(--pair3)}.pair-card[data-pair="3"]{background:var(--pair4)}.pieces,.tray{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:center;margin:18px 0}.pieces button,.tray button{font-size:40px;min-width:80px;min-height:76px;padding:8px 14px}.tray{background:var(--wash);border:2px dashed var(--accent);border-radius:18px;min-height:96px;padding:12px}.empty-slot{width:76px;height:62px;border-bottom:4px solid var(--accent);display:inline-flex;align-items:center;justify-content:center}.gap-word{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:6px;font-size:46px;margin:24px 0}.feedback{display:flex;align-items:center;gap:12px;background:var(--hint);border-radius:16px;padding:14px 18px;margin:18px 0;min-height:68px}.feedback.ok{background:var(--ok)}.feedback:empty{display:none}.feedback .icon{font-size:34px}.nav{justify-content:space-between;margin-top:20px}.nav .primary{min-width:185px}.quiet{background:var(--wash)}.levelbar{justify-content:center;margin-top:18px}.levelbar button{font-size:22px;flex:1 1 180px}.support-details{margin-top:18px}.support-details summary{cursor:pointer;min-height:56px;display:flex;align-items:center;gap:10px}.support-details summary:before{content:'+';font-size:32px}.support-details[open] summary:before{content:'−'}.demo{background:#eef2f7;border-color:#b6c7dc}.demo-stage{display:flex;flex-wrap:wrap;justify-content:center;gap:18px;align-items:center;min-height:230px;margin:20px 0}.demo-card{border:2px solid var(--line);border-radius:16px;background:var(--surface);padding:14px 20px;font-size:40px;min-width:100px;text-align:center;position:relative}.demo-card.target{border:4px solid var(--accent);background:#d4e8ed}.demo-hand{font-size:38px;position:absolute;bottom:-30px;right:4px;line-height:1}.demo-arrow{font-size:48px}.demo-caption{font-size:24px;text-align:center;margin-bottom:18px}.demo .nav{justify-content:center}.finish{text-align:center;display:grid;gap:22px;justify-items:center}.finish-symbol{font-size:72px;line-height:1.2}.reflection{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}.reflection button{min-width:170px;display:grid;gap:8px;justify-items:center}.reflection .icon{font-size:42px}.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}.skip{position:absolute;top:-200px;left:8px;z-index:10;background:var(--surface);padding:12px}.skip:focus{top:8px}[hidden]{display:none!important}.pc-support-panel{font-size:22px!important}.pc-support-panel button,.pc-support-panel select{font-size:22px!important;min-height:56px!important}#audio-status{font-size:22px;margin-top:12px}#audio-status:empty{display:none}
h1,h2,.task-title{font-size:30px}
@media(max-width:600px){header,main{padding:14px 12px}header{justify-content:center}header h1{width:100%;text-align:center}.tools{justify-content:center;width:100%}.tools button{flex:1 1 120px}section{padding:18px 12px}.task-top{display:block}.task-title{text-align:center}.model{gap:10px;padding:12px 8px}.model .picture{width:100px;height:100px}.choices{gap:10px}.choices.hunt{grid-template-columns:repeat(2,minmax(0,1fr))}.pairs{gap:12px}.pair-card{font-size:28px;min-height:100px;padding:8px}.pair-card .picture{width:82px;height:82px}.badge{right:3px;top:3px}.nav{gap:10px}.nav button{flex:1 1 130px}.nav .primary{min-width:130px}.word{font-size:40px}.demo-card{font-size:32px;padding:12px}.pieces button,.tray button{font-size:36px;min-width:68px}.levelbar button{flex:1 1 100%}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
<style>
.model{flex-wrap:wrap}.pair-card{overflow-wrap:anywhere;min-width:0}.pair-card>span{max-width:100%}.visual-cue{outline:4px dashed #966625!important;outline-offset:3px;position:relative}.cue-icon{position:absolute;bottom:2px;left:4px;font-size:28px;line-height:1.1;border-radius:10px;background:var(--hint);color:var(--ink);padding:2px 6px}.comparison{display:flex;align-items:center;justify-content:center;gap:16px;background:var(--hint);border-radius:16px;padding:16px;flex-wrap:wrap;margin:18px 0}.comparison .sample{font-size:36px;display:flex;flex-wrap:wrap;justify-content:center}.letter-cue{background:#e9d1a6;outline:2px dashed #966625;border-radius:4px}.search-cue{outline:3px dashed #966625;outline-offset:2px}
</style>
<style>
.initialization-status{display:flex;gap:16px;align-items:center;justify-content:center;min-height:180px;padding:24px}.preparing-shape{width:48px;height:48px;border:6px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:preparing 1s linear infinite}@keyframes preparing{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.preparing-shape{animation:none}}
</style>

<script>
'use strict';

const TicModel = (() => {
  const levels=['support','intermediate','challenge'];
  const ordered=round=>['syllables','recall'].includes(round.kind);

        if(typeof item!=='string')return false;
        const pair=item.split('=');
        if(pair.length!==2||!pair.every(id=>allowed.includes(id))||usedLeft.has(pair[0])||usedRight.has(pair[1]))return false;
        usedLeft.add(pair[0]);usedRight.add(pair[1]);return true;
      }).slice(0,allowed.length);

    if(!Array.isArray(value)||!value.length||JSON.stringify(cleanAnswer(round,value))!==JSON.stringify(value))return false;

function toggle(id){const values=selected();edit(round().kind==='hunt'?(values.includes(id)?values.filter(value=>value!==id):[...values,id]):[id]);}
function choices(r,container){

function pairs(r,container){
  const board=node('div',undefined,'pairs'),left=node('div',undefined,'pair-column'),right=node('div',undefined,'pair-column');
  const values=selected(),connections=values.map(value=>value.split('='));
  const link=(side,id)=>{
    if(side==='left'){pendingPair=id;renderGame();return;}
    if(!pendingPair){pendingPair={right:id};renderGame();return;}
    if(typeof pendingPair==='object'){pendingPair={right:id};renderGame();return;}
    const next=values.filter(value=>{const pair=value.split('=');return pair[0]!==pendingPair&&pair[1]!==id;});next.push(pendingPair+'='+id);pendingPair=null;edit(next);
  };
  const makeCard=(option,side)=>{
    const item=button('',()=>{
      if(side==='left'&&pendingPair&&typeof pendingPair==='object'){
        const target=pendingPair.right;pendingPair=null;edit(values.filter(value=>{const pair=value.split('=');return pair[0]!==option.id&&pair[1]!==target;}).concat(option.id+'='+target));return;
      }

    item.dataset[side]=option.id;item.dataset.focus=side+'-'+option.id;
    if(side==='left'){item.appendChild(picture(option.image,option.label));if(state.level==='support'){const caption=node('span',option.label);caption.style.fontSize='28px';item.appendChild(caption);item.style.flexWrap='wrap';}item.setAttribute('aria-label','Imagem: '+option.label);}

  wordOrder.forEach(id=>{const option=r.options.find(option=>option.id===id);if(option)right.appendChild(makeCard(option,'right'));});

function order(r,container){

function markCue(element){if(!element)return;element.classList.add('visual-cue');const cue=node('span','↻','cue-icon');cue.setAttribute('aria-hidden','true');element.appendChild(cue);}
function visualFeedback(r,container){
  if(!state.confirmed[r.id]||TicModel.correct(r,selected()))return;
  if(TicModel.ordered(r)){
    const labels=selected().map(id=>r.pieces.find(piece=>piece.id===id).label),expected=r.answer.map(id=>r.pieces.find(piece=>piece.id===id).label);
    const index=labels.findIndex((label,index)=>label!==expected[index]);markCue(container.querySelector('.tray')?.children[index]);
  }else if(r.kind==='gap')markCue(container.querySelector('.gap-word .empty-slot'));
  else if(r.kind==='pairs'){
    const wrong=selected().map(value=>value.split('=')).find(([left,right])=>left!==right);
    if(wrong){markCue([...container.querySelectorAll('[data-left]')].find(item=>item.dataset.left===wrong[0]));markCue([...container.querySelectorAll('[data-right]')].find(item=>item.dataset.right===wrong[1]));}
  }else if(r.kind==='hunt'){
    const tiles=[...container.querySelectorAll('[data-option]')];
    selected().filter(id=>!r.answer.includes(id)).forEach(id=>markCue(tiles.find(item=>item.dataset.option===id)));
    const missing=r.answer.find(id=>!selected().includes(id));
    if(missing){const columns=window.matchMedia('(max-width:600px)').matches?2:3,start=Math.floor(r.options.findIndex(option=>option.id===missing)/columns)*columns;tiles.slice(start,start+columns).forEach(item=>item.classList.add('search-cue'));}

function feedback(r){

    if(active)panel.querySelector('[data-support-action="'+active+'"]')?.focus({preventScroll:true});
    else if(actionFocused)focusCurrentAction();
    return true;
  }
  function mount() {
    document.querySelectorAll('[data-pagecraft-support]').forEach(panel=>{
      const unit=panel.dataset.pagecraftSupport;
      if(!config.units[unit] || panels.get(unit)===panel)return;
      panels.set(unit,panel);panel.classList.add('pc-support');panel.setAttribute('aria-label',COPY[language].title);
      if(unit!==unitId)panel.innerHTML='<button type="button" data-support-action="hint">'+esc(t('hint'))+'</button>';
      panel.addEventListener('click',event=>{
        const control=event.target.closest('[data-support-action]');
        const action=control?.dataset.supportAction;
        if(!action)return;
        if(action.startsWith('history-listen-')){readHint(history.find(h=>h.hint_id===control.dataset.supportHintId));return;}
        if(unit!==unitId)update({unit_id:unit});
        if(action==='hint'||action==='next')requestHint();
        if(action==='stuck'){feedback('not_helped');requestHint();}
        if(action==='helped')feedback('helped');
        if(action==='teacher')help();
        if(action==='resolved')resolved();
        if(action==='ai')requestAI();
        if(action==='listen')listen();
        if(action==='mode'&&!locked){members=members===1?2:1;invalidate();resetFailures();render();}
        if(action==='external')setLocation(location==='pagecraft'?'external':'pagecraft');
        if(action==='return')setLocation('pagecraft');
        if(action==='reading')setLocation(location==='pagecraft'?(members>1?'discussion':'reading'):'pagecraft');
      });
      panel.addEventListener('change',event=>{
        if(!event.target.matches('[data-support-obstacle]'))return;
        update({unit_id:unit,obstacle:event.target.value});pending=null;current=null;render();
      });
      if(unit===unitId)render();
    });
  }
  function restore(events) {
    invalidate();resetFailures();seenAttempts.clear();history=[];teacherRequest=null;
    for(const event of events||[]){
      const p=event.payload||{};
      if(p.activity && p.activity!==config.activity)continue;
      if(event.type==='hint_presented')history.push({...p,unit_id:event.unit_id||event.unitId,usefulness:null});
      if(event.type==='hint_feedback'){const hint=history.find(h=>h.hint_id===p.hint_id);if(hint)hint.usefulness=p.usefulness;}
      if(event.type==='work_location')location=p.location;
      if(event.type==='help_needed')teacherRequest={request_id:p.help_request_id};
      if(event.type==='help_resolved')teacherRequest=null;
    }
    render();
  }
  window.addEventListener('message',event=>{
    if(event.source!==window.parent || event.data?.pagecraft!==1 || !config)return;
    const {type,payload:p={}}=event.data;
    if(type==='ai_feedback')receive(p);
    if(type==='support_modal_action')modalAction(p.action,p.hint_id);
    if(type==='learning_restore')restore(p.events);
    if(type==='support_teacher_requested'){teacherRequest={request_id:p.help_request_id};render();}
    if(type==='learning_preferences'||type==='work_group_preferences'){
      const before=signature();
      if(p.route)route=p.route;
      if(p.route==='studio'&&Number.isInteger(p.participant_count)){members=Math.max(1,p.participant_count);locked=true;}
      if(config.languages.includes(p.language))language=p.language;
      if(p.level)context.level=p.level;
      if(before!==signature()){invalidate();resetFailures();}
      render();
    }
  });
  // Ações registadas pela atividade e edições invalidam respostas antigas antes da confirmação.
  document.addEventListener('pagecraft:activity-event',event=>{
    if(!config)return;
    const {type,unitId:unit,payload:p={}}=event.detail;
    if(type==='unit_started')update({unit_id:unit});
    if(type==='level_changed')update({unit_id:unit||unitId,level:p.level});
    if(type==='assessment_result'||type==='attempt'){
      const detail=p.detail && typeof p.detail==='object'?p.detail:null;
      const change={unit_id:unit||unitId};
      if(detail && Object.hasOwn(detail,'value'))change.answer=detail.value;
      if(detail?.question)change.question=detail.question;
      if(detail?.task_id)change.task_id=detail.task_id;
      update(change);
      // As declarações et l'autoévaluation e a autoavaliação não têm veredicto correto/incorreto.
      if(typeof p.correct==='boolean')recordAttempt({...change,correct:p.correct,attempt_id:p.attempt_id});
      else update({revision:id()});
    }
  });
  document.addEventListener('input',event=>{
    if(!config || event.target.closest('[data-pagecraft-support]'))return;
    const container=event.target.closest('[data-unit],section[id]');
    const unit=container?.dataset.unit||container?.id;
    if(config.units[unit])update({unit_id:unit,revision:id()});
  });
  window.PageCraftSupport={configure(value){config=value;language=config.languages.includes('pt')?'pt':config.languages[0];unitId=Object.keys(config.units)[0];context={};mount();render();
      if(typeof MutationObserver!=='undefined')new MutationObserver(()=>{mount();}).observe(document.body,{childList:true,subtree:true});
      document.dispatchEvent(new CustomEvent('pagecraft-support-ready'));},
    update,restore,receive,requestHint,requestAI,recordAttempt,feedback,help,resolved,setLocation,listen,
    version:()=>config?.activity_version,currentHintId:()=>current?.hint_id||null};
})();

<script data-pagecraft-bridge-lite>
/* pagecraft-bridge-lite: recetor de «chamar a atenção» (injetado na publicação) */
(function () {
  window.addEventListener('message', function (ev) {
    var d = ev.data;
    if (!d || d.pagecraft !== 1 || d.type !== 'highlight') return;
    var el = null;
    if (d.unitId) {
      el = document.getElementById(d.unitId) ||
           document.querySelector('[data-unit="' + d.unitId + '"]');
      if (!el) {
        /* heurística para páginas antigas: uN aponta para a N-ésima secção */
        var n = parseInt(String(d.unitId).replace(/^u/, ''), 10);
        var sections = document.querySelectorAll('main section');
        if (!sections.length) sections = document.querySelectorAll('section, .knowledge-unit, .card');
        if (n >= 1 && n <= sections.length) el = sections[n - 1];
      }
    }
    if (!el) el = document.querySelector('main') || document.body;
    try { el.scrollIntoView({ behavior: 'smooth', block: 'center' }); } catch (e) {}
    el.classList.remove('pagecraft-attention');
    void el.offsetWidth;
    el.classList.add('pagecraft-attention');
    setTimeout(function () { el.classList.remove('pagecraft-attention'); }, 6000);
  });
})();
