<style>

<style>

.choices .picture{display:block;width:150px;height:140px}.pieces{flex-wrap:wrap}.pieces button{min-width:64px}button:focus-visible{outline:4px solid var(--focus);outline-offset:3px}</style>
<style>
.hidden-words{margin:12px 0}.hidden-count{font-weight:700;margin:0 0 8px}.hidden-words ul{display:flex;flex-wrap:wrap;gap:12px;list-style:none;margin:0;padding:0}.hidden-word{display:flex;align-items:center;gap:8px;min-height:84px;min-width:120px;padding:8px 12px;border:3px dashed var(--line);border-radius:18px;background:var(--surface)}.hidden-word.found{border-style:solid;border-color:var(--accent);background:var(--ok)}.hidden-word.revealed{border-style:solid;background:var(--hint)}.hidden-word button{display:flex;align-items:center;gap:8px;font-size:34px}.hidden-word .picture{width:76px;height:70px}.hidden-word .empty-slot{width:48px;height:56px}.hidden-word .unknown{font-size:34px;padding:0 12px}.punctuation{align-self:flex-end;font-size:44px;line-height:1;padding:0 4px}#discover-finish{margin-top:8px}
.choices.read-choose{grid-template-columns:repeat(3,minmax(0,1fr))}.choices .picture{margin:0 auto;max-width:100%}.choices.read-choose button{padding:8px}@media(max-width:600px){.choices.read-choose .picture{width:100%;height:96px}}

.initialization-status{display:flex;gap:16px;align-items:center;justify-content:center;min-height:180px;padding:24px}.preparing-shape{width:48px;height:48px;border:6px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:preparing 1s linear infinite}@keyframes preparing{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.preparing-shape{animation:none}}
.choices .picture{display:block;width:150px;height:140px}.pieces{flex-wrap:wrap}.pieces button{min-width:64px}button:focus-visible{outline:4px solid var(--focus);outline-offset:3px}</style>

<script>
'use strict';
/* BEGIN M28P TIC MODEL: funções puras verificáveis em Node. */
const TicModel = (() => {
  const levels=['support','intermediate','challenge'];
  const ordered=round=>['syllables','recall','listen-build','sentence','discover'].includes(round.kind);
  const ids=round=>(ordered(round)?round.pieces:round.options).map(option=>option.id);
  const initial=()=>({version:3,page:-1,pageId:null,introDemo:false,level:'intermediate',answers:{},confirmed:{},last:{},counts:{},aids:{},done:false,reflection:null,discoveries:{},choiceAudio:{}});
  function cleanAnswer(round,value){
    if(!Array.isArray(value))return [];
    const allowed=ids(round);
    if(round.kind==='discover'&&value.length===1&&value[0]==='finish')return ['finish'];
    if(round.kind==='pairs'){
      const usedLeft=new Set(),usedRight=new Set();
      return value.filter(item=>{
        if(typeof item!=='string')return false;
        const pair=item.split('=');
        if(pair.length!==2||!pair.every(id=>allowed.includes(id))||usedLeft.has(pair[0])||usedRight.has(pair[1]))return false;
        usedLeft.add(pair[0]);usedRight.add(pair[1]);return true;
      }).slice(0,allowed.length);
    }
    return [...new Set(value.filter(id=>typeof id==='string'&&allowed.includes(id)))].slice(0,['match','gap','read-choose'].includes(round.kind)?1:(round.length||allowed.length));
  }
  function validAnswer(round,value){
    if(!Array.isArray(value)||!value.length||JSON.stringify(cleanAnswer(round,value))!==JSON.stringify(value))return false;
    if(round.kind==='pairs')return value.length===round.options.length;
    if(round.kind==='discover')return value[0]==='finish'||(value.length>=2&&value.length<=3);
    return !ordered(round)||value.length===(round.length||round.pieces.length);
  }
  function signature(round,value){return JSON.stringify(ordered(round)?value.map(id=>round.pieces.find(piece=>piece.id===id)?.label||id):[...value].sort());}
  const discovery=(round,value)=>round.lexicon?.find(w=>w.label===value.map(id=>round.pieces.find(p=>p.id===id)?.label||'').join(''));
  const allFound=(round,labels)=>round.lexicon.every(w=>(labels||[]).includes(w.label));
  function correct(round,value){
    if(round.kind==='discover')return !!discovery(round,value);
    if(!validAnswer(round,value))return false;
    const answer=round.kind==='pairs'?round.options.map(option=>option.id+'='+option.id):round.answer;
    if(signature(round,value)===signature(round,answer))return true;
    // Ordens equivalentes («A mana é a menina.») contam como certas.
    return ordered(round)&&(round.alternatives||[]).some(labels=>JSON.stringify(labels)===signature(round,value));
  }
  const answered=(data,state,index)=>!!state.confirmed[data.rounds[index]?.id]&&validAnswer(data.rounds[index],state.answers[data.rounds[index].id]);
  const complete=(data,state)=>data.rounds.every((_,index)=>answered(data,state,index));
  const accessible=(data,state,index)=>Number.isInteger(index)&&index>=0&&index<data.rounds.length&&data.rounds.slice(0,index).every((_,i)=>answered(data,state,i));
  function sanitize(data,raw){
    const clean=initial();if(!raw||raw.version!==3)return clean;
    if(levels.includes(raw.level))clean.level=raw.level;
    for(const round of data.rounds){
      if(round.kind==='discover'&&raw.discoveries?.[round.id])clean.discoveries[round.id]=[...new Set((raw.discoveries?.[round.id]||[]).filter(label=>round.lexicon.some(w=>w.label===label)))];
      if(round.kind==='read-choose')clean.choiceAudio[round.id]=raw.choiceAudio?.[round.id]===true;
      const value=cleanAnswer(round,raw.answers?.[round.id]);
      if(value.length)clean.answers[round.id]=value;
      if(raw.confirmed?.[round.id]===true&&validAnswer(round,value)&&(round.kind!=='discover'||value[0]==='finish'||allFound(round,clean.discoveries[round.id])))clean.confirmed[round.id]=true;
      const last=cleanAnswer(round,raw.last?.[round.id]);
      if(validAnswer(round,last))clean.last[round.id]=last;
      const count=raw.counts?.[round.id];
      if(Number.isInteger(count)&&count>=0)clean.counts[round.id]=Math.min(count,999);
      for(const key of ['demo_shown','model_shown','text_shown','audio_word_requested','audio_instruction_requested'])if(raw.aids?.[round.id]?.[key]===true)(clean.aids[round.id]||={})[key]=true;
    }
    const firstMissing=data.rounds.findIndex((_,index)=>!answered(data,clean,index));
    // A ronda ativa guarda-se pelo identificador: as frases da turma podem chegar depois e mudar as posições.
    const byId=typeof raw.pageId==='string'?data.rounds.findIndex(r=>r.id===raw.pageId):-1;
    const page=byId>=0?byId:raw.page;
    if(raw.page!==-1)clean.page=accessible(data,clean,page)?page:(firstMissing<0?data.rounds.length-1:Math.max(0,firstMissing));
    // Uma ronda que ainda não existe (frase da turma por chegar) mantém-se pendente até ser encontrada.
    if(typeof raw.pageId==='string')clean.pageId=byId>=0||raw.pageId.length>200?data.rounds[clean.page]?.id||null:raw.pageId;
    clean.introDemo=raw.introDemo===true;
    clean.done=raw.done===true&&complete(data,clean);
    if(['again','help','alone'].includes(raw.reflection))clean.reflection=raw.reflection;
    return clean;
  }
  function edit(state,round,value){if(round.kind==='discover'&&state.confirmed[round.id])return false;if(round.kind==='read-choose')state.choiceAudio[round.id]=state.aids[round.id]?.audio_word_requested===true;state.answers[round.id]=cleanAnswer(round,value);delete state.confirmed[round.id];state.done=false;return true;}
  function confirm(state,round){
    const value=state.answers[round.id];if(!validAnswer(round,value))return {accepted:false,emit:false};
    const emit=!state.last[round.id]||signature(round,state.last[round.id])!==signature(round,value);
    const found=round.kind==='discover'?discovery(round,value):null;
    if(found){const box=state.discoveries[round.id]||=[];if(!box.includes(found.label))box.push(found.label);}
    state.confirmed[round.id]=round.kind!=='discover'||value[0]==='finish'||allFound(round,state.discoveries[round.id]);
    // A última seleção confirmada acompanha sempre o ecrã; só a contagem e os eventos ignoram repetições.
    state.last[round.id]=value.slice();if(emit)state.counts[round.id]=(state.counts[round.id]||0)+1;
    // Uma palavra encontrada fica guardada; o tabuleiro esvazia para a seguinte.
    if(found&&!state.confirmed[round.id])state.answers[round.id]=[];
    return {accepted:true,emit,correct:correct(round,value)};
  }
  function classRounds(fixed,sentences){
    const seen=new Set();
    const rounds=(Array.isArray(sentences)?sentences:[]).filter(s=>{
      if(!s||typeof s.id!=='string'||seen.has(s.id)||!Array.isArray(s.tokens)||s.tokens.length<2||s.tokens.length>12||!s.tokens.every(t=>typeof t==='string'&&t.length>0&&t.length<100))return false;
      seen.add(s.id);return true;
    }).slice(0,4).map(s=>{
      const pieces=s.tokens.map((label,i)=>({id:'p'+i,label}));
      let seed=2166136261;for(const c of s.id)seed=Math.imul(seed^c.charCodeAt(0),16777619)>>>0;
      for(let i=pieces.length-1;i>0;i--){seed=(Math.imul(seed,1664525)+1013904223)>>>0;const j=seed%(i+1);[pieces[i],pieces[j]]=[pieces[j],pieces[i]];}
      // Nunca começar com a frase já ordenada.
      if(pieces.every((p,i)=>p.label===s.tokens[i]))pieces.push(pieces.shift());
      // A leitura em voz alta usa o texto original (vírgulas, hífenes), não as peças.
      const text=typeof s.text==='string'&&s.text.trim()&&s.text.length<300?s.text.trim():s.tokens.join(' ')+'.';
      return {id:'c-'+s.id,kind:'sentence',classSentence:true,prompt:'Ordena as palavras da frase.',model:false,options:[],unit:'word',length:s.tokens.length,pieces,answer:s.tokens.map((_,i)=>'p'+i),target:{text:/[.!?…]$/.test(text)?text:text+'.',tokens:s.tokens}};
    });
    return [...rounds,...fixed].slice(0,4);
  }
  function retainState(raw,state,rounds=[]){
    const merged={...state};
    for(const key of ['answers','confirmed','last','counts','aids','discoveries','choiceAudio']){
      merged[key]={...raw?.[key]};for(const r of rounds)delete merged[key][r.id];Object.assign(merged[key],state[key]);
    }
    return merged;
  }
  return {classRounds,retainState,levels,ordered,ids,discovery,allFound,initial,cleanAnswer,validAnswer,signature,correct,answered,complete,accessible,sanitize,edit,confirm};
})();
/* END M28P TIC MODEL */
(() => {
const data=JSON.parse(document.getElementById('m28p-content').textContent);
const $=id=>document.getElementById(id);
const embedded=window.parent!==window;
const storageKey='pagecraft:m28p-tic-v3:'+data.slug;
const activity=data.slug;
let state=TicModel.initial(),revision=0,restored=!embedded,preferencesReady=!embedded,demoOpen=false,demoTimer=null,pendingPair=null,revisionHint=null,hostLevel=null;
let audio=null,soundEnabled=false,lastRaw=null,repeatFound=false;
const fixedRounds=data.rounds.slice();
const started=new Set();
const round=()=>data.rounds[state.page];
const unit=()=>'u'+(Math.max(0,state.page)+1);
function node(tag,text,className){const element=document.createElement(tag);if(text!==undefined)element.textContent=text;if(className)element.className=className;return element;}
function button(text,action,className){const element=node('button',text,className);element.type='button';element.addEventListener('click',action);return element;}
function picture(svg,label,className=''){const element=node('span',undefined,'picture '+className);element.innerHTML=svg||data.word.image;element.setAttribute('role','img');element.setAttribute('aria-label',label||data.word.label);return element;}
function localVoice(){return window.speechSynthesis?.getVoices().find(v=>v.localService===true&&/^pt[-_]PT$/i.test(v.lang));}
function stopAudio(){if(audio){audio.pause();audio=null;}window.speechSynthesis?.cancel();}
function play(key,override){
  // Antes de começar não há ronda: ouvir não fica registado como ajuda.
  stopAudio();if(state.page>=0&&!state.done)aid(key==='word'?'audio_word_requested':'audio_instruction_requested');checkpoint();soundEnabled=true;$('mute').hidden=false;$('mute').textContent='Desligar som';$('mute').setAttribute('aria-pressed','false');
  if(key==='word'&&!override&&round()?.classSentence){
    const voice=localVoice();if(!voice)return;
    const utterance=new SpeechSynthesisUtterance(round().target.text);utterance.voice=voice;utterance.lang='pt-PT';
    window.speechSynthesis.speak(utterance);return;
  }
  const source=override||(key==='word'?round()?.target?.audio:null)||data.audio?.[key]||data.audio?.instruction;
  if(!source){$('audio-status').textContent='Toca em «Como jogar».';return;}
  audio=new Audio(source);audio.addEventListener('error',()=>{$('audio-status').textContent='Toca em «Como jogar».';});
  audio.play().then(()=>{$('audio-status').textContent='';}).catch(()=>{$('audio-status').textContent='Toca em «Ouvir».';});
}
function playQuiet(source){
  // Som pedido durante a demonstração: não conta como ajuda numa ronda.
  if(!source)return;stopAudio();soundEnabled=true;$('mute').hidden=false;$('mute').textContent='Desligar som';$('mute').setAttribute('aria-pressed','false');audio=new Audio(source);audio.play().catch(()=>{});
}
function playFeedback(key){
  // Som curto de resposta só quando a criança ligou o som; não conta como pedido de ajuda.
  if(!soundEnabled||!data.audio?.[key])return;
  stopAudio();audio=new Audio(data.audio[key]);audio.play().catch(()=>{});
}
function checkpoint(emit=true){
  lastRaw=TicModel.retainState(lastRaw,state,data.rounds);
  if(!embedded){try{sessionStorage.setItem(storageKey,JSON.stringify(state));}catch(_){}}
  if(emit&&restored&&preferencesReady&&window.PageCraftBridge)PageCraftBridge.emit('activity_state',unit(),{activity,version:3,readyForReflection:TicModel.complete(data,state),state:lastRaw});
}
function context(){const r=round();if(r&&window.PageCraftSupport)PageCraftSupport.update({unit_id:unit(),task_id:r.id,question:r.prompt,answer:state.answers[r.id]||[],level:state.level,revision,product:''});}
function aid(key){const id=data.rounds[Math.max(0,state.page)].id;(state.aids[id]||={})[key]=true;}
function selected(){return state.answers[round().id]||[];}
function edit(value){revisionHint=window.PageCraftSupport?.currentHintId()||revisionHint;if(TicModel.edit(state,round(),value)===false)return;revision++;context();checkpoint();renderGame();}
function showModel(r){return state.level==='support'||(r.kind!=='recall'&&(['match','hunt'].includes(r.kind)||(state.level==='intermediate'&&r.model)));}
function model(r){
  if(r.target)return cycleModel(r);
  const box=node('div',undefined,'model');
  if(state.level!=='challenge'||!showModel(r))box.appendChild(picture(data.word.image,data.word.label));
  if(showModel(r)){
    aid('model_shown');
    const label=node('span',undefined,'word');
    if(state.level==='support'){(r.unit==='letter'?Array.from(data.word.label):data.word.syllables).forEach((syllable,index)=>{const part=node('span',syllable);part.style.textDecoration=index%2?'underline':'none';label.appendChild(part);});box.classList.add('hint-model');}
    else label.textContent=data.word.label;
    box.appendChild(label);
  }
  const hear=button('🔊',()=>play('word'));hear.setAttribute('aria-label','Ouvir a palavra');hear.dataset.focus='hear-word';box.appendChild(hear);
  if(state.confirmed[r.id]&&!TicModel.correct(r,selected()))box.classList.add('hint-model');
  return box;
}
const endMark=target=>(/[.!?…]$/.exec(target?.text||'')||[''])[0];
function cycleModel(r){
  const box=node('div',undefined,'model'),t=r.target;
  if(r.kind==='read-choose'){
    // Com ajuda: palavra dividida em sílabas; Sozinho: palavra inteira; Consigo ajudar um amigo: sem ouvir.
    if(state.level==='support'){aid('model_shown');box.appendChild(node('span',t.syllables.join(' · '),'word'));box.classList.add('hint-model');}
    else box.appendChild(node('span',t.label,'word'));
    if(state.level!=='challenge'){const hear=button('🔊',()=>play('word'));hear.setAttribute('aria-label','Ouvir a palavra');hear.dataset.focus='hear-word';box.appendChild(hear);}
    return box;
  }
  if(r.classSentence)box.appendChild(node('span','Frase da turma'));
  else if(r.kind==='sentence'&&state.level!=='challenge')box.appendChild(picture(t.image,'Imagem da frase'));
  const shown=state.level==='support'||(r.classSentence&&state.aids[r.id]?.text_shown);
  if(shown){
    aid('model_shown');box.appendChild(node('span',(t.tokens||t.syllables).join(' · ')+(endMark(t)||''),'word'));box.classList.add('hint-model');
  }
  if(r.classSentence&&!localVoice()&&!shown){
    // Sem voz local, a frase da turma não tem som: a criança pode pedir para a ver escrita (fica registado).
    const reveal=button('Ver a frase',()=>{aid('text_shown');checkpoint();renderGame();});reveal.prepend(node('span','👀 ','icon'));reveal.dataset.focus='reveal';box.appendChild(reveal);
  }
  if(!r.classSentence||localVoice()){const hear=button('🔊',()=>play('word'));hear.setAttribute('aria-label',r.kind==='sentence'?'Ouvir a frase':'Ouvir a palavra');hear.dataset.focus='hear-word';box.appendChild(hear);}
  return box;
}
function discoverBoard(r,container){
  const found=state.discoveries[r.id]||[],revealed=state.confirmed[r.id]&&selected()[0]==='finish';
  const box=node('div',undefined,'hidden-words');
  box.appendChild(node('p','Encontraste '+found.length+' de '+r.lexicon.length+'.','hidden-count'));
  const list=node('ul');list.setAttribute('aria-label','Palavras escondidas');
  for(const w of r.lexicon){
    const item=node('li',undefined,'hidden-word');
    if(found.includes(w.label)||revealed){
      item.classList.add(found.includes(w.label)?'found':'revealed');
      const card=button(w.label,()=>play('word',w.audio));card.setAttribute('aria-label',(found.includes(w.label)?'Encontraste ':'Era ')+w.label+'. Ouvir');
      if(w.image)card.prepend(picture(w.image,w.label));item.appendChild(card);
    }else if(state.level==='support'){
      aid('model_shown');
      if(w.image)item.appendChild(picture(w.image,'Pista: imagem da palavra escondida'));
      const hear=button('🔊',()=>play('word',w.audio));hear.setAttribute('aria-label','Ouvir a palavra escondida');item.appendChild(hear);
    }else if(state.level==='intermediate'){
      item.setAttribute('aria-label','Palavra escondida com '+w.syllables.length+' sílabas');
      w.syllables.forEach(()=>{const slot=node('span',undefined,'empty-slot');slot.setAttribute('aria-hidden','true');item.appendChild(slot);});
    }else{item.setAttribute('aria-label','Palavra escondida');const mark=node('span','?','unknown');mark.setAttribute('aria-hidden','true');item.appendChild(mark);}
    list.appendChild(item);
  }
  box.appendChild(list);
  const tray=node('div',undefined,'tray');tray.setAttribute('aria-label','A tua palavra. Toca numa sílaba para a retirar.');
  selected().filter(id=>id!=='finish').forEach((id,i)=>{const placed=button(r.pieces.find(p=>p.id===id).label,()=>edit(selected().filter((_,j)=>i!==j)));placed.dataset.focus='placed-'+i;placed.disabled=!!state.confirmed[r.id];tray.appendChild(placed);});
  const board=node('div',undefined,'pieces');board.setAttribute('role','group');board.setAttribute('aria-label','Sílabas para juntar');
  for(const piece of r.pieces){const b=button(piece.label,()=>edit([...selected().filter(id=>id!=='finish'),piece.id]));b.disabled=state.confirmed[r.id]||selected().includes(piece.id)||selected().length>=3;b.dataset.piece=piece.id;b.dataset.focus='piece-'+piece.id;board.appendChild(b);}
  container.append(box,tray,board);
  if(!state.confirmed[r.id]){const end=button('Não encontro mais palavras',()=>{aid('model_shown');edit(['finish']);confirm();});end.prepend(node('span','🏳 ','icon'));end.id='discover-finish';end.dataset.focus='discover-finish';container.appendChild(end);}
}
function toggle(id){const values=selected();edit(round().kind==='hunt'?(values.includes(id)?values.filter(value=>value!==id):[...values,id]):[id]);}
function choices(r,container){
  const choices=node('div',undefined,'choices'+(r.kind==='hunt'?' hunt':r.kind==='read-choose'?' read-choose':''));
  for(const option of r.options){const item=button(r.kind==='read-choose'?'':option.label,()=>toggle(option.id));if(r.kind==='read-choose'){const index=r.options.indexOf(option)+1;item.appendChild(picture(option.image,'Imagem '+index));item.setAttribute('aria-label','Imagem '+index);}item.dataset.option=option.id;item.dataset.focus='option-'+option.id;item.setAttribute('aria-pressed',String(selected().includes(option.id)));choices.appendChild(item);}
  container.appendChild(choices);
}
function pairs(r,container){
  const board=node('div',undefined,'pairs'),left=node('div',undefined,'pair-column'),right=node('div',undefined,'pair-column');
  const values=selected(),connections=values.map(value=>value.split('='));
  const link=(side,id)=>{
    if(side==='left'){pendingPair=id;renderGame();return;}
    if(!pendingPair){pendingPair={right:id};renderGame();return;}
    if(typeof pendingPair==='object'){pendingPair={right:id};renderGame();return;}
    const next=values.filter(value=>{const pair=value.split('=');return pair[0]!==pendingPair&&pair[1]!==id;});next.push(pendingPair+'='+id);pendingPair=null;edit(next);
  };
  const makeCard=(option,side)=>{
    const item=button('',()=>{
      if(side==='left'&&pendingPair&&typeof pendingPair==='object'){
        const target=pendingPair.right;pendingPair=null;edit(values.filter(value=>{const pair=value.split('=');return pair[0]!==option.id&&pair[1]!==target;}).concat(option.id+'='+target));return;
      }
      link(side,option.id);
    },'pair-card');
    item.dataset[side]=option.id;item.dataset.focus=side+'-'+option.id;
    if(side==='left'){item.appendChild(picture(option.image,option.label));if(state.level==='support'){const caption=node('span',option.label);caption.style.fontSize='28px';item.appendChild(caption);item.style.flexWrap='wrap';}item.setAttribute('aria-label','Imagem: '+option.label);}
    else item.appendChild(node('span',option.label));
    const index=connections.findIndex(pair=>pair[side==='left'?0:1]===option.id);
    if(index>=0){item.dataset.pair=index;item.appendChild(node('span',String(index+1),'badge'));item.setAttribute('aria-label',(side==='left'?'Imagem: ':'Palavra: ')+option.label+', par '+(index+1));}
    const pending=(side==='left'&&pendingPair===option.id)||(side==='right'&&pendingPair?.right===option.id);
    item.classList.toggle('pending',!!pending);item.setAttribute('aria-pressed',String(index>=0||pending));return item;
  };
  r.options.forEach(option=>left.appendChild(makeCard(option,'left')));
  const wordOrder=r.wordOrder||r.options.map(option=>option.id).slice().reverse();
  wordOrder.forEach(id=>{const option=r.options.find(option=>option.id===id);if(option)right.appendChild(makeCard(option,'right'));});
  if(r.flipColumns)board.append(right,left);else board.append(left,right);container.appendChild(board);
}
function order(r,container){
  const tray=node('div',undefined,'tray');tray.setAttribute('aria-label',r.unit==='word'?'A tua frase. Toca numa palavra para a retirar.':'A tua palavra. Toca numa '+(r.unit==='letter'?'letra':'sílaba')+' para a retirar.');
  selected().forEach((id,index)=>{const piece=r.pieces.find(piece=>piece.id===id);const item=button(piece.label,()=>edit(selected().filter((_,i)=>i!==index)));item.setAttribute('aria-label','Retirar '+piece.label);item.dataset.focus='placed-'+id;tray.appendChild(item);});
  for(let i=selected().length;state.level!=='challenge'&&i<(r.length||r.pieces.length);i++){const slot=node('span',undefined,'empty-slot');slot.setAttribute('aria-hidden','true');tray.appendChild(slot);}
  const mark=r.kind==='sentence'&&endMark(r.target);if(mark){const end=node('span',mark,'punctuation');end.setAttribute('aria-label',{'.':'ponto final','!':'ponto de exclamação','?':'ponto de interrogação','…':'reticências'}[mark]);tray.appendChild(end);}
  const pieces=node('div',undefined,'pieces');pieces.setAttribute('role','group');pieces.setAttribute('aria-label',(r.unit==='word'?'Palavras':r.unit==='letter'?'Letras':'Sílabas')+' para escolher');
  for(const piece of r.pieces){const item=button(piece.label,()=>edit([...selected(),piece.id]));item.dataset.piece=piece.id;item.dataset.focus='piece-'+piece.id;item.disabled=selected().includes(piece.id)||selected().length>=(r.length||r.pieces.length);pieces.appendChild(item);}
  container.append(tray,pieces);
}
function markCue(element){if(!element)return;element.classList.add('visual-cue');const cue=node('span','↻','cue-icon');cue.setAttribute('aria-hidden','true');element.appendChild(cue);}
function visualFeedback(r,container){
  if(r.kind==='discover'){const last=state.last[r.id];if(!state.confirmed[r.id]&&last&&selected().length&&JSON.stringify(selected())===JSON.stringify(last)&&!TicModel.discovery(r,last)&&!(r.celebrate||[]).includes(last.map(id=>r.pieces.find(p=>p.id===id)?.label||'').join('·')))markCue(container.querySelector('.tray'));return;}
  if(!state.confirmed[r.id]||TicModel.correct(r,selected()))return;
  if(r.kind==='discover')return;
  if(TicModel.ordered(r)){
    const labels=selected().map(id=>r.pieces.find(piece=>piece.id===id).label),expected=r.answer.map(id=>r.pieces.find(piece=>piece.id===id).label);
    const index=labels.findIndex((label,index)=>label!==expected[index]);markCue(container.querySelector('.tray')?.children[index]);
  }else if(r.kind==='read-choose'){
    markCue([...container.querySelectorAll('[data-option]')].find(item=>item.dataset.option===selected()[0]));
    container.appendChild(node('p',r.target.syllables.join(' · '),'comparison'));
  }else if(r.kind==='gap')markCue(container.querySelector('.gap-word .empty-slot'));
  else if(r.kind==='pairs'){
    const wrong=selected().map(value=>value.split('=')).find(([left,right])=>left!==right);
    if(wrong){markCue([...container.querySelectorAll('[data-left]')].find(item=>item.dataset.left===wrong[0]));markCue([...container.querySelectorAll('[data-right]')].find(item=>item.dataset.right===wrong[1]));}
  }else if(r.kind==='hunt'){
    const tiles=[...container.querySelectorAll('[data-option]')];
    selected().filter(id=>!r.answer.includes(id)).forEach(id=>markCue(tiles.find(item=>item.dataset.option===id)));
    const missing=r.answer.find(id=>!selected().includes(id));
    if(missing){const columns=window.matchMedia('(max-width:600px)').matches?2:3,start=Math.floor(r.options.findIndex(option=>option.id===missing)/columns)*columns;tiles.slice(start,start+columns).forEach(item=>item.classList.add('search-cue'));}
  }else if(r.kind==='match'){
    const choice=r.options.find(option=>option.id===selected()[0]).label,expected=Array.from(data.word.label),answer=Array.from(choice);
    let difference=0;while(difference<Math.min(expected.length,answer.length)&&expected[difference]===answer[difference])difference++;
    const comparison=node('div',undefined,'comparison');comparison.setAttribute('role','img');comparison.setAttribute('aria-label','Compara esta parte da palavra com o modelo.');
    for(const text of [expected,answer]){const sample=node('span',undefined,'sample');const chars=text.length>difference?text:[...text,'_'];chars.forEach((character,index)=>sample.appendChild(node('span',character,index===difference?'letter-cue':'')));comparison.appendChild(sample);}
    container.appendChild(comparison);
  }
}
function feedback(r){
  const box=$('feedback');box.replaceChildren();box.classList.remove('ok');
  if(r.kind==='discover'){
    const last=state.last[r.id];if(!last||(selected().length&&JSON.stringify(selected())!==JSON.stringify(last)))return;
    if(state.confirmed[r.id]){
      const all=last[0]!=='finish';box.classList.toggle('ok',all);box.appendChild(node('span',all?'✓':'☞','icon'));
      box.appendChild(node('span',all?'Encontraste todas as palavras!':'Estas eram as palavras escondidas.'));return;
    }
    const found=TicModel.discovery(r,last),missing=r.lexicon.length-(state.discoveries[r.id]||[]).length,again=found&&repeatFound;
    const word=last.map(id=>r.pieces.find(p=>p.id===id)?.label||'').join('');
    // Só se celebra uma palavra comum montada com uma divisão válida («ne·la», não «nel·a»).
    const celebrated=!found&&(r.celebrate||[]).includes(last.map(id=>r.pieces.find(p=>p.id===id)?.label||'').join('·'));
    box.classList.toggle('ok',!!found);box.appendChild(node('span',found?'✓':celebrated?'★':'↻','icon'));
    box.appendChild(node('span',found?(again?'Já encontraste «':'Encontraste «')+found.label+'». '+(missing===1?'Falta 1.':'Faltam '+missing+'.'):(celebrated?'«'+word+'» é uma palavra! Não estava escondida, mas descobriste-a.':'«'+word+'» não está escondida. Experimenta outra vez.')));
    return;
  }
  if(!state.confirmed[r.id])return;
  const correct=TicModel.correct(r,selected());box.classList.toggle('ok',correct);box.appendChild(node('span',correct?'✓':'↻','icon'));box.appendChild(node('span',correct?'Está certo!':'Experimenta outra vez.'));
  if(!correct){const help=button('Ver como se faz',()=>openDemo());help.prepend(node('span','? ','icon'));box.appendChild(help);}
}
function updateNav(r){const confirmed=!!state.confirmed[r.id];if($('undo'))$('undo').disabled=!selected().filter(id=>id!=='finish').length||(r.kind==='discover'&&confirmed);$('confirm').hidden=confirmed;$('confirm').disabled=!TicModel.validAnswer(r,selected());$('next').hidden=!confirmed;$('back').disabled=state.page===0;}
function renderGame(){
  const r=round();if(!r)return;
  const focused=document.activeElement?.dataset?.focus;
  $('workspace').dataset.unit=unit();
  $('prompt').textContent=r.prompt||data.instruction;
  const progress=$('progress');progress.replaceChildren();progress.setAttribute('aria-label','Ronda '+(state.page+1)+' de '+data.rounds.length);
  data.rounds.forEach((_,index)=>{const dot=node('span');if(TicModel.answered(data,state,index))dot.className='complete';if(index===state.page)dot.classList.add('current');progress.appendChild(dot);});
  const content=$('round-content');content.replaceChildren();if(r.kind!=='discover')content.appendChild(model(r));
  if(r.kind==='discover')discoverBoard(r,content);
  else if(r.kind==='pairs')pairs(r,content);
  else if(TicModel.ordered(r))order(r,content);
  else {if(r.kind==='gap'){const gap=node('div',undefined,'gap-word');(r.gap||[]).forEach(value=>gap.appendChild(node('span',value||'?',value?'':'empty-slot')));content.appendChild(gap);}choices(r,content);}
  $('support-panel').dataset.pagecraftSupport=unit();
  document.querySelectorAll('[data-level]').forEach(item=>item.setAttribute('aria-pressed',String(item.dataset.level===state.level)));
  visualFeedback(r,content);feedback(r);updateNav(r);context();
  if(focused){
    // Ao usar uma peça, o foco passa para a peça seguinte disponível ou para Confirmar, nunca para o corpo da página.
    const same=[...content.querySelectorAll('[data-focus]')].find(item=>item.dataset.focus===focused&&!item.disabled);
    const piece=focused.startsWith('piece-')?content.querySelector('[data-piece]:not(:disabled)'):null;
    const next=same||piece||(!$('confirm').hidden&&!$('confirm').disabled?$('confirm'):null)||content.querySelector('button:not(:disabled)');
    if(next)next.focus();
  }
}
function workspace(){return $('workspace');}
function gate(){
  const ready=restored&&preferencesReady;
  for(const id of ['activity-header','main']){$(id).inert=!ready;$(id).hidden=!ready;}
  $('activity-skip').hidden=!ready;$('initialization-status').hidden=ready;
}
function render(){
  gate();
  $('intro').hidden=state.page>=0||demoOpen||state.done;$('demonstration').hidden=!demoOpen;workspace().hidden=state.page<0||demoOpen||state.done;$('finish').hidden=!state.done||demoOpen;
  $('demo-open').hidden=state.done;
  if(state.page>=0&&!state.done&&!demoOpen&&restored&&preferencesReady)renderGame();
  $('local-reflection').hidden=embedded;
  const invite=$('finish-invite');invite.textContent=invites[data.game]||'';invite.hidden=!(state.done&&data.rounds[0].target&&state.level==='challenge'&&invites[data.game]);
  document.querySelectorAll('[data-reflection]').forEach(item=>item.setAttribute('aria-pressed',String(item.dataset.reflection===state.reflection)));
}
function move(index){
  if(!TicModel.accessible(data,state,index))return;
  stopAudio();repeatFound=false;state.page=index;state.pageId=data.rounds[index]?.id||null;state.done=false;pendingPair=null;revisionHint=null;revision++;
  render();context();checkpoint();
  if(restored&&!started.has(unit())){started.add(unit());window.PageCraftBridge?.unitStarted(unit());}
  $('prompt').tabIndex=-1;$('prompt').focus();
}
function confirm(){
  const r=round(),value=selected().slice(),before=(state.discoveries[r.id]||[]).slice(),result=TicModel.confirm(state,r);if(!result.accepted)return;
  repeatFound=r.kind==='discover'&&!!TicModel.discovery(r,value)&&before.includes(TicModel.discovery(r,value).label);
  revision++;context();
  if(result.emit&&restored){const detail={value,question:r.prompt,task_id:r.id,activity:data.slug,field:r.id,level:state.level,aids:{...state.aids[r.id]},model_visible:r.target?state.level==='support':showModel(r),audio_before_choice:state.choiceAudio[r.id]===true};if(revisionHint)detail.after_hint_id=revisionHint;if(r.kind==='discover')window.PageCraftBridge?.emit('attempt',unit(),{detail:{...detail,discoveries:state.discoveries[r.id]||[]}});else window.PageCraftBridge?.attempt(unit(),result.correct,detail);}
  revisionHint=null;checkpoint();renderGame();
  // Som de resposta curto e coerente com o ecrã (o ecrã acrescenta a palavra); nas descobertas intermédias, sem convite a continuar.
  // Uma palavra real que não está escondida tem som próprio, como no ecrã.
  const real=r.kind==='discover'&&!result.correct&&(r.celebrate||[]).includes(value.map(id=>r.pieces.find(p=>p.id===id)?.label||'').join('·'));
  if(value[0]!=='finish'&&!repeatFound)playFeedback(r.kind==='discover'?(real&&data.audio?.realword?'realword':!result.correct?'tryagain':state.confirmed[r.id]?'allfound':'found'):(result.correct?'correct':'tryagain'));
  if(state.confirmed[r.id])$('next').focus();
  else if(r.kind==='discover'&&!selected().length)(document.querySelector('#round-content [data-piece]:not(:disabled)')||$('discover-finish'))?.focus();
}
function setLevel(level,emit=true){if(!TicModel.levels.includes(level))return;state.level=level;revision++;revisionHint=null;if(emit)window.PageCraftBridge?.levelChanged(unit(),level);render();context();checkpoint(emit);}
const invites={'listen-build':'Se quiseres, mostra a um amigo como juntaste as sílabas.','discover':'Se quiseres, mostra a um amigo as palavras que descobriste.','read-choose':'Se quiseres, lê as palavras a um amigo.','sentence':'Se quiseres, lê as frases a um amigo.'};
function finish(){state.done=true;stopAudio();checkpoint();render();$('finish-button').focus();}
const demoTexts={match:'Toca na palavra igual.',pairs:'Toca na imagem. Toca na palavra.',hunt:'Toca nas palavras iguais. Confirma.',syllables:'Toca nas peças por ordem.',gap:'Escolhe a peça que falta.',recall:'Ouve. Junta as peças.'};
function demoPicture(target=false){const card=demoCard('',target);const image=picture(data.word.image,data.word.label);image.style.width='120px';image.style.height='100px';card.prepend(image);return card;}
function demoCard(text,target=false){const card=node('div',text,'demo-card'+(target?' target':''));if(target){const hand=node('span','☝','demo-hand');hand.setAttribute('aria-hidden','true');card.appendChild(hand);}return card;}
function paintDemo(step){
  const kind=data.game,r=data.rounds[Math.max(0,state.page)],stage=$('demo-stage');stage.replaceChildren();
  if(data.demo){paintCycleDemo(step);return;}
  if(kind==='pairs'){stage.append(demoPicture(step===0),node('span','→','demo-arrow'),demoCard(data.word.label,step>0));}
  else if(['syllables','recall'].includes(kind)){
    stage.append(kind==='recall'?demoPicture():demoCard(data.word.label),node('span','→','demo-arrow'));
    r.answer.forEach((id,index)=>{const piece=r.pieces.find(piece=>piece.id===id);stage.appendChild(demoCard(piece.label,index===Math.min(step,r.answer.length-1)));});
    if(step===2)stage.append(demoCard(data.word.label,true));
  }else if(kind==='gap'){
    stage.append(demoCard(r.gap.map(value=>value||'?').join('')),node('span','→','demo-arrow'));
    const answer=r.options.find(option=>option.id===r.answer[0]);stage.append(demoCard(answer.label,step>0));
    const other=r.options.find(option=>option.id!==answer.id);if(other)stage.append(demoCard(other.label));
  }else {
    stage.append(demoCard(data.word.label),node('span','→','demo-arrow'));
    const distractor=r.options.find(option=>option.label!==data.word.label);if(distractor)stage.appendChild(demoCard(distractor.label));
    stage.appendChild(demoCard(data.word.label,step>0));if(kind==='hunt')stage.appendChild(demoCard(data.word.label,step===2));
  }
  $('demo-caption').textContent=demoTexts[kind]||data.instruction;
}
const demoCaptions={'listen-build':'Ouve a palavra. Toca nas sílabas, por ordem. Depois, toca em «Confirmar».','read-choose':'Lê a palavra. Toca na imagem certa. Depois, toca em «Confirmar».','sentence':'Ouve e ordena as palavras. Depois, toca em «Confirmar».','discover':'Junta sílabas para formar uma palavra. Toca em «Confirmar». Depois, procura as outras palavras escondidas.'};
function demoSteps(){if(!data.demo)return 3;if(data.game==='read-choose')return 4;return (data.game==='discover'?data.demo.target.syllables:(data.demo.target.tokens||data.demo.target.syllables)).length+3;}

  const d=data.demo,stage=$('demo-stage'),game=node('div',undefined,'demo-game');game.inert=true;game.setAttribute('aria-hidden','true');
  const last=demoSteps()-1;
  if(data.game==='read-choose'){
    const model=node('div',undefined,'model');model.append(node('span',d.target.label,'word'),fake('🔊'));
    const choices=node('div',undefined,'choices read-choose'),order=[d.options[1],d.options[0],d.options[2]].filter(Boolean);
    order.forEach(option=>{const b=fake('',step===1&&option===d.options[0],step>=1&&option===d.options[0]);b.appendChild(picture(option.image,option.label));choices.appendChild(b);});
    game.append(model,choices);
  }else{
    const units=data.game==='sentence'?d.target.tokens:d.target.syllables,placed=Math.max(0,Math.min(step-1,units.length));
    if(data.game==='discover')game.appendChild(node('p','Encontraste '+(step>=last?1:0)+' de 1.','hidden-count'));
    else{const model=node('div',undefined,'model');if(data.game==='sentence')model.appendChild(picture(d.target.image,d.target.text));model.appendChild(fake('🔊',step===0));game.appendChild(model);}
    const tray=node('div',undefined,'tray');units.slice(0,placed).forEach(u=>tray.appendChild(fake(u)));
    if(data.game!=='discover')for(let i=placed;i<units.length;i++)tray.appendChild(node('span',undefined,'empty-slot'));
    const pieces=node('div',undefined,'pieces'),used=new Set();
    units.slice(0,placed).forEach(u=>used.add(d.pieces.findIndex((p,i)=>p===u&&!used.has(i))));
    const nextIndex=placed<units.length?d.pieces.findIndex((p,i)=>p===units[placed]&&!used.has(i)):-1;
    d.pieces.forEach((p,i)=>{const b=fake(p,step>=1&&i===nextIndex&&step-1===placed);b.disabled=used.has(i);pieces.appendChild(b);});
    game.append(tray,pieces);
  }

  if(step>=last){const ok=node('div',undefined,'feedback ok');ok.append(node('span','✓','icon'),node('span',data.game==='discover'?'Encontraste «'+d.target.label+'».':'Está certo!'));game.appendChild(ok);}

function runDemo(){

<script>/* Modal comum: o host cobre todo o ecrã; HTML autónomo usa o mesmo componente. */
(function () {
  'use strict';
  let dialog, handler, activeId;
  function close(hintId) {
    if(hintId && hintId!==activeId)return;
    if(dialog?.open)dialog.close();

  }
  function notice(hintId,text){
    if(hintId===activeId && dialog?.open)dialog.querySelector('.pc-help-status').textContent=String(text).slice(0,250);
  }
  function open(payload, onAction) {
    if(typeof payload.hint_id!=='string' || typeof payload.text!=='string')return;
    if(!dialog){
      const style=document.createElement('style');
      style.textContent=`.pc-help-modal{box-sizing:border-box;position:fixed;inset:0;margin:0;border:0;width:100vw;max-width:none;height:100dvh;max-height:none;padding:clamp(20px,5vw,64px);background:#f5f3ea;color:#233c32;font:inherit;overflow:auto}.pc-help-modal::backdrop{background:#233c32}.pc-help-modal .pc-help-card{max-width:720px;margin:auto;min-height:100%;display:flex;flex-direction:column;justify-content:center;gap:20px}.pc-help-modal h2{font-size:1.4em;margin:0}.pc-help-modal .pc-help-text{font-size:1.25em;line-height:1.5;overflow-wrap:anywhere;margin:0}.pc-help-modal .pc-help-buttons{display:flex;flex-wrap:wrap;gap:12px}.pc-help-modal button{font:inherit;min-height:56px;padding:12px 18px;border:2px solid #38624f;border-radius:10px;background:#fffefa;color:#233c32;cursor:pointer}.pc-help-modal button[data-action=continue]{background:#233c32;color:#fffefa}.pc-help-modal :focus-visible{outline:3px solid #285cc0;outline-offset:4px}`;
      document.head.append(style);
      dialog=document.createElement('dialog');dialog.className='pc-help-modal';
      dialog.setAttribute('aria-labelledby','pc-help-title');dialog.setAttribute('aria-describedby','pc-help-text');
      // Retomar exige uma escolha explícita; não existe áudio nem avanço automático.
      dialog.addEventListener('cancel',event=>event.preventDefault());
      dialog.addEventListener('keydown',event=>{
        if(event.key!=='Tab')return;
        const buttons=Array.from(dialog.querySelectorAll('button:not([disabled])'));
        const first=buttons[0],last=buttons.at(-1);
        if(!first)return;
        const active=document.activeElement;
        if(event.shiftKey && (active===first || active===dialog || !dialog.contains(active))){
          event.preventDefault();last.focus();
        }else if(!event.shiftKey && (active===last || active===dialog || !dialog.contains(active))){
          event.preventDefault();first.focus();
        }
      });
      dialog.addEventListener('click',event=>{
        const action=event.target.closest('[data-action]')?.dataset.action;
        if(!['listen','next','stuck','continue','teacher'].includes(action))return;
        const callback=handler,hintId=activeId;
        if(action!=='listen')close();
        callback?.(action,hintId);
      });

    dialog.replaceChildren();

    const title=document.createElement('h2');title.id='pc-help-title';title.textContent=String(payload.title||'Um próximo passo').slice(0,100);
    const text=document.createElement('p');text.id='pc-help-text';text.className='pc-help-text';text.textContent=payload.text.slice(0,400);
    const buttons=document.createElement('div');buttons.className='pc-help-buttons';
    for(const action of ['listen','next','stuck','teacher','continue']){
      const button=document.createElement('button');button.type='button';button.dataset.action=action;
      button.textContent=String(payload.labels?.[action]||action).slice(0,100);buttons.append(button);
    }
    const status=document.createElement('p');status.className='pc-help-status';status.setAttribute('role','status');

    if(!dialog.open)dialog.showModal();

  }

  function attachHost(){
    const frame=document.getElementById('activity-frame')||document.getElementById('lesson');
    if(!frame)return;
    frame.addEventListener('load',()=>close());
    window.addEventListener('pagehide',()=>close());
    window.addEventListener('message',event=>{
      if(event.source!==frame.contentWindow || event.data?.pagecraft!==1 || event.data.type!=='support_modal')return;
      const p=event.data.payload||{};
      if(p.action==='close'){close(p.hint_id);return;}
      if(p.action==='notice'){notice(p.hint_id,p.text);return;}
      if(p.action!=='open' || document.getElementById('freeze-overlay')?.hidden===false)return;
      open(p,(action,hintId)=>frame.contentWindow?.postMessage({pagecraft:1,type:'support_modal_action',payload:{hint_id:hintId,action}},'*'));
    });
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',attachHost,{once:true});else attachHost();
})();

      value.context_truncated=true;
    }
    return value;
  }
  function requestContext() {
    return boundContext({activity:config.activity,activity_version:config.activity_version,objective:config.objective,
      age_range:config.age_range||'não indicada',activity_characteristics:{topic:config.topic,
        duration_minutes:config.duration_minutes,task_description:plan().task_description,interaction:plan().interaction},
      stage:plan().title,stage_objective:plan().objective,criteria:plan().criteria,product:context.product||'',
      participant_count:members,language,obstacle:obstacle().id,question:context.question||obstacle().label[language],
      task_id:context.task_id,revision:context.revision,
      answer:String(context.answer??'').slice(0,1500),level:context.level||'intermediate',
      observed_difficulties:failures.key===taskKey()?failures.observed:[],
      previous_hints:relevant().slice(-2).map(h=>({text:h.text,usefulness:h.usefulness||'not_reported'})),
      observation:'Respostas e ações PageCraft; trabalho externo apenas declarado.'});
  }
  function update(next) {
    if(!config || !config.units[next.unit_id||unitId])return;
    const before=signature(), oldUnit=unitId;
    unitId=next.unit_id||unitId;
    context={...(oldUnit===unitId?context:contexts.get(unitId)||{}),...next};
    contexts.set(unitId,context);
    if(before!==signature())invalidate();
    if(failures.key!==taskKey())resetFailures();
    mount();render();
  }
  function present(text, source, requestId=null, hintKey=null, automatic=false) {
    const originalContext=requestContext();
    current={hint_id:id(),unit_id:unitId,activity_version:config.activity_version,context:originalContext,obstacle:obstacle().id,product:context.product||'',text,source,
      request_id:requestId,hint_key:hintKey,language,automatic,signature:signature(),usefulness:null};
    pending=null;notice='';
    if(!render()){current=null;return;}
    history.push(current);
    render();
    emit('hint_presented',{hint_id:current.hint_id,hint_key:hintKey,text,source,request_id:requestId,
      obstacle:current.obstacle,product:current.product,language,context:originalContext,presentation:automatic?'modal':'inline'});
    if(automatic)showModal();
    focusCurrentAction();
  }
  function requestHint(unit, automatic=false) {
    closeModal();
    if(unit)update({unit_id:unit});
    if(!plan())return;
    pending=null;
    const used=new Set(relevant().filter(h=>h.source==='guide').map(h=>h.hint_key));
    const next=obstacle().hints.find(h=>!used.has(h.id));
    if(!next){if(automatic)present(t('escalate'),'guide',null,null,true);else {notice=t('escalate');render();}return;}
    present(next.text[language][members>1?'group':'individual'],'guide',null,next.id,automatic);
  }
  function feedback(usefulness) {
    if(!current || !['helped','not_helped'].includes(usefulness) || current.usefulness===usefulness)return;
    current.usefulness=usefulness;
    emit('hint_feedback',{hint_id:current.hint_id,usefulness,obstacle:current.obstacle});
    notice=usefulness==='helped'?t('helpedNotice'):'';render();
  }
  function requestAI(automatic=false) {
    if(pending || !plan())return;
    if(route==='standalone'){if(automatic)requestHint(undefined,true);return;}
    pending={request_id:id(),unit_id:unitId,signature:signature(),automatic};
    notice=t('wait');emit('feedback_request',{...requestContext(),request_id:pending.request_id,
      trigger:automatic?'consecutive_incorrect_attempts':'explicit_request'});render();
  }
  function receive(payload) {
    if(!pending || payload.request_id!==pending.request_id || payload.unit_id!==unitId || pending.signature!==signature() || typeof payload.text!=='string')return;
    const automatic=pending.automatic;
    if(relevant().some(h=>h.text.trim()===payload.text.trim()) || (automatic && ['timeout','fallback','unavailable'].includes(payload.source))){pending=null;requestHint(undefined,automatic);return;}
    present(payload.text.slice(0,400),payload.source||'ai',payload.request_id,null,automatic);
  }
  function help() {
    if(!plan())return;
    teacherRequest ||= {request_id:id()};
    emit('help_needed',{help_request_id:teacherRequest.request_id,note:obstacle().label[language],context:requestContext(),hint_id:current?.hint_id||null});
    notice=route==='standalone'?t('callTeacher'):t('requested');render();
  }
  function resolved() {
    emit('help_resolved',{help_request_id:teacherRequest?.request_id,note:t('resolvedNotice')});
    teacherRequest=null;notice=t('resolvedNotice');render();
  }
  function setLocation(value) {
    if(!['pagecraft','external','reading','discussion'].includes(value))return;
    if(value==='external'&&!config.externalWork)return;
    location=value;invalidate();resetFailures();
    emit('work_location',{location:value,label:value==='external'?config.externalWork?.[language]:undefined});
    notice=value==='pagecraft'?t('returned'):t('outside');render();
  }
  function voiceNotice(text){
    notice=text;render();

    else emit('support_modal',{action:'notice',hint_id:modalHint,text});
  }
  function readHint(hint, report=false) {
    if(!hint)return;
    const notify=text=>{if(report)voiceNotice(text);else {notice=text;render();}};
    if(!window.speechSynthesis || typeof SpeechSynthesisUtterance==='undefined'){notify(t('voiceMissing'));return;}
    const utterance=new SpeechSynthesisUtterance(hint.text);
    utterance.lang=hint.language==='en'?'en-GB':'pt-PT';
    utterance.onerror=()=>{if(report?current===hint:history.includes(hint))notify(t('voiceError'));};
    window.speechSynthesis.cancel();window.speechSynthesis.speak(utterance);

  function listen(){readHint(current,true);}

      const original=hint.context;
      const previous=hint.unit_id!==unitId || hint.activity_version!==config.activity_version ||
        (hint.signature ? hint.signature!==signature() : !original ||
          ['stage','question','answer','product','level','obstacle','participant_count','language'].some(key=>original[key]!==now[key]) ||
          ['task_id','revision'].some(key=>Object.hasOwn(original,key) && original[key]!==now[key]));
      const field=(key,value)=>value==null||value===''?'':'<dt>'+esc(t(key))+'</dt><dd>'+esc(value)+'</dd>';
      return '<li><details data-support-disclosure="hint-'+index+'"><summary>'+esc(t('historyHint'))+' '+(index+1)+' · '+esc(original?.stage||hint.unit_id)+'</summary>'+
        (previous?'<p class="pc-support-note">'+esc(t('previousContext'))+'</p>':'')+
        '<dl>'+field('stage',original?.stage||hint.unit_id)+field('version',hint.activity_version)+
        (original?field('question',original.question)+field('answer',original.answer)+field('product',original.product)+
          field('level',COPY[language][original.level]||original.level)+field('participants',original.participant_count)+
          field('hintLanguage',original.language)+field('goal',original.stage_objective)+field('criteria',original.criteria?.join(' · ')):'')+'</dl>'+
        (!original?'<p class="pc-support-note">'+esc(t('savedContext'))+'</p>':'')+
        '<p class="pc-support-history-text" lang="'+(hint.language==='en'?'en-GB':'pt-PT')+'">'+esc(hint.text)+'</p>'+
        '<button type="button" data-support-action="history-listen-'+index+'" data-support-hint-id="'+esc(hint.hint_id)+'">'+esc(t('listen'))+' · '+esc(t('historyHint'))+' '+(index+1)+'</button></details></li>';
    }).join('')+'</ol></details>';
  }
  function render() {
    const panel=panels.get(unitId);
    if(!panel || panel.isConnected===false || !plan())return false;
    const button=(action,label,disabled=false)=>'<button type="button" data-support-action="'+action+'" '+(disabled?'disabled':'')+'>'+esc(label)+'</button>';
    const active=document.activeElement?.closest?.('[data-pagecraft-support]')===panel?document.activeElement.dataset.supportAction:null;
    const actionFocused=document.activeElement?.matches?.('.pc-support-action') && document.activeElement.closest('[data-pagecraft-support]')===panel;
    const open=Array.from(panel.querySelectorAll?.('[data-support-disclosure][open]')||[],node=>node.dataset.supportDisclosure);
    const settings=(!locked?button('mode',members>1?t('alone'):t('pair')):'')+
      '<label>'+esc(t('obstacle'))+'<select data-support-obstacle>'+plan().obstacles.map(o=>'<option value="'+o.id+'" '+(obstacle().id===o.id?'selected':'')+'>'+esc(o.label[language])+'</option>').join('')+'</select></label>';
    panel.innerHTML='<h3>'+esc(t('title'))+'</h3>'+(current?

      '<div class="pc-support-controls">'+button('listen',t('listen'))+button('next',t('next'))+'</div>'+
      '<div class="pc-support-controls">'+button('helped',t('helped'))+button('stuck',t('stuck'))+'</div>'+
      '<div class="pc-support-controls">'+button('teacher',t('teacher'))+button('ai',t('ai'),!!pending||route==='standalone')+'</div>'+
      '<details><summary>'+esc(t('settings'))+'</summary>'+settings+'</details>':settings+'<div class="pc-support-controls">'+button('hint',t('hint'))+button('teacher',t('teacher'))+'</div>')+
      '<div class="pc-support-controls">'+(location==='pagecraft'?

<script data-pagecraft-bridge-lite>
/* pagecraft-bridge-lite: recetor de «chamar a atenção» (injetado na publicação) */
(function () {
  window.addEventListener('message', function (ev) {
    var d = ev.data;
    if (!d || d.pagecraft !== 1 || d.type !== 'highlight') return;
    var el = null;
    if (d.unitId) {
      el = document.getElementById(d.unitId) ||
           document.querySelector('[data-unit="' + d.unitId + '"]');
      if (!el) {
        /* heurística para páginas antigas: uN aponta para a N-ésima secção */
        var n = parseInt(String(d.unitId).replace(/^u/, ''), 10);
        var sections = document.querySelectorAll('main section');
        if (!sections.length) sections = document.querySelectorAll('section, .knowledge-unit, .card');
        if (n >= 1 && n <= sections.length) el = sections[n - 1];
      }
    }
    if (!el) el = document.querySelector('main') || document.body;
    try { el.scrollIntoView({ behavior: 'smooth', block: 'center' }); } catch (e) {}
    el.classList.remove('pagecraft-attention');
    void el.offsetWidth;
    el.classList.add('pagecraft-attention');
    setTimeout(function () { el.classList.remove('pagecraft-attention'); }, 6000);
  });
})();
</script>
