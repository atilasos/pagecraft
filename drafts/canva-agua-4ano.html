sta", "en": "3. Our suggestion"}, "prompt": {"pt-PT": "O que podemos fazer? Como ajuda?", "en": "What can we do? How does it help?"}, "starter": {"pt-PT": "Propomos… porque…", "en": "We suggest… because…"}}, {"id": "invitation", "title": {"pt-PT": "4. Convite à ação", "en": "4. An invitation to act"}, "prompt": {"pt-PT": "A quem pedimos ajuda? O que pode fazer?", "en": "Who are we asking to help? What can they do?"}, "starter": {"pt-PT": "Junta-te a nós:…", "en": "Join us:…"}}], "wordBank": {"pt-PT": "torneira · água · reparar · avisar · regar · cuidar · escola", "en": "tap · water · repair · tell · water plants · care · school"}, "fallback": {"pt-PT": "Sem acesso ao Canva? Guarda o plano e usa quatro cartões de papel. Conta ao professor o que ficou por experimentar.", "en": "No access to Canva? Save your plan and use four paper cards. Tell your teacher what you still need to try."}, "challenge": {"pt-PT": "Como poderemos verificar se a nossa proposta ajudou? Não inventes resultados.", "en": "How could we check whether our suggestion helped? Do not invent results."}}}, {"id": "share", "duration": 5, "copy": {"title": {"pt-PT": "Mostra, escuta e melhora", "en": "Show, listen and improve"}, "prompt": {"pt-PT": "Mostra a apresentação a outro par. O que perceberam? Que parte pode ficar mais clara?", "en": "Show your presentation to another pair. What did they understand? Which part could be clearer?"}, "suggestion": {"pt-PT": "Uma sugestão que recebemos", "en": "A suggestion we received"}, "revision": {"pt-PT": "O que decidi mudar — ou manter — e porquê", "en": "What I chose to change — or keep — and why"}}}, {"id": "reflect", "duration": 5, "copy": {"title": {"pt-PT": "O que aprendi? O que quero experimentar a seguir?", "en": "What did I learn? What do I want to try next?"}, "prompt": {"pt-PT": "Pensa no teu trabalho. Podes deixar uma resposta por dar. As tuas respostas ajudam o professor a preparar o trabalho seguinte.", "en": "Think about your work. You may leave a question unanswered. Your answers help your teacher plan what comes next."}, "achievement": {"pt-PT": "O que consegui fazer? Mostra um exemplo.", "en": "What did I manage to do? Give an example."}, "helpNeeded": {"pt-PT": "Onde precisei de ajuda?", "en": "Where did I need help?"}, "nextStep": {"pt-PT": "O que quero experimentar a seguir?", "en": "What do I want to try next?"}, "supportStarters": [{"pt-PT": "Consegui…", "en": "I managed to…"}, {"pt-PT": "Precisei de ajuda para…", "en": "I needed help to…"}, {"pt-PT": "A seguir quero…", "en": "Next I want to…"}], "challengePrompt": {"pt-PT": "Que parte do teu trabalho mostra isso? Como vais verificar o teu próximo passo?", "en": "Which part of your work shows this? How will you check your next step?"}}}], "assessment": {"criteria": [{"id": "water-action", "label": {"pt-PT": "Explico um problema de água na escola e proponho uma ação.", "en": "I explain a water problem at school and suggest an action."}, "observable": "O plano relaciona situação concreta e ação adequada; o professor confirma oralmente a justificação."}, {"id": "clear-slides", "label": {"pt-PT": "Organizo quatro diapositivos que os colegas conseguem ler.", "en": "I organise four slides that classmates can read."}, "observable": "Plano com quatro funções distintas; aluno compara versões de legibilidade. A leitura da apresentação Canva é verificada pelo professor/colega."}, {"id": "revise-together", "label": {"pt-PT": "Uso uma sugestão para melhorar e escolho um próximo passo.", "en": "I use a suggestion to improve and choose a next step."}, "observable": "Aluno regista uma sugestão e alteração ou justifica mantê-la; identifica um próximo passo concreto."}], "options": [{"value": "independent", "label": {"pt-PT": "Consegui com autonomia", "en": "I managed independently"}}, {"value": "with-help", "label": {"pt-PT": "Consegui com ajuda", "en": "I managed with help"}}, {"value": "next-time", "label": {"pt-PT": "Quero continuar a praticar", "en": "I want to keep practising"}}, {"value": "not-tried", "label": {"pt-PT": "Ainda não experimentei", "en": "I have not tried it yet"}}], "optional": true, "teacherFields": ["Observação com evidência", "Próximo passo acordado", "Apoio/parceria a preparar"], "noAutomaticGrade": true}};

function actionFeedback(){return esc(state.action==='tell'?t('Um adulto pode verificar a fuga. Isso ajuda na situação que escolheste? E se apenas fizermos um cartaz?','An adult can check the leak. Does this help in your chosen situation? What if we only make a poster?'):state.action==='check'?t('Verificar a terra ajuda a decidir se é preciso regar. O que aconteceria se regássemos sempre?','Checking the soil helps decide whether watering is needed. What would happen if we always watered?'):state.action==='poster'?t('O cartaz lembra a ideia. Quem o lê sabe o que fazer na tua situação? Compara com uma ação concreta.','The poster is a reminder. Does a reader know what to do in your situation? Compare with a specific action.'):t('Escolhe uma proposta e pensa nas consequências. Depois podes experimentar outra.','Choose a suggestion and think about its effects. Then you can try another.'))}
function slide(before){return `<div class="slide ${before?'soft':state.contrast}" ${before?'': 'id="afterSlide"'}><p ${before?'style="font-size:18px"':`id="slideText" style="font-size:${Number(state.fontSize)}px"`}>${esc(l(SPEC.units[1].copy[before||state.textLength==='long'?'longText':'shortText']))}</p>${tapArt}</div>`}
function guide(){return `<p>${esc(l(SPEC.units[1].copy.prompt))}</p><div class="grid comparison"><figure><figcaption>${t('Antes','Before')}</figcaption>${slide(true)}</figure><figure><figcaption>${t('Depois: a tua experiência','After: your experiment')}</figcaption>${slide(false)}</figure></div><details><summary>${t('Ler o texto do exemplo','Read the example text')}</summary><p>${esc(l(SPEC.units[1].copy.longText))}</p></details>${state.level==='support'?`<div class="actions"><button data-preset="first">${t('Experimentar exemplo A','Try example A')}</button><button data-preset="second">${t('Experimentar exemplo B','Try example B')}</button></div>`:''}<div class="grid">${radios('textLength',t('Quantidade de texto','Amount of text'),[['short',t('Texto curto','Short text')],['long',t('Texto longo','Long text')]])}${radios('contrast',t('Contraste no exemplo','Contrast in the example'),[['soft',t('Contraste suave','Soft contrast')],['strong',t('Contraste forte','Strong contrast')]])}</div><label for="fontSize">${t('Tamanho da letra','Text size')}: <output id="sizeValue" for="fontSize">${state.fontSize}</output></label><input id="fontSize" type="range" min="18" max="40" step="2" value="${Number(state.fontSize)}" data-field="fontSize"><p class="status" id="comparisonFeedback" role="status">${comparisonFeedback()}</p><button data-reset>${t('Reiniciar comparação','Reset comparison')}</button>${field('reason',l(SPEC.units[1].copy.reason))}<div class="hint"><h3>${esc(l(SPEC.units[1].copy.canvaTitle))}</h3><p>${esc(l(SPEC.units[1].copy.canvaGuide))}</p><a class="button primary" href="https://www.canva.com/" target="_blank" rel="noopener noreferrer">${esc(l(SPEC.units[1].copy.canvaLinkLabel))}</a><p style="margin-top:16px">${esc(l(SPEC.units[1].copy.externalNotice))}</p></div>`}
function comparisonFeedback(){return esc(comparisonChanged?t('A versão Depois mudou. Compara o espaço, a letra e a mensagem. Qual explicarias aos colegas?','The After version changed. Compare the space, text and message. Which would you explain to classmates?'):t('Muda uma escolha e compara as duas versões.','Change one setting and compare both versions.'))}
function create(){const c=SPEC.units[2].copy;return `<p>${esc(l(c.prompt))}</p>${radios('workMode',t('Onde estou a criar a apresentação?','Where am I creating my presentation?'),[['canva','Canva'],['paper',t('Quatro cartões de papel','Four paper cards')]])}<p id="workNotice" class="hint">${esc(state.workMode==='paper'?l(c.fallback):t('A meio do tempo, troquem quem edita e quem revê. Se trabalhas em casa, podes guardar a partilha para a aula.','Halfway through, swap who edits and who reviews. If you are working at home, you can save sharing for class.'))}</p>${state.level==='support'?hint(l(c.wordBank),l(c.wordBank)):''}<div class="grid">${c.slides.map((x,i)=>`<article class="card"><h3>${esc(l(x.title))}</h3>${field(['problem','planExample','proposal','invitation'][i],l(x.prompt),state.level==='support'?l(x.starter):'')}</article>`).join('')}</div><div class="actions"><button data-goto="1">${t('Voltar a experimentar a legibilidade','Try readability again')}</button></div>`}
function share(){return `<p>${esc(l(SPEC.units[3].copy.prompt))}</p>${hint('Em casa, podes guardar a partilha para a aula. Não precisas de inventar uma sugestão.','At home, you can save sharing for class. You do not need to invent a suggestion.')}${field('suggestion',l(SPEC.units[3].copy.suggestion))}${field('revision',t('O que decidi mudar ou manter, e porquê','What I chose to change or keep, and why'))}`}
function reflectionForm(){return SPEC.assessment.criteria.map(c=>`<fieldset class="card"><legend>${esc(l(c.label))}</legend>${SPEC.assessment.options.map(o=>`<label class="choice"><input type="radio" name="reflection-${c.id}" data-reflection="${c.id}" value="${o.value}" ${state.reflections[c.id]===o.value?'checked':''}><span>${esc(l(o.label))}</span></label>`).join('')}<button data-clear="${c.id}">${t('Limpar escolha','Clear choice')}</button></fieldset>`).join('')+['achievement','helpNeeded','nextStep'].map((key,i)=>field(key,l(SPEC.units[4].copy[key]),state.level==='support'?l(SPEC.units[4].copy.supportStarters[i]):'')).join('')+`<button class="primary" data-local-save>${t('Guardar reflexão nesta aba','Save reflection in this tab')}</button><p id="reflectionStatus" role="status"></p>`}
function reflect(){return `<p>${esc(l(SPEC.units[4].copy.prompt))}</p><p>${t('Pensa num exemplo que mostre o que fizeste e numa coisa que queres experimentar a seguir.','Think of an example that shows what you did and one thing you want to try next.')}</p><button class="primary" data-finish>${t('Autoavaliar e terminar','Reflect and finish')}</button>${!embedded&&state.reflectOpen?`<div id="reflectionForm">${reflectionForm()}</div>`:''}`}
function render(){document.documentElement.lang=state.language==='en'?'en':'pt-PT';document.title=l(SPEC.title);$('language').value=state.language;$('langLabel').textContent=t('Língua','Language');$('levelLabel').textContent=t('Apoio para trabalhar','Support for working');$('level').innerHTML=[['support',t('Broto · Apoio','Sprout · Support')],['intermediate',t('Árvore jovem · Intermédio','Young tree · Core')],['challenge',t('Árvore robusta · Desafio','Strong tree · Challenge')]].map(([v,label])=>`<option value="${v}" ${state.level===v?'selected':''}>${label}</option>`).join('');$('brand').textContent=t('Água na escola','Water at school');$('title').textContent=l(SPEC.title);$('intro').textContent=t('Como podemos poupar água na nossa escola? Experimenta, cria e partilha uma ideia que ajude a agir.','How can we save water at our school? Explore, create and share an idea that helps people take action.');$('meta').textContent=t('4.º ano · 45 minutos · Introdução ao Canva','Year 4 · 45 minutes · Introduction to Canva');$('skip').textContent=t('Ir para a atividade','Skip to the activity');$('steps').setAttribute('aria-label',t('Etapas da atividade','Activity steps'));const names=t(['Explorar','Experimentar','Criar','Partilhar','Refletir'],['Explore','Experiment','Create','Share','Reflect']);$('steps').innerHTML=names.map((n,i)=>`<button data-goto="${i}" ${state.step===i?'aria-current="step"':''}><span class="stepnum">${i+1}.</span> ${n}<small>${SPEC.units[i].duration} min</small></button>`).join('');const u=SPEC.units[state.step];$('main').innerHTML=`<section class="sheet" aria-labelledby="stepTitle" data-unit="${u.id}"><div class="sectionhead"><h2 id="stepTitle" tabindex="-1">${esc(l(u.copy.title))}</h2><span class="time">${u.duration} min</span></div>${criteria()}${levelHint(state.step)}${[explore,guide,create,share,reflect][state.step]()}<div class="actions"><button data-help>${t('Preciso de ajuda','I need help')}</button></div><p id="helpStatus" class="status" role="status"></p><p id="draftStatus" class="status muted" role="status"></p><div class="actions bottom"><button data-goto="${state.step-1}" ${state.step===0?'disabled':''}>${t('Anterior','Previous')}</button>${state.step<4?`<button class="primary" data-goto="${state.step+1}">${t('Seguinte','Next')}</button>`:''}</div></section>`;$('footer').textContent=t('PageCraft · Estudo do Meio e TIC · Sem Canva, podes experimentar e planear aqui, e criar em papel.','PageCraft · Environmental Studies and ICT · Without Canva, you can experiment and plan here, then create on paper.');}
function persist(){if(!embedded){try{sessionStorage.setItem('pagecraft-water-plan',JSON.stringify(state));if($('draftStatus'))$('draftStatus').textContent=t('Rascunho guardado nesta aba. Não foi enviado ao professor.','Draft saved in this tab. It has not been sent to your teacher.');return true}catch{if($('draftStatus'))$('draftStatus').textContent=t('A gravação nesta aba não está disponível. Mantém a página aberta para conservar o trabalho.','Saving in this tab is unavailable. Keep this page open to keep your work.');return false}}return true}
function evidence(){const unit=SPEC.units[state.step].id;const shared={language:state.language,level:state.level};let result;if(unit==='explore')result={...shared,scenario:state.scenario,example:state.example,observed:state.observed,audience:state.audience,action:state.action,prediction:state.prediction};else if(unit==='guide')result={...shared,before:{textLength:'long',fontSize:18,contrast:'soft'},after:{textLength:state.textLength,fontSize:state.fontSize,contrast:state.contrast},reason:state.reason};else if(unit==='create')result={...shared,slidePlan:{problem:state.problem,example:state.planExample,proposal:state.proposal,invitation:state.invitation},workMode:state.workMode};else if(unit==='share')result={...shared,suggestion:state.suggestion,revision:state.revision};else return;const detail=t('Registo da interação no PageCraft. Não confirma trabalho no Canva.','Record of interaction in PageCraft. Does not confirm work in Canva.'); if(unit==='create'){for(const [key,value] of Object.entries(result.slidePlan))B.assessment(unit,{...shared,workMode:state.workMode,slidePlan:{[key]:value}},detail)}else if(unit==='explore'){for(const [key,value] of Object.entries(result)){if(!['language','level'].includes(key))B.assessment(unit,{...shared,[key]:value},detail)}}else if(unit==='share'){B.assessment(unit,{...shared,suggestion:state.suggestion},detail);B.assessment(unit,{...shared,revision:state.revision},detail)}else B.assessment(unit,result,detail)}
function save(){persist();clearTimeout(saveTimer);saveTimer=setTimeout(evidence,500)}
function flush(){clearTimeout(saveTimer);evidence();persist()}
function goto(step){if(step<0||step>4)return;flush();state.step=step;render();persist();$('stepTitle').focus();B.unitStarted(SPEC.units[step].id)}
function updateComparison(){comparisonChanged=true;$('afterSlide').className='slide '+state.contrast;$('slideText').textContent=l(SPEC.units[1].copy[state.textLength==='long'?'longText':'shortText']);$('slideText').style.fontSize=Number(state.fontSize)+'px';$('sizeValue').textContent=state.fontSize;$('comparisonFeedback').textContent=comparisonFeedback()}
function preference(language,level,notify){flush();if(['pt','en'].includes(language)){state.language=language;if(notify)B.emit('language_changed',null,{language})}if(['support','intermediate','challenge'].includes(level)){state.level=level;if(notify)B.emit('level_changed',null,{level})}render();persist()}
$('language').addEventListener('change',e=>preference(e.target.value,null,true));$('level').addEventListener('change',e=>preference(null,e.target.value,true));
document.addEventListener('input',e=>{const key=e.target.dataset.field;if(!key)return;state[key]=key==='fontSize'?Number(e.target.value):e.target.value.slice(0,300);if(['fontSize','contrast','textLength'].includes(key))updateComparison();if(key==='action')$('actionFeedback').textContent=actionFeedback();if(key==='workMode')$('workNotice').textContent=state.workMode==='paper'?l(SPEC.units[2].copy.fallback):t('A meio do tempo, troquem quem edita e quem revê.','Halfway through, swap who edits and who reviews.');save()});
document.addEventListener('change',e=>{if(e.target.dataset.reflection){state.reflections[e.target.dataset.reflection]=e.target.value;persist()}});
document.addEventListener('click',e=>{const el=e.target.closest('button');if(!el)return;if(el.hasAttribute('data-help')){B.emit('help_needed',SPEC.units[state.step].id,{note:t('Pedido de ajuda nesta etapa.','Help requested for this step.')});$('helpStatus').textContent=t('Mostra esta etapa ao professor ou a um colega e conta onde precisas de ajuda.','Show this step to your teacher or a partner and explain where you need help.');return}if(el.dataset.goto!==undefined){goto(Number(el.dataset.goto));return}if(el.dataset.preset){Object.assign(state,el.dataset.preset==='first'?{textLength:'long',fontSize:18,contrast:'soft'}:{textLength:'short',fontSize:32,contrast:'strong'});comparisonChanged=true;render();save();document.querySelector(`[data-preset="${el.dataset.preset}"]`).focus()}if(el.hasAttribute('data-reset')){Object.assign(state,{textLength:'long',fontSize:18,contrast:'soft'});comparisonChanged=false;render();save();document.querySelector('[data-reset]').focus()}if(el.hasAttribute('data-finish')){flush();if(embedded)B.emit('open_reflection',null,{});else{state.reflectOpen=true;render();document.querySelector('#reflectionForm input').focus();persist()}}if(el.dataset.clear){delete state.reflections[el.dataset.clear];render();persist();document.querySelector(`[data-clear="${el.dataset.clear}"]`).focus()}if(el.hasAttribute('data-local-save')){$('reflectionStatus').textContent=persist()?t('Reflexão guardada nesta aba. Mostra-a ao professor. Nada foi enviado.','Reflection saved in this tab. Show it to your teacher. Nothing was sent.'):t('Não foi possível guardar. Mantém esta página aberta e mostra o trabalho ao professor.','Could not save. Keep this page open and show your teacher.')}});
window.addEventListener('message',event=>{if(event.source!==window.parent||!embedded)return;const d=event.data;if(!d||d.pagecraft!==1)return;if(d.type==='learning_preferences'&&d.payload)preference(d.payload.language,d.payload.level,false)});
window.addEventListener('pagehide',flush);
render();B.emit('activity_loaded',null,{title:document.title});B.unitStarted(SPEC.units[state.step].id);
</script></body></html>
