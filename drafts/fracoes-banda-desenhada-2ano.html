<!doctype html>
<html lang="pt-PT">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Explorar as frações · Minecraft</title>
<style>
:root{--ink:#243c35;--paper:#fffdf6;--bg:#f6eddf;--green:#315e4d;--gold:#f7ce67;--line:#cfceba;--focus:#195ba0}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:21px/1.45 system-ui,sans-serif}button,select{font:inherit;color:inherit}button,select{min-height:52px;border:2px solid var(--ink);border-radius:12px;padding:10px 16px;background:var(--paper)}button{cursor:pointer;touch-action:manipulation;font-weight:700}button:disabled{opacity:.48;cursor:default}button[aria-pressed=true],.primary{background:var(--green);color:white}button:focus-visible,select:focus-visible,a:focus-visible{outline:4px solid var(--focus);outline-offset:4px}[hidden]{display:none!important}.skip{position:absolute;top:-80px;left:15px;background:white;padding:12px;z-index:2}.skip:focus{top:10px}.draft{margin:0;background:#e7e2d6;text-align:center;padding:8px 12px;font-size:14px}.wrap{max-width:1200px;margin:auto;padding:24px}header{text-align:center}h1{font-size:clamp(30px,4vw,44px);line-height:1.15;margin:12px 0}h2{font-size:25px;line-height:1.2;margin:12px 0 18px}.eyebrow{font-size:15px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;margin:8px 0}.toolbar{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;align-items:center;margin:22px 0}.toolbar label{font-size:16px}.steps{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin:20px 0 28px}.steps button{font-size:17px}.steps [aria-current=step]{box-shadow:0 4px 0 var(--green)}.panels{display:grid;grid-template-columns:.65fr 1.3fr 1fr;gap:16px}.panel{background:var(--paper);border:3px solid var(--ink);border-radius:5px 20px 6px 18px;padding:20px;min-width:0;box-shadow:5px 5px 0 #243c3514}.panel-title{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:800;margin-bottom:24px}.number{width:34px;height:34px;border:2px solid var(--ink);border-radius:50%;background:var(--gold);display:grid;place-items:center}.friends{display:flex;gap:20px;justify-content:center;margin:30px 0}.friend{text-align:center;font-size:17px}.face{display:block;width:48px;height:48px;background:#efbd8c;border:3px solid var(--ink);border-top:10px solid #5b4937;margin:0 auto 8px;position:relative}.face:after{content:'• •';position:absolute;left:9px;top:0;white-space:pre;font-size:17px}.friend:last-child .face{background:#b67b55;border-top-color:#253a36}.story{font-size:24px}.scene{background:#e9ecdc;border-radius:14px;padding:18px 10px}.bread{display:block;width:100%;max-width:370px;margin:16px auto 26px}.cuts,.choices{display:flex;flex-wrap:wrap;gap:8px}.cuts button{flex:1;padding:8px 3px;font-size:15px;min-width:80px}.cut-icon{display:block;position:relative;background:#dba15b;height:19px;width:50px;border-radius:9px;margin:6px auto 10px}.cut-icon:after{content:'';position:absolute;top:-4px;bottom:-4px;left:var(--cut);border-left:3px dashed var(--ink)}.prompt{font-size:17px;text-align:center;margin:14px 0 0}.choices button{flex:1}.feedback{margin-top:20px;background:#e8eedf;border-left:5px solid var(--green);border-radius:6px;padding:14px;font-size:18px}.feedback strong{display:block;margin-bottom:6px}.bars{display:grid;gap:10px;margin-top:15px;border-left:3px solid var(--ink);padding-left:3px}.bars span{display:block;height:26px;background:#dba15b;border:2px solid #85582c;width:var(--size)}.bottom{display:flex;justify-content:space-between;align-items:end;gap:20px;margin:28px 0}.advance{text-align:right}.remaining{font-size:17px;max-width:370px;margin:0 0 10px}.summary{max-width:620px;margin:40px auto;text-align:center}.summary p{margin:24px 0}.help{font-size:16px}.comparison{display:grid;gap:14px}.comparison button{display:block;width:100%}.comparison .bread{margin:8px auto}.picture-label{font-weight:800}.why{display:grid;gap:10px}.hint-caption{font-size:15px}.demonstration{background:#dfebf0}.pagecraft-attention{outline:4px solid var(--focus);outline-offset:4px}
.fraction{display:block;width:100%;margin:16px 0}.paint-grid{display:grid;grid-template-columns:repeat(var(--columns),minmax(0,1fr));gap:4px;margin:20px 0}.paint-grid button{min-width:0;padding:8px 0;border-radius:4px}
.match{border:2px solid var(--line);border-radius:12px;margin:0 0 18px;padding:12px;min-width:0}.match legend{font-size:16px}.match .choices button{font-size:18px;padding:8px}.drawing{margin-top:24px;font-size:16px}.drawing summary{min-height:48px;padding:12px;cursor:pointer}.drawing svg{width:100%;background:white;border:2px solid var(--ink);touch-action:none}.drawing svg:focus-visible,summary:focus-visible{outline:4px solid var(--focus);outline-offset:4px}
.whole-frame{border:3px solid var(--ink);padding:6px;background:white}.whole-frame .paint-grid{margin:0}.equal-units{border-left:3px solid var(--ink);padding-left:4px}.equal-units .fraction{margin:8px 0 18px}
@media(max-width:820px){.panels{grid-template-columns:1fr}.panel-title{margin-bottom:12px}.friends{margin:12px 0}.story{margin:12px 0;text-align:center}.wrap{padding:16px}.bread{max-width:400px}.bottom{align-items:center}.advance{flex:1}.toolbar select{max-width:100%}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<a class="skip" href="#activity">Saltar para a atividade</a>
<p class="draft">Rascunho em revisão · Frações com Minecraft</p>
<p id="presentation" class="draft demonstration" hidden>Demonstração · As respostas não ficam registadas.</p>
<div class="wrap">
<header><p class="eyebrow">Uma metade para cada um</p><h1>Vamos descobrir as frações.</h1></header>
<div class="toolbar"><label for="level">Nível de diferenciação</label><select id="level"><option value="support">Com pistas</option><option value="intermediate" selected>Passo a passo</option><option value="challenge">Mais desafios</option></select></div>
<main id="activity" tabindex="-1"></main>
<button id="help" class="help">Preciso de ajuda</button>
<p id="pagecraft-feedback" class="ai-feedback" role="status"></p>
</div>
<script>
(() => {
  'use strict';
  const activity = document.getElementById('activity');
  // Presentation is a local UI mode, never a role or an access credential.
  let learningHost = false;
  const presentation = new URL(location.href).searchParams.get('presentation') === '1';
  document.getElementById('presentation').hidden = !presentation;
  function emit(type, payload = {}) {
    if (presentation || window.parent === window) return;
    window.parent.postMessage({pagecraft:1, type, unitId:unitId(), payload, ts:Date.now()}, '*');
  }
  const state = { page: 0, level: 'intermediate', cut: null, answer: null, comparison: null, inventedCut: null, reason: null, symbol: {cells:[], confirmed:false}, matches:[null,null], grid:{cells:[],confirmed:false}, drawing:[], whole:{cells:[],confirmed:false,answer:null}, comparisons:[null,null] };
  const targets = {support:[1,2], intermediate:[1,4], challenge:[2,5]};
  const associations = {
    support:[{n:1,d:2},{n:1,d:4,word:'um quarto'}],
    intermediate:[{n:1,d:2},{n:3,d:4,word:'três quartos'}],
    challenge:[{n:2,d:5},{n:1,d:4,word:'um quarto'},{n:3,d:4}]
  };
  const gridTargets = {support:[1,2], intermediate:[3,4], challenge:[3,4]};
  const wholeParts = {support:2, intermediate:4, challenge:5};
  const comparisonPairs = {
    support:[[[1,2],[1,4]],[[1,2],[1,2]]],
    intermediate:[[[1,4],[1,2]],[[2,4],[1,2]]],
    challenge:[[[2,5],[1,2]],[[3,4],[2,4]],[[2,4],[1,2]]]
  };
  const pageUnits = ['u1','u1','u2','u3','u3','u4','u5','u5'];
  const unitNames = {u1:'Partilhar o pão',u2:'Partes e símbolo',u3:'Representações',u4:'Unidade inteira',u5:'Comparação'};
  function unitId() { return pageUnits[state.page]; }
  function lastPage() { return 7; }
  function saveWork() {
    if (learningHost) emit('activity_state', {activity:'fracoes-banda-desenhada-2ano', version:2, state:structuredClone(state)});
  }
  function restoreWork(events) {
    if (presentation || !Array.isArray(events)) return;
    const saved = events.filter(e => e?.type === 'activity_state' && e.payload?.activity === 'fracoes-banda-desenhada-2ano' && [1,2].includes(e.payload?.version)).at(-1)?.payload.state;
    if (!saved || !Number.isInteger(saved.page) || saved.page < 0 || saved.page > lastPage() || !['support','intermediate','challenge'].includes(saved.level) ||
        ![null,.25,.5,.75].includes(saved.cut) || ![null,'yes','no'].includes(saved.answer) ||
        ![null,'A','B'].includes(saved.comparison) || ![null,.25,.5,.75].includes(saved.inventedCut) ||
        ![null,'sizes','colour','small'].includes(saved.reason)) return;
    for (const key of ['page','level','cut','answer','comparison','inventedCut','reason']) state[key] = saved[key];
    const symbol = saved.symbol;
    state.symbol = validGrid(symbol, targets[state.level][1]) ? {cells:[...symbol.cells],confirmed:symbol.confirmed} : {cells:[],confirmed:false};
    state.matches = associations[state.level].map((_,i) => ['1/2','1/4','3/4','2/5'].includes(saved.matches?.[i]) ? saved.matches[i] : null);
    state.grid = validGrid(saved.grid, gridTargets[state.level][1]) ? {cells:[...saved.grid.cells],confirmed:saved.grid.confirmed} : {cells:[],confirmed:false};
    state.drawing = Array.isArray(saved.drawing) && saved.drawing.length <= 1000 && saved.drawing.every(p => p && Number.isFinite(p.x) && p.x >= 0 && p.x <= 300 && Number.isFinite(p.y) && p.y >= 0 && p.y <= 180 && typeof p.start === 'boolean') ? saved.drawing : [];
    state.whole = validGrid(saved.whole, wholeParts[state.level]) ? {cells:[...saved.whole.cells],confirmed:saved.whole.confirmed,answer:saved.whole.confirmed && ['yes','no'].includes(saved.whole.answer) ? saved.whole.answer : null} : {cells:[],confirmed:false,answer:null};
    state.comparisons = comparisonPairs[state.level].map((_,i) => ['A','B','equal'].includes(saved.comparisons?.[i]) ? saved.comparisons[i] : null);
    if (state.cut === null) state.answer = null;
    if (state.inventedCut === null) state.reason = null;
    while (!canOpen(state.page)) state.page--;
    document.getElementById('level').value = state.level;
    render();
  }
  function validGrid(value, total) {
    return value && typeof value.confirmed === 'boolean' && Array.isArray(value.cells) &&
      value.cells.length <= total && new Set(value.cells).size === value.cells.length &&
      value.cells.every(n => Number.isInteger(n) && n >= 0 && n < total);
  }
  function fraction(n, d, label = `${n} de ${d} partes iguais pintadas`) {
    return `<svg class="fraction" viewBox="0 0 300 60" role="img" aria-label="${label}">${Array.from({length:d}, (_,i) => `<rect x="${i*300/d}" y="2" width="${300/d}" height="56" fill="${i<n ? '#315e4d' : '#fffdf6'}" stroke="#243c35" stroke-width="2"/>`).join('')}</svg>`;
  }
  function paintGrid(key, total) {
    return `<div class="paint-grid" style="--columns:${key === 'grid' ? 2 : total}" role="group" aria-label="Partes para pintar">${Array.from({length:total}, (_,i) => `<button data-cell="${i}" data-grid="${key}" aria-label="Parte ${i+1}" aria-pressed="${state[key].cells.includes(i)}">${state[key].cells.includes(i) ? '●' : '○'}</button>`).join('')}</div>`;
  }
  function symbolPage() {
    const [n,d] = targets[state.level], work = state.symbol;
    const hint = work.confirmed ? work.cells.length === n ? `<strong>Representaste ${n}/${d}.</strong>${fraction(n,d)}` : `<strong>Compara com a fração pedida.</strong>${fraction(n,d)}<p>${n} pintada${n===1?'':'s'} em ${d} partes iguais.</p>` : '';
    return panels('Uma horta feita de partes iguais.', `<h2>Pinta ${n}/${d}.</h2>${paintGrid('symbol',d)}<p class="prompt">Toca nas partes que queres pintar.</p>${state.level === 'support' ? fraction(n,d,'Pista: uma de duas partes pintadas') : ''}`,
      `<h2>É esta a tua representação?</h2><button data-confirm="symbol">Confirmar representação</button>${feedback(hint)}`);
  }
  function associationPage() {
    const items = associations[state.level];
    const options = state.level === 'challenge' ? ['1/4','2/5','3/4','1/2'] : ['1/2','1/4','3/4'];
    return panels('A imagem, as palavras e o símbolo contam a mesma história.', items.map(({n,d,word},i) => {
      const answer = state.matches[i], correct = answer === `${n}/${d}`;
      return `<fieldset class="match"><legend>Associação ${i+1} de ${items.length}</legend>${word ? `<h2>${word}</h2>` : fraction(n,d)}${state.level === 'support' && word ? fraction(n,d) : ''}<div class="choices">${options.map(option => `<button data-match="${i}" data-value="${option}" aria-pressed="${answer === option}">${option}</button>`).join('')}</div>${feedback(answer === null ? '' : `<strong>${correct ? 'Ligaste as representações.' : 'Olha para as partes pintadas.'}</strong>${fraction(n,d)}<span>${n} em ${d} partes iguais.</span>`)}</fieldset>`;
    }).join(''), '<h2>Que fração combina?</h2><p>Escolhe um símbolo em cada cartão.</p>');
  }
  function drawingPath() {
    return state.drawing.map(p => `${p.start ? 'M' : 'L'}${p.x},${p.y}`).join(' ');
  }
  function drawingMarkup() {
    return `<details class="drawing"><summary>Desenho livre (opcional)</summary><p class="hint-caption">Desenha com o dedo. No teclado, usa as setas e Espaço para traçar.</p><svg id="sketch" viewBox="0 0 300 180" role="img" tabindex="0" aria-label="Desenho livre, sem avaliação"><path d="${drawingPath()}" stroke="#315e4d" stroke-width="4" stroke-linecap="round" fill="none"/><circle id="pen" cx="150" cy="90" r="5" fill="#195ba0"/></svg><button data-clear="drawing">Limpar desenho</button><p>Mostra o desenho ao colega.</p></details>`;
  }
  function gridPage() {
    const [n,d] = gridTargets[state.level], work = state.grid;
    return panels('Cria um mosaico para a tua casa.', `<h2>Mostra ${n}/${d} na grelha.</h2>${paintGrid('grid',d)}<p class="prompt">Toca para pintar ou apagar.</p>${drawingMarkup()}`,
      `<h2>Queres confirmar?</h2><button data-confirm="grid">Confirmar grelha</button>${feedback(work.confirmed ? `<strong>${work.cells.length === n ? `Representaste ${n}/${d}.` : 'Compara as partes pintadas.'}</strong>${fraction(n,d)}` : state.level === 'support' ? fraction(n,d) : '')}`);
  }
  function wholePage() {
    const work = state.whole, d = wholeParts[state.level];
    const hint = work.answer === null ? '' : `<strong>${(work.answer === 'yes') === (work.cells.length === d) ? 'Observaste a moldura inteira.' : 'Olha para os espaços livres.'}</strong>${fraction(work.cells.length,d)}<p>${work.cells.length} de ${d} partes ocupadas.</p>`;
    return panels('Vamos construir o chão de uma casa.', `<h2>Completa a unidade.</h2><div class="whole-frame">${paintGrid('whole',d)}</div><p class="prompt">Toca para colocar ou retirar partes.</p><button data-confirm="whole">Confirmar composição</button>${state.level === 'support' ? fraction(d,d,'Pista: a unidade inteira está preenchida') : ''}`,
      `<h2>Já tens a unidade inteira?</h2><div class="choices">${[['yes','Sim'],['no','Não']].map(([value,label]) => `<button data-whole="${value}" aria-pressed="${work.answer === value}" ${work.confirmed ? '' : 'disabled'}>${label}</button>`).join('')}</div>${feedback(hint)}`);
  }
  function comparisonAnswer(pair) {
    const [[an,ad],[bn,bd]] = pair;
    return an*bd === bn*ad ? 'equal' : an*bd > bn*ad ? 'A' : 'B';
  }
  function comparePage() {
    const pairs = comparisonPairs[state.level];
    return panels('As duas hortas têm o mesmo tamanho.', `<h2>Qual tem mais pintado?</h2>${pairs.map((pair,i) => {
      const answer = state.comparisons[i];
      return `<fieldset class="match"><legend>Comparação ${i+1} de ${pairs.length}</legend><div class="equal-units">${pair.map(([n,d],j) => `<div><b>${j===0?'A':'B'} · ${n}/${d}</b>${fraction(n,d)}</div>`).join('')}</div><div class="choices">${[['A','A'],['B','B'],['equal','Iguais']].map(([value,label]) => `<button data-pair="${i}" data-value="${value}" aria-pressed="${answer === value}">${label}</button>`).join('')}</div>${feedback(answer === null ? '' : `<strong>${answer === comparisonAnswer(pair) ? 'Comparaste a parte pintada.' : 'Alinha as partes pintadas.'}</strong><div class="equal-units">${pair.map(([n,d]) => fraction(n,d)).join('')}</div>`)}</fieldset>`;
    }).join('')}`, `<h2>Compara cada par.</h2><p>Toca em A, B ou Iguais.</p>${state.level === 'support' ? '<p>Começa pelo mesmo lado de cada barra.</p>' : ''}`);
  }
  function bread(cut) {
    const line = cut === null ? '' : `<path d="M${12 + 296 * cut} 6V102" stroke="#fffdf6" stroke-width="9"/><path d="M${12 + 296 * cut} 6V102" stroke="#735031" stroke-width="2" stroke-dasharray="5 5"/>`;
    return `<svg class="bread" viewBox="0 0 320 104" role="img" aria-label="${cut === null ? 'Pão inteiro' : cut === .5 ? 'Duas partes do mesmo tamanho' : 'Duas partes de tamanhos diferentes'}"><path d="M28 12H292V20H306V34H312V76H302V90H286V96H34V90H18V78H8V34H16V20H28Z" fill="#dca458" stroke="#906035" stroke-width="4"/><path d="M36 24H280V32H295V40H25V32H36Z" fill="#f6d49a"/><g stroke="#f7d8a5" stroke-width="9"><path d="M60 45L48 69M108 45L96 69M156 45L144 69M204 45L192 69M252 45L240 69"/></g>${line}</svg>`;
  }
  function cuts(cut) {
    return `<div class="cuts" role="group" aria-label="Escolhe o corte">${[.25,.5,.75].map((value,i) => `<button data-cut="${value}" aria-label="${['Cortar à esquerda','Cortar ao meio','Cortar à direita'][i]}" aria-pressed="${cut === value}"><span class="cut-icon" style="--cut:${value*100}%" aria-hidden="true"></span>${['À esquerda','Ao meio','À direita'][i]}</button>`).join('')}</div>`;
  }
  function comparisonHint(cut) {
    return `<strong>Compara os tamanhos.</strong><span>Encosta as partes pelo mesmo lado.</span><div class="bars" role="img" aria-label="As partes alinhadas para comparar os tamanhos"><span style="--size:${cut*100}%"></span><span style="--size:${(1-cut)*100}%"></span></div>`;
  }
  function completedPages() {
    return [state.cut !== null && state.answer !== null,
      state.level === 'challenge' ? state.inventedCut !== null && state.reason !== null : state.comparison !== null, state.symbol.confirmed, state.matches.every(value => value !== null), state.grid.confirmed, state.whole.confirmed && state.whole.answer !== null, state.comparisons.every(value => value !== null)];
  }
  function canOpen(page) {
    return presentation || completedPages().slice(0, page).every(Boolean);
  }
  function feedback(content) {
    return content ? `<div class="feedback" role="status">${content}</div>` : '';
  }
  function breadAnswerCorrect(cut, answer) { return answer === (cut === .5 ? 'yes' : 'no'); }
  function inventedAnswerCorrect() { return state.inventedCut !== .5 && state.reason === 'sizes'; }
  function cutFeedback(cut, answer) {
    if (answer === null) return '';
    const correct = breadAnswerCorrect(cut, answer);
    return correct ? '<strong>Reparaste nos tamanhos.</strong>' + (cut === .5 ? 'Duas partes iguais formam metades.' : 'Estas partes têm tamanhos diferentes.') : comparisonHint(cut);
  }
  function panels(story, material, question) {
    return `<div class="panels"><section class="panel"><div class="panel-title"><span class="number">1</span>Imagina</div><div class="friends" aria-hidden="true"><div class="friend"><i class="face"></i>Tu</div><div class="friend"><i class="face"></i>Colega</div></div><p class="story">${story}</p></section><section class="panel"><div class="panel-title"><span class="number">2</span>Experimenta</div><div class="scene">${material}</div></section><section class="panel"><div class="panel-title"><span class="number">3</span>Repara</div>${question}</section></div>`;
  }
  function firstPage() {
    const help = state.level === 'support' && state.cut !== null ? `<div class="feedback">${comparisonHint(state.cut)}</div>` : '';
    return panels('Um pão para dois colegas.', `${bread(state.cut)}${cuts(state.cut)}<p class="prompt">Toca onde queres cortar.</p>${help}`,
      `<h2>Ficaram duas metades?</h2><div class="choices"><button data-answer="yes" aria-pressed="${state.answer === 'yes'}" ${state.cut === null ? 'disabled' : ''}>Sim</button><button data-answer="no" aria-pressed="${state.answer === 'no'}" ${state.cut === null ? 'disabled' : ''}>Não</button></div>${feedback(cutFeedback(state.cut,state.answer))}`);
  }
  function secondPage() {
    if (state.level === 'challenge') {
      const hint = state.reason === null ? '' : inventedAnswerCorrect() ? '<strong>As partes têm tamanhos diferentes.</strong>Explica ao colega o que mudarias.' : comparisonHint(state.inventedCut);
      return panels('Inventa uma partilha que não forme metades.', `${bread(state.inventedCut)}${cuts(state.inventedCut)}<p class="prompt">Escolhe outro corte.</p>`,
        `<h2>Porque não são metades?</h2><div class="why">${[['sizes','As partes têm tamanhos diferentes.'],['colour','O pão tem outra cor.'],['small','O pão é pequeno.']].map(([value,label]) => `<button data-reason="${value}" aria-pressed="${state.reason === value}" ${state.inventedCut === null ? 'disabled' : ''}>${label}</button>`).join('')}</div>${feedback(hint)}`);
    }
    const hint = state.comparison === null ? '' : state.comparison === 'A' ? '<strong>Encontraste duas metades.</strong>As partes têm o mesmo tamanho.' : comparisonHint(.25);
    const help = state.level === 'support' ? '<p class="hint-caption">Encosta as partes: devem ocupar o mesmo espaço.</p>' : '<p class="prompt">Conta ao colega o que observaste.</p>';
    return panels('Observa duas maneiras de partilhar.', `<div class="comparison">${[['A',.5],['B',.25]].map(([name,cut]) => `<button aria-label="Partilha ${name}" data-comparison="${name}" aria-pressed="${state.comparison === name}"><span class="picture-label">${name}</span>${bread(cut)}</button>`).join('')}</div>${help}`,
      `<h2>Qual partilha mostra metades?</h2><p>Toca na partilha que escolheste.</p>${feedback(hint)}`);
  }
  function remaining() {
    if (completedPages()[state.page]) return 'Respondeste. Podes corrigir ou continuar.';
    if (state.page === 5) return state.whole.confirmed ? 'Falta responder sobre a unidade inteira.' : 'Falta confirmar a composição e responder.';
    if (state.page === 6) return `Faltam ${state.comparisons.filter(value => value === null).length} comparações.`;
    if (state.page === 3) return `Faltam ${state.matches.filter(value => value === null).length} associações.`;
    if (state.page === 4) return 'Falta confirmar a grelha.';
    if (state.page === 2) return 'Falta confirmar a representação.';
    if (state.page === 0) return state.cut === null ? 'Falta escolher o corte e responder.' : 'Falta responder: ficaram duas metades?';
    if (state.level !== 'challenge') return 'Falta escolher uma partilha.';
    return state.inventedCut === null ? 'Falta inventar o corte e responder.' : 'Falta escolher uma explicação.';
  }
  function render() {
    const nav = `<nav class="steps" aria-label="Páginas da atividade">${['1. Partilhar',state.level === 'challenge' ? '2. Inventar' : '2. Comparar','3. Pintar','4. Associar','5. Grelha','6. Completar','7. Comparar','8. Rever'].map((label,page) => `<button data-page="${page}" ${state.page === page ? 'aria-current="step"' : ''} ${canOpen(page) ? '' : 'disabled'}>${label}</button>`).join('')}</nav>`;
    const content = state.page === lastPage() ? '<section class="summary"><h2>Exploraste as cinco unidades.</h2><p>Podes voltar às respostas e corrigir.</p><p>A construção no Minecraft e a reflexão final estão em preparação.</p><button data-page="0">Voltar às respostas</button></section>' : `<section id="${unitId()}" aria-label="${unitNames[unitId()]}">${state.page === 0 ? firstPage() : state.page === 1 ? secondPage() : state.page === 2 ? symbolPage() : state.page === 3 ? associationPage() : state.page === 4 ? gridPage() : state.page === 5 ? wholePage() : comparePage()}<footer class="bottom"><button data-page="${state.page - 1}" ${state.page === 0 ? 'disabled' : ''}>Voltar</button><div class="advance"><p class="remaining" role="status">${remaining()}</p><button class="primary" data-page="${state.page+1}" ${canOpen(state.page+1) ? '' : 'disabled'}>Seguinte</button></div></footer></section>`;
    activity.innerHTML = nav + content;
  }
  function navigate(page) {
    if (page < 0 || page > lastPage() || !canOpen(page)) return;
    const previousUnit = unitId();
    state.page = page;
    render();
    saveWork();
    if (previousUnit !== unitId() && page < lastPage()) emit('unit_started');
    activity.focus({preventScroll:true});
    activity.scrollIntoView({block:'start'});
  }
  function changeLevel(level, notifyHost = false) {
    if (!['support','intermediate','challenge'].includes(level) || state.level === level) return;
    const changesQuestion = (state.level === 'challenge') !== (level === 'challenge');
    state.whole = {cells:[],confirmed:false,answer:null};
    state.comparisons = comparisonPairs[level].map(() => null);
    state.symbol = {cells:[],confirmed:false};
    state.matches = associations[level].map((item,i) => JSON.stringify(item) === JSON.stringify(associations[state.level][i]) ? state.matches[i] : null);
    if (String(gridTargets[state.level]) !== String(gridTargets[level])) state.grid = {cells:[],confirmed:false};
    state.level = level;
    document.getElementById('level').value = level;
    if (changesQuestion) {
      state.comparison = null; state.inventedCut = null; state.reason = null;
      if (state.page >= 2) state.page = 1;
    }
    while (!canOpen(state.page)) state.page--;
    render();
    if (notifyHost) emit('level_changed', {level});
    saveWork();
  }
  document.getElementById('level').addEventListener('change', event => changeLevel(event.target.value, true));
  activity.addEventListener('click', event => {
    const button = event.target.closest('button');
    if (!button || button.disabled) return;
    if (button.dataset.page !== undefined) { navigate(Number(button.dataset.page)); return; }
    const action = Object.keys(button.dataset)[0];
    const value = button.dataset[action];
    if (action === 'cell') {
      const work = state[button.dataset.grid], cell = Number(value);
      work.cells = work.cells.includes(cell) ? work.cells.filter(n => n !== cell) : [...work.cells,cell];
      work.confirmed = false;
      if (button.dataset.grid === 'whole') work.answer = null;
    }
    if (action === 'confirm') {
      const work = state[value];
      work.confirmed = true;
      const [n,d] = value === 'whole' ? [wholeParts[state.level],wholeParts[state.level]] : (value === 'symbol' ? targets : gridTargets)[state.level];
      emit('attempt', {correct:work.cells.length === n, detail:`${value === 'whole' ? 'Composição' : value === 'grid' ? 'Grelha' : 'Representação'} ${n}/${d}: confirmou ${work.cells.length} partes pintadas em ${d}.`});
    }
    if (action === 'whole') {
      state.whole.answer = value;
      const full = state.whole.cells.length === wholeParts[state.level];
      emit('attempt', {correct:(value === 'yes') === full, detail:`Unidade inteira: ${state.whole.cells.length}/${wholeParts[state.level]}; respondeu ${value === 'yes' ? 'sim' : 'não'}.`});
    }
    if (action === 'pair') {
      const i = Number(value), answer = button.dataset.value, pair = comparisonPairs[state.level][i];
      state.comparisons[i] = answer;
      emit('attempt', {correct:answer === comparisonAnswer(pair), detail:`Comparou ${pair[0].join('/')} e ${pair[1].join('/')}: ${answer === 'equal' ? 'iguais' : answer}.`});
    }
    if (action === 'match') {
      const i = Number(value), answer = button.dataset.value;
      state.matches[i] = answer;
      const {n,d} = associations[state.level][i];
      emit('attempt', {correct:answer === `${n}/${d}`, detail:`Associação ${i+1}: escolheu ${answer} para ${n}/${d}.`});
    }
    if (action === 'clear') state.drawing = [];
    if (action === 'cut') {
      if (state.page === 0) { state.cut = Number(value); state.answer = null; }
      else { state.inventedCut = Number(value); state.reason = null; }
    }
    if (action === 'answer') {
      state.answer = value;
      emit('attempt', {correct:breadAnswerCorrect(state.cut, value), detail:`Partilha: corte ${state.cut*100}%; resposta ${value === 'yes' ? 'sim' : 'não'}.`});
    }
    if (action === 'comparison') {
      state.comparison = value;
      emit('attempt', {correct:value === 'A', detail:`Comparação: escolheu a partilha ${value}.`});
    }
    if (action === 'reason') {
      state.reason = value;
      emit('attempt', {correct:inventedAnswerCorrect(), detail:`Partilha inventada: corte ${state.inventedCut*100}%; explicação: ${button.textContent}`});
    }
    render();
    saveWork();
    activity.querySelector(`[data-${action}="${value}"]${['match','pair'].includes(action) ? `[data-value="${button.dataset.value}"]` : ''}`)?.focus({preventScroll:true});
  });
  let drawingPointer = null;
  let pen = {x:150,y:90};
  function drawPoint(point, start) {
    if (state.drawing.length >= 1000) return;
    state.drawing.push({...point,start});
    document.querySelector('#sketch path')?.setAttribute('d', drawingPath());
  }
  function pointerPoint(event, svg) {
    const box = svg.getBoundingClientRect();
    return {x:Math.max(0,Math.min(300,(event.clientX-box.left)/box.width*300)), y:Math.max(0,Math.min(180,(event.clientY-box.top)/box.height*180))};
  }
  activity.addEventListener('pointerdown', event => {
    const svg = event.target.closest('#sketch');
    if (!svg) return;
    event.preventDefault(); svg.focus(); svg.setPointerCapture(event.pointerId);
    drawingPointer = event.pointerId;
    const point = pointerPoint(event,svg);
    drawPoint(point,true); drawPoint({...point,x:point.x === 300 ? 299.9 : point.x+.1},false);
  });
  activity.addEventListener('pointermove', event => {
    if (event.pointerId !== drawingPointer) return;
    drawPoint(pointerPoint(event,document.getElementById('sketch')),false);
  });
  for (const type of ['pointerup','pointercancel']) activity.addEventListener(type, event => {
    if (event.pointerId === drawingPointer) { drawingPointer = null; saveWork(); }
  });
  activity.addEventListener('keydown', event => {
    if (event.target.id !== 'sketch') return;
    const delta = {ArrowLeft:[-10,0],ArrowRight:[10,0],ArrowUp:[0,-10],ArrowDown:[0,10]}[event.key];
    if (delta) {
      event.preventDefault();
      pen = {x:Math.max(0,Math.min(300,pen.x+delta[0])),y:Math.max(0,Math.min(180,pen.y+delta[1]))};
      document.getElementById('pen').setAttribute('cx',pen.x);
      document.getElementById('pen').setAttribute('cy',pen.y);
    }
    if (event.key === ' ') {
      event.preventDefault();
      drawPoint(pen,true); drawPoint({x:pen.x === 300 ? 299.9 : pen.x+.1,y:pen.y},false); saveWork();
    }
  });
  window.addEventListener('message', event => {
    if (event.source !== window.parent || window.parent === window) return;
    const d = event.data;
    if (!d || d.pagecraft !== 1) return;
    if (d.type === 'learning_restore') restoreWork(d.payload?.events);
    if (d.type === 'learning_preferences') { learningHost = true; changeLevel(d.payload?.level); }
    if (d.type === 'highlight' && Object.hasOwn(unitNames,d.unitId)) {
      navigate(pageUnits.indexOf(d.unitId));
      activity.classList.add('pagecraft-attention');
      setTimeout(() => activity.classList.remove('pagecraft-attention'), 6000);
    }
    if (d.type === 'ai_feedback' && typeof d.payload?.text === 'string') {
      document.getElementById('pagecraft-feedback').textContent = d.payload.text;
    }
  });
  document.getElementById('help').addEventListener('click', () => {
    emit('help_needed', {note:'Preciso de ajuda nesta página de frações.'});
    document.getElementById('pagecraft-feedback').textContent = presentation ? 'Na demonstração, experimenta comparar os tamanhos.' : window.parent === window ? 'Pede ao professor para olhar contigo para as partes.' : 'Pediste ajuda ao professor.';
  });
  render();
  emit('activity_loaded', {title:document.title});
  emit('unit_started');
  setInterval(() => emit('heartbeat'), 15000);
})();
</script>
</body>
